<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PainPath — Học điều trị đau mạn tính</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5d59d8">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PainPath">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;padding:0}

/* Layout theo AnesDose: header trắng dính trên cùng (brand + chip thông tin + hàng tab pill màu nhận diện), nội dung là các thẻ có dải tiêu đề màu của tab */
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#12161c; --muted:#5d6b7a; --line:#e3e8ee;
  --accent:#0f6fb8; --accent-soft:#e7f1f9; --warn:#b4530a; --warn-soft:#fdf1e3;
  --danger:#b3261e; --danger-soft:#fdecea; --ok:#1a7f57; --ok-soft:#e7f4ee;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --tap:44px; --on-accent:#ffffff;
  --t-home:#067491; --t-home-soft:#e8f8ff;
  --t-road:#5d59d8; --t-road-soft:#f6f3ff;
  --t-card:#007965; --t-card-soft:#e7f9f3;
  --t-quiz:#b45309; --t-quiz-soft:#fff4e5;
  --t-book:#6729ae; --t-book-soft:#f7f3fc;
  --m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --card:#161b22; --ink:#e8edf3; --muted:#9bacbe; --line:#252c36;
  --accent:#4ea8f0; --accent-soft:#12293c; --warn:#e5a05a; --warn-soft:#2e2313;
  --danger:#ff8a80; --danger-soft:#33191a; --ok:#5fd0a0; --ok-soft:#12291f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); --on-accent:#0e1116;
  --t-home:#02c5f5; --t-home-soft:#163945; --t-road:#baabff; --t-road-soft:#363247;
  --t-card:#06cdac; --t-card-soft:#1b3a32; --t-quiz:#f6ad55; --t-quiz-soft:#3d2a12;
  --t-book:#c99cfc; --t-book-soft:#322145; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#161b22; --ink:#e8edf3; --muted:#9bacbe; --line:#252c36;
  --accent:#4ea8f0; --accent-soft:#12293c; --warn:#e5a05a; --warn-soft:#2e2313;
  --danger:#ff8a80; --danger-soft:#33191a; --ok:#5fd0a0; --ok-soft:#12291f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); --on-accent:#0e1116;
  --t-home:#02c5f5; --t-home-soft:#163945; --t-road:#baabff; --t-road-soft:#363247;
  --t-card:#06cdac; --t-card-soft:#1b3a32; --t-quiz:#f6ad55; --t-quiz-soft:#3d2a12;
  --t-book:#c99cfc; --t-book-soft:#322145; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:baseline;gap:10px;padding:12px 0 8px}
.brand h1{font-size:17px;margin:0;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted)}
.derived{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 11px;font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums;border:0}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;min-height:var(--tap);border:1.5px solid var(--tc,var(--line));background:var(--bg);color:var(--tc,var(--muted));padding:9px 16px;border-radius:999px;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:background .12s}
nav.tabs button[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:var(--on-accent)}
main{padding-block:14px 40px}
.grpbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.grpbar:empty{display:none}
.grpbar button{flex:1 1 auto;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.grpbar button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grpbar button:disabled{opacity:.4;cursor:default}
.grpbar.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.grpbar.scroll button{flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card>h2{margin:0;padding:12px 14px 12px 12px;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);font-weight:800;border-bottom:1px solid var(--line);border-left:4px solid var(--accent);background:var(--accent-soft)}
.body{padding:12px 14px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:none}
.row .nm{font-weight:650}
.row .sub{grid-column:1;font-size:12px;color:var(--muted);line-height:1.4}
.row .val{grid-column:2;grid-row:1/3;align-self:start;text-align:right;font-variant-numeric:tabular-nums;font-weight:750;font-size:19px;color:var(--accent);white-space:nowrap}
.row .val small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.row.ok .val{color:var(--ok)}
.note{padding:10px 14px;font-size:12.5px;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:13px}
.flexr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:var(--tap);border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.bar{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.title{font-size:17px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips .chip{font-family:var(--m);font-size:11px;padding:2px 8px;cursor:pointer}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.done{background:var(--ok-soft);color:var(--ok)}.tag.rev{background:var(--warn-soft);color:var(--warn)}
details.wk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
details.wk>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
details.wk>summary::-webkit-details-marker{display:none}
details.wk[open]>summary{border-bottom:1px solid var(--line)}
.pill{flex:0 0 auto;background:var(--accent);color:var(--on-accent);border-radius:7px;padding:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.wt{min-width:0;flex:1}.wt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.wc{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wc.full{color:var(--ok)}
.goal{margin:0;padding:10px 14px;font-size:12.5px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.days{list-style:none;margin:0;padding:0}
.days li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.days li:last-child{border-bottom:0}
.days input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.days .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.days b{display:block;font-weight:650}
.days li.on b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.flip{perspective:1000px;cursor:pointer;margin-bottom:14px}
.flip .in{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto;border-left:4px solid var(--accent)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .q{font-size:17px;font-weight:700}
.face .s{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.cardnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.opt{display:block;width:100%;text-align:left;min-height:var(--tap);border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;cursor:pointer;font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.banner{border-radius:var(--radius);padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5;background:var(--warn-soft);color:var(--warn)}
.src a{font-family:var(--m);font-size:12px;word-break:break-all;color:var(--accent)}
.lv{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:5px;margin-right:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.flash{outline:2px solid var(--accent)}
input[type=date]{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-size:17px;font-weight:650}
.empty{text-align:center;padding:26px 14px}
.big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
footer{padding:4px 0 30px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
.lessonbtn{margin-top:6px;min-height:36px;padding:5px 12px;font-size:13px}
.lesson{padding:14px;display:grid;gap:10px;font-size:15.5px;line-height:1.65}
.lesson .lead{font-size:16px;color:var(--ink);margin:0}
.lesson h3{margin:10px 0 0;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent)}
.lesson p,.lesson ol,.lesson ul{margin:0}
.lesson ol,.lesson ul{padding-left:20px;display:grid;gap:4px}
.lesson table{font-size:13.5px;line-height:1.45}
.lesson th,.lesson td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal;min-width:110px}
.lesson th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
.ev{background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px}
.case{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.case details{margin-top:6px}.case summary{cursor:pointer;font-weight:700;color:var(--accent)}
.steps{display:grid;gap:8px}.steps div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.lnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>PainPath</h1><span>Học điều trị đau mạn tính</span></div>
  <div class="derived" id="derived"></div>
  <nav class="tabs" id="nav" role="tablist"></nav>
</div></header>
<main class="wrap" id="mainwrap">
  <div class="grpbar" id="subtabs"></div>
  <div id="main"></div>
  <footer>Tiến độ lưu trên trình duyệt của thiết bị này · Nguồn có DOI trong tab Nguồn</footer>
</main>

 SIS:{lvl:"tb",t:"Spine Intervention Society. Practice Guidelines for Spinal Diagnostic & Treatment Procedures (Bogduk N, ed.), 2nd ed. 2014",n:"Chuẩn kỹ thuật dưới C-arm. Có thể đã có bản mới hơn; em chưa xác minh được, nên kiểm tra trên trang của hội (nay là IPSIS).",url:"https://www.spineintervention.org"},

"0-0": {t:"ICD-11: bảy nhóm đau mạn", min:15, src:["ICD11","BENN19"], h:`
<p class="lead">Lần đầu tiên, bảng phân loại bệnh quốc tế có một hệ thống mã riêng cho đau mạn. Hiểu cấu trúc này giúp ghi chẩn đoán thống nhất và nhìn đau mạn như một vấn đề cần điều trị riêng, không chỉ là triệu chứng của bệnh khác.</p>

<h3>Bối cảnh</h3>
<p>ICD-10 không có cách mã hóa có hệ thống cho đau mạn, nên bệnh nhân đau mạn gần như "vô hình" trong thống kê và trong hồ sơ. Một nhóm công tác của IASP do Treede và Rief đứng đầu đã xây dựng phân loại mới cùng WHO. Đại hội đồng Y tế Thế giới thông qua ICD-11 ngày 25/5/2019 và ICD-11 có hiệu lực từ 01/01/2022. Phân loại đã được thử nghiệm thực địa trước khi đưa vào sử dụng.</p>

<h3>Định nghĩa</h3>
<p><b>Đau mạn</b> là đau kéo dài hoặc tái diễn trên 3 tháng. Đây là mốc duy nhất về thời gian; ICD-11 không dùng mốc 6 tháng.</p>

<h3>Cấu trúc: 1 nhóm nguyên phát và 6 nhóm thứ phát</h3>
<div class="scrollx"><table>
<tr><th>Nhóm</th><th>Ý nghĩa</th><th>Ví dụ</th></tr>
<tr><td><b>Đau mạn nguyên phát</b></td><td>Đau là vấn đề chính, không giải thích tốt hơn bằng bệnh khác</td><td>Đau cơ xơ hóa, CRPS, đau thắt lưng mạn không đặc hiệu</td></tr>
<tr><td>Liên quan ung thư</td><td>Do khối u, di căn, hoặc do điều trị ung thư</td><td>Đau do di căn xương, đau thần kinh do hóa trị</td></tr>
<tr><td>Sau phẫu thuật hoặc chấn thương</td><td>Xuất hiện hoặc tăng lên sau mổ hay chấn thương, kéo dài quá thời gian lành</td><td>Đau mạn sau mổ thoát vị bẹn, sau mổ vú</td></tr>
<tr><td>Thần kinh</td><td>Do tổn thương hoặc bệnh của hệ cảm giác thân thể</td><td>Đau sau zona, đau đa dây thần kinh do đái tháo đường</td></tr>
<tr><td>Đau đầu hoặc vùng mặt thứ phát</td><td>Do một bệnh nền xác định</td><td>Đau đầu do cổ, đau dây V thứ phát</td></tr>
<tr><td>Nội tạng thứ phát</td><td>Do bệnh tạng xác định</td><td>Đau do viêm tụy mạn</td></tr>
<tr><td>Cơ xương khớp thứ phát</td><td>Do bệnh xương khớp xác định</td><td>Đau do thoái hóa khớp, viêm khớp dạng thấp</td></tr>
</table></div>
<p class="muted small">Trong ICD-11 các mục này nằm dưới mã MG30 (MG30.0 là đau mạn nguyên phát). Nên tra lại mã chi tiết trên ICD-11 Browser của WHO trước khi dùng cho hồ sơ.</p>

<h3>Mã mở rộng: mô tả thêm cho chẩn đoán</h3>
<p>Ngoài mã chẩn đoán, ICD-11 cho phép ghi thêm <b>mức độ nặng</b> theo ba chiều: cường độ đau, mức phiền muộn và mức cản trở hoạt động. Có thể ghi thêm diễn tiến theo thời gian (liên tục, từng cơn) và sự hiện diện của yếu tố tâm lý – xã hội. Điểm quan trọng là mức độ nặng không chỉ là con số NRS.</p>

<h3>Ý nghĩa với thực hành</h3>
<p>Thứ nhất, với đau thứ phát, nên ghi cả bệnh nền và mã đau mạn. Ví dụ bệnh nhân thoái hóa khớp gối đau 2 năm có hai chẩn đoán: thoái hóa khớp (bệnh nền) và đau mạn cơ xương khớp thứ phát. Cách ghi này cho thấy đau cần một kế hoạch riêng. Thứ hai, nhóm đau mạn liên quan ung thư phân biệt rõ đau do bản thân khối u với đau do điều trị và đau do bệnh kèm không liên quan, giúp định hướng điều trị khác nhau cho người đang điều trị và người đã khỏi ung thư (Bennett 2019).</p>

<div class="ev"><b>Loại bằng chứng.</b> Đây là hệ thống phân loại xây dựng bằng đồng thuận chuyên gia và thử nghiệm thực địa, không phải kết quả từ RCT. Giá trị của nó nằm ở tính thống nhất khi ghi chẩn đoán.</div>

<div class="case"><b>Tự kiểm tra.</b> Bệnh nhân nữ 58 tuổi, đau vai trái 5 tháng sau gãy đầu trên xương cánh tay đã liền xương. Xếp vào nhóm nào? <details><summary>Xem gợi ý</summary>Đau mạn sau chấn thương (thứ phát). Cần khám thêm để xem có thành phần thần kinh hay đủ tiêu chuẩn CRPS (khi đó CRPS thuộc nhóm nguyên phát).</details></div>
`},

"0-1": {t:"Đau mạn nguyên phát", min:15, src:["ICD11","NICE"], h:`
<p class="lead">"Nguyên phát" không có nghĩa là không rõ nguyên nhân hay do tâm lý. Nó có nghĩa là chính cơn đau, cùng mức phiền muộn và giảm chức năng đi kèm, là vấn đề chính cần điều trị.</p>

<h3>Tiêu chuẩn chẩn đoán</h3>
<p>Một bệnh nhân được chẩn đoán đau mạn nguyên phát khi đủ cả bốn điều kiện:</p>
<ol>
<li>Đau ở một hay nhiều vùng cơ thể.</li>
<li>Kéo dài hoặc tái diễn trên 3 tháng.</li>
<li>Kèm rối loạn cảm xúc đáng kể (lo âu, giận dữ, thất vọng, khí sắc trầm) <b>hoặc</b> giảm chức năng đáng kể trong sinh hoạt và tham gia xã hội.</li>
<li>Không được giải thích tốt hơn bằng một tình trạng đau mạn khác.</li>
</ol>
<p>Điều kiện thứ tư là điểm dễ nhầm. Có thể có bất thường trên phim (thoái hóa, phồng đĩa đệm) nhưng nếu bất thường đó không đủ giải thích mức đau và mức ảnh hưởng, vẫn có thể chẩn đoán đau nguyên phát. NICE diễn đạt là đau không có nguyên nhân rõ ràng, hoặc đau và tác động của nó không tương xứng với tổn thương quan sát được.</p>

<h3>Năm nhóm con</h3>
<div class="scrollx"><table>
<tr><th>Nhóm con</th><th>Ví dụ thường gặp</th></tr>
<tr><td>Đau lan tỏa mạn</td><td>Đau cơ xơ hóa</td></tr>
<tr><td>Hội chứng đau vùng phức hợp (CRPS)</td><td>CRPS sau gãy đầu dưới xương quay</td></tr>
<tr><td>Đau đầu hoặc vùng mặt nguyên phát</td><td>Migraine mạn, đau đầu căng thẳng mạn, rối loạn thái dương hàm mạn, hội chứng bỏng rát miệng</td></tr>
<tr><td>Đau nội tạng nguyên phát</td><td>Hội chứng ruột kích thích, đau vùng chậu mạn nguyên phát</td></tr>
<tr><td>Đau cơ xương khớp nguyên phát</td><td>Đau thắt lưng mạn không đặc hiệu, đau cổ mạn không đặc hiệu</td></tr>
</table></div>
<p>CRPS nằm trong nhóm nguyên phát dù thường khởi phát sau chấn thương, vì cơ chế và tiêu chuẩn chẩn đoán của nó không quy về một tổn thương mô cụ thể.</p>

<h3>Tại sao phân biệt nguyên phát và thứ phát lại quan trọng</h3>
<p>Hai nhóm có hướng điều trị khác nhau. NICE NG193 chỉ đưa khuyến cáo điều trị cho đau mạn nguyên phát: ưu tiên chương trình vận động, liệu pháp tâm lý (CBT, ACT), châm cứu trong một số bối cảnh, và cân nhắc thuốc chống trầm cảm. NICE khuyến cáo không khởi trị nhiều nhóm thuốc cho nhóm này, trong đó có opioid và gabapentinoid. Hội Đau Anh đã phản biện một số khuyến cáo hạn chế này; phần điều trị sẽ học ở giai đoạn 2. Với đau thứ phát, điều trị bệnh nền và cơ chế cụ thể (ví dụ thuốc cho đau thần kinh, can thiệp khớp mặt sau) có vai trò lớn hơn.</p>

<div class="ev"><b>Loại bằng chứng.</b> Tiêu chuẩn chẩn đoán là đồng thuận. Các khuyến cáo điều trị của NICE dựa trên tổng quan hệ thống, nhưng nhiều khuyến cáo có độ chắc chắn thấp, nên cần đọc kèm phản biện.</div>

<div class="case"><b>Tự kiểm tra.</b> Nam 45 tuổi, đau thắt lưng 1 năm, MRI có phồng đĩa đệm L4–L5 không chèn rễ, không có triệu chứng rễ, nghỉ việc 3 tháng vì đau, mất ngủ. Chẩn đoán nào hợp lý? <details><summary>Xem gợi ý</summary>Đau mạn nguyên phát cơ xương khớp (đau thắt lưng mạn không đặc hiệu). Phồng đĩa đệm không chèn rễ không giải thích tốt hơn mức đau và mức giảm chức năng. Ghi thêm mức độ nặng và yếu tố tâm lý – xã hội.</details></div>
`},

"0-2": {t:"Ba mô tả cơ chế đau", min:20, src:["FIN16","KOSEK","FITZ"], h:`
<p class="lead">ICD-11 trả lời câu hỏi "bệnh nhân bị gì". Mô tả cơ chế trả lời câu hỏi "đau được tạo ra như thế nào", và câu trả lời này quyết định chọn thuốc hay chọn can thiệp.</p>

<h3>Định nghĩa</h3>
<p><b>Đau cảm thụ (nociceptive)</b>: đau do tổn thương thực sự hoặc nguy cơ tổn thương ở mô không phải thần kinh, thông qua hoạt hóa thụ thể cảm thụ đau. Ví dụ: đau khớp do thoái hóa, đau xương do di căn.</p>
<p><b>Đau thần kinh (neuropathic)</b>: đau là hậu quả trực tiếp của tổn thương hoặc bệnh ảnh hưởng <i>hệ cảm giác thân thể</i>. Chia thành ngoại biên (đau sau zona, bệnh đa dây thần kinh) và trung ương (sau đột quỵ, tổn thương tủy). Tổn thương thần kinh vận động hay thần kinh tự chủ đơn thuần không đủ để gọi là đau thần kinh.</p>
<p><b>Đau nociplastic</b>: đau do quá trình cảm thụ đau bị biến đổi, dù không có bằng chứng rõ về tổn thương mô hoạt hóa thụ thể ngoại biên, cũng không có bằng chứng về tổn thương hay bệnh của hệ cảm giác thân thể. Ví dụ điển hình là đau cơ xơ hóa.</p>

<h3>Dấu hiệu lâm sàng gợi ý</h3>
<div class="scrollx"><table>
<tr><th></th><th>Cảm thụ</th><th>Thần kinh</th><th>Nociplastic</th></tr>
<tr><td>Phân bố</td><td>Khu trú tại cấu trúc tổn thương</td><td>Theo vùng chi phối của dây, rễ hoặc đường dẫn truyền</td><td>Lan theo vùng, không theo giải phẫu thần kinh</td></tr>
<tr><td>Tính chất</td><td>Nhức, đau khi cử động hay chịu lực</td><td>Rát, điện giật, kim châm, tê</td><td>Âm ỉ, lan tỏa, thay đổi</td></tr>
<tr><td>Khám</td><td>Đau khi ấn hay vận động cấu trúc đó</td><td>Dấu hiệu cảm giác âm tính (giảm cảm giác) và dương tính (allodynia) trong vùng chi phối</td><td>Tăng nhạy cảm đau lan rộng, không kèm tổn thương tương xứng</td></tr>
<tr><td>Kèm theo</td><td>Tương xứng với mức viêm, tổn thương</td><td>Có bệnh hay tổn thương thần kinh liên quan</td><td>Mệt mỏi, rối loạn giấc ngủ, khó tập trung, nhạy cảm âm thanh, ánh sáng</td></tr>
</table></div>

<h3>Ba điểm dễ nhầm</h3>
<p>Thứ nhất, nociplastic <b>không đồng nghĩa</b> với "nhạy cảm hóa trung ương". Nhạy cảm hóa trung ương là thuật ngữ sinh lý thần kinh, còn nociplastic là mô tả cơ chế dùng trong lâm sàng (Kosek 2021). Thứ hai, nociplastic <b>không đồng nghĩa</b> với đau mạn nguyên phát: một bên là mô tả cơ chế, một bên là chẩn đoán ICD-11. Thứ ba, ba cơ chế <b>có thể cùng tồn tại</b> trên một bệnh nhân. Ví dụ đau thắt lưng có cả thành phần cảm thụ từ khớp mặt sau, thành phần thần kinh từ rễ, và thành phần nociplastic.</p>

<h3>Vì sao điều này quan trọng với người làm can thiệp</h3>
<p>Thủ thuật can thiệp chủ yếu nhắm vào nguồn đau cảm thụ (khớp mặt sau, khớp cùng chậu) hoặc nguồn đau thần kinh khu trú (rễ, dây ngoại biên). Khi thành phần nociplastic chiếm ưu thế, có thể suy luận rằng hiệu quả của can thiệp sẽ thấp hơn. Đây là suy luận từ cơ chế, chưa phải kết luận từ RCT so sánh trực tiếp, nên cần chọn bệnh nhân cẩn thận.</p>

<div class="ev"><b>Loại bằng chứng.</b> Các định nghĩa là thuật ngữ IASP (đồng thuận). Bảng dấu hiệu gợi ý là tổng hợp lâm sàng từ các tổng quan; không dấu hiệu đơn lẻ nào đủ để chẩn đoán.</div>
`},

"0-3": {t:"Phân độ đau thần kinh: possible, probable, definite", min:20, src:["FIN16"], h:`
<p class="lead">Hệ thống phân độ của NeuPSIG (Finnerup 2016) biến câu hỏi "có phải đau thần kinh không" thành một quy trình từng bước, dùng được tại giường bệnh.</p>

<h3>Quy trình ba bước</h3>
<div class="steps">
<div><b>Bước 1 → Possible.</b> Bệnh sử có tổn thương hoặc bệnh thần kinh liên quan, <b>và</b> vùng đau hợp lý về mặt giải phẫu thần kinh (khớp với vùng chi phối của tổn thương đó).</div>
<div><b>Bước 2 → Probable.</b> Thêm vào đó, khám thấy <b>dấu hiệu cảm giác</b> trong chính vùng phân bố hợp lý ấy. Dấu hiệu có thể âm tính (giảm hoặc mất cảm giác chạm, kim, nóng, lạnh) hoặc dương tính (allodynia, tăng cảm đau).</div>
<div><b>Bước 3 → Definite.</b> Thêm vào đó, có <b>xét nghiệm xác nhận</b> tổn thương hoặc bệnh của hệ cảm giác thân thể, ví dụ điện cơ – dẫn truyền thần kinh, hình ảnh học, sinh thiết da đếm sợi thần kinh nhỏ, QST.</div>
</div>
<p>Bản 2016 sắp xếp lại thứ tự cho sát thực hành: bắt đầu từ bệnh sử, rồi đến khám, cuối cùng mới đến xét nghiệm.</p>

<h3>Vai trò của bộ câu hỏi sàng lọc</h3>
<p>DN4, LANSS và painDETECT giúp nhận ra bệnh nhân <i>có khả năng</i> có thành phần thần kinh, hữu ích khi khám nhanh hay khi người khám chưa quen. Nhưng chúng không nằm trong các bậc phân độ: một bộ câu hỏi dương tính không làm bệnh nhân thành "probable" hay "definite". Muốn lên bậc vẫn phải khám và làm xét nghiệm.</p>

<h3>Vùng phân bố "hợp lý về giải phẫu"</h3>
<div class="scrollx"><table>
<tr><th>Bệnh</th><th>Vùng đau và rối loạn cảm giác điển hình</th><th>Xét nghiệm có thể xác nhận</th></tr>
<tr><td>Đa dây thần kinh do đái tháo đường</td><td>Đối xứng hai bên, ở xa (kiểu đi tất, đi găng)</td><td>Dẫn truyền thần kinh; sinh thiết da khi tổn thương sợi nhỏ</td></tr>
<tr><td>Đau sau zona</td><td>Một khoanh da, một bên</td><td>Chưa có xét nghiệm xác nhận dùng thường quy; xem bảng gợi ý trong Finnerup 2016</td></tr>
<tr><td>Bệnh lý rễ thắt lưng</td><td>Theo khoanh da của rễ</td><td>MRI tương hợp, điện cơ</td></tr>
<tr><td>Đau sau đột quỵ</td><td>Vùng cơ thể tương ứng tổn thương não</td><td>CT hoặc MRI sọ não</td></tr>
<tr><td>Tổn thương dây sau mổ</td><td>Vùng chi phối của dây bị tổn thương</td><td>Dẫn truyền thần kinh, siêu âm thần kinh</td></tr>
</table></div>

<h3>Lời cảnh báo của chính tác giả</h3>
<p>Ngay cả mức "definite" cũng <b>không luôn chứng minh quan hệ nhân quả</b>. Một bệnh nhân đái tháo đường có bệnh đa dây thần kinh đã xác nhận vẫn có thể đau bàn chân vì nguyên nhân khác. Phân độ cho biết mức độ chắc chắn về sự hiện diện của tổn thương thần kinh, không thay cho phán đoán lâm sàng.</p>

<div class="ev"><b>Loại bằng chứng.</b> Hệ thống phân độ là đồng thuận chuyên gia của NeuPSIG, xây dựng sau khi phân tích cách bản 2008 được sử dụng trong các nghiên cứu. Đây là công cụ chuẩn hóa, không phải xét nghiệm có độ nhạy và độ đặc hiệu được xác lập.</div>

<div class="case"><b>Tự kiểm tra.</b> Nữ 62 tuổi, 4 tháng sau mổ cắt vú phải, đau rát mặt trong cánh tay phải và hõm nách, khám thấy giảm cảm giác kim châm và allodynia đúng vùng đó. Phân độ? <details><summary>Xem gợi ý</summary>Probable: có phẫu thuật nạo hạch nách có thể tổn thương dây bì cánh tay trong hoặc dây liên sườn – cánh tay, vùng đau hợp lý, có dấu hiệu cảm giác cùng vùng. Cần xét nghiệm xác nhận tổn thương dây mới thành definite.</details></div>
`},

"0-4": {t:"Đau hỗn hợp và chẩn đoán thay đổi theo thời gian", min:15, src:["NICE","FITZ","KOSEK"], h:`
<p class="lead">Trong thực tế, phần lớn bệnh nhân đau mạn không nằm gọn trong một ô. Chẩn đoán tốt là chẩn đoán nhiều lớp và được xem lại định kỳ.</p>

<h3>Đau nguyên phát và thứ phát có thể cùng tồn tại</h3>
<p>NICE NG193 nêu rõ hai nhóm này có thể có mặt cùng lúc trên một bệnh nhân. Khi đó dùng phán đoán lâm sàng để quyết định cùng bệnh nhân nên điều trị phần nào trước. Ví dụ một bệnh nhân viêm khớp dạng thấp đã kiểm soát tốt viêm nhưng vẫn đau lan tỏa toàn thân, mệt, mất ngủ: có thể vừa có đau cơ xương khớp thứ phát vừa có đau lan tỏa mạn nguyên phát. Các tổng quan về nociplastic (Fitzcharles 2021) mô tả hiện tượng thành phần nociplastic chồng lên các bệnh viêm và thoái hóa.</p>

<h3>Đau hỗn hợp về cơ chế</h3>
<div class="scrollx"><table>
<tr><th>Tình huống</th><th>Các thành phần có thể có</th></tr>
<tr><td>Đau thắt lưng có lan xuống chân</td><td>Cảm thụ (khớp mặt sau, đĩa đệm) + thần kinh (rễ) ± nociplastic</td></tr>
<tr><td>Đau do ung thư di căn cột sống</td><td>Cảm thụ (xương) + thần kinh (chèn rễ, đám rối)</td></tr>
<tr><td>Thoái hóa khớp gối lâu năm</td><td>Cảm thụ + nociplastic ở một số bệnh nhân</td></tr>
<tr><td>Đau sau mổ kéo dài</td><td>Cảm thụ (sẹo, cơ) + thần kinh (tổn thương dây)</td></tr>
</table></div>
<p>Ghi rõ từng thành phần giúp chọn điều trị phù hợp: thuốc cho đau thần kinh nhắm vào thành phần thần kinh, block hoặc RF nhắm vào nguồn cảm thụ khu trú, còn vận động trị liệu và liệu pháp tâm lý quan trọng hơn khi có thành phần nociplastic.</p>

<h3>Chẩn đoán có thể thay đổi</h3>
<p>NICE khuyến cáo nhận thức rằng chẩn đoán đau mạn nguyên phát ban đầu có thể thay đổi theo thời gian, và cần đánh giá lại khi bệnh cảnh thay đổi. Ba tình huống cần nghĩ lại chẩn đoán:</p>
<ul>
<li>Xuất hiện triệu chứng mới, đặc biệt là red flags (sụt cân, sốt, dấu hiệu thần kinh mới).</li>
<li>Không đáp ứng như dự kiến với điều trị đúng cơ chế.</li>
<li>Kiểu đau thay đổi rõ (lan rộng, đổi tính chất).</li>
</ul>

<h3>Tránh hai cái bẫy</h3>
<p>Bẫy thứ nhất là gán nhãn "đau do tâm lý" khi không tìm được tổn thương. Định nghĩa đau của IASP 2020 và khái niệm nociplastic đều nhấn mạnh rằng đau không có tổn thương nhìn thấy vẫn là đau thật. Bẫy thứ hai là ngược lại: đổ hết cho tổn thương trên phim, như thoái hóa hay phồng đĩa đệm, trong khi chúng thường gặp cả ở người không đau.</p>

<div class="ev"><b>Loại bằng chứng.</b> Nguyên tắc "chẩn đoán nhiều lớp, đánh giá lại" là khuyến cáo thực hành của NICE và đồng thuận chuyên gia. Bảng đau hỗn hợp là minh họa lâm sàng, không phải tiêu chuẩn chẩn đoán.</div>
`},

"0-5": {t:"Thực hành phân loại: 5 ca mẫu", min:20, src:["ICD11","FIN16","KOSEK","WOLFE16"], h:`
<p class="lead">Với mỗi ca, tự ghi ra ba dòng trước khi mở đáp án: (1) nhóm ICD-11, (2) các thành phần cơ chế, (3) nếu có thành phần thần kinh thì phân độ. Sau đó làm tương tự với 5 bệnh nhân thật của anh/chị.</p>

<div class="case"><b>Ca 1.</b> Nam 52 tuổi, đau thắt lưng 8 tháng, không lan xuống chân, đau tăng khi ngồi lâu, khám thần kinh bình thường, MRI thoái hóa nhẹ L4–L5, L5–S1. Sợ vận động, đã nghỉ việc 2 tháng.
<details><summary>Đáp án gợi ý</summary>ICD-11: đau mạn nguyên phát cơ xương khớp (đau thắt lưng mạn không đặc hiệu), vì thoái hóa nhẹ không giải thích tốt hơn mức đau và mức giảm chức năng. Cơ chế: chưa xác định; có thể có thành phần cảm thụ (khớp mặt sau, cần khám thêm và cân nhắc block chẩn đoán ở giai đoạn sau). Cần ghi mức độ nặng và cờ vàng (sợ vận động).</details></div>

<div class="case"><b>Ca 2.</b> Nữ 70 tuổi, zona ngực phải T5 cách 5 tháng. Hiện đau rát, đau như điện giật dải ngực phải, áo chạm vào cũng đau. Khám: allodynia khi chạm bông và giảm cảm giác kim châm đúng khoanh da T5 phải.
<details><summary>Đáp án gợi ý</summary>ICD-11: đau mạn thần kinh ngoại biên, đau sau zona. Phân độ: tối thiểu probable (bệnh liên quan, vùng hợp lý, có dấu hiệu cảm giác cùng vùng). Cơ chế: thần kinh.</details></div>

<div class="case"><b>Ca 3.</b> Nam 38 tuổi, 6 tháng sau mổ thoát vị bẹn trái đặt lưới, đau rát vùng bẹn lan xuống bìu trái, tê bì vùng da quanh sẹo.
<details><summary>Đáp án gợi ý</summary>ICD-11: đau mạn sau phẫu thuật. Có thể có thành phần thần kinh do tổn thương dây chậu bẹn, chậu hạ vị hoặc nhánh sinh dục của dây sinh dục đùi: possible, lên probable nếu khám thấy dấu hiệu cảm giác đúng vùng chi phối. Có thể kèm thành phần cảm thụ quanh sẹo và lưới.</details></div>

<div class="case"><b>Ca 4.</b> Nữ 64 tuổi, ung thư vú di căn xương, đau cột sống ngực âm ỉ liên tục, đau tăng khi xoay người, có cơn đau lan theo dải quanh ngực.
<details><summary>Đáp án gợi ý</summary>ICD-11: đau mạn liên quan ung thư (đau do ung thư). Cơ chế hỗn hợp: cảm thụ (xương) + có thể thần kinh (chèn rễ ngực, gợi ý bởi đau lan theo dải). Cần loại trừ chèn ép tủy nếu có dấu hiệu thần kinh mới.</details></div>

<div class="case"><b>Ca 5.</b> Nữ 41 tuổi, đau nhiều vùng (cổ, vai, lưng, hông, hai chân) trên 1 năm, mệt mỏi, ngủ không sâu, khó tập trung, xét nghiệm viêm bình thường.
<details><summary>Đáp án gợi ý</summary>ICD-11: đau mạn nguyên phát, đau lan tỏa mạn. Cần đánh giá theo tiêu chuẩn đau cơ xơ hóa ACR 2016 (học ở tuần 6). Cơ chế: nociplastic, có thể ở mức probable theo Kosek 2021 nếu khám có tăng nhạy cảm đau và có các bệnh kèm như trên. Tiêu chuẩn Kosek được xây dựng cho đau cơ xương khớp; áp dụng cho đau lan tỏa là hợp lý nhưng cần lưu ý điều này.</details></div>

<h3>Mẫu ghi chẩn đoán dùng cho bệnh nhân thật</h3>

<p class="lead">Bệnh sử đau mạn tốt cho biết phần lớn những gì cần biết trước khi chạm vào bệnh nhân: đau ở đâu, kiểu đau nào, ảnh hưởng ra sao và bệnh nhân hiểu cơn đau của mình thế nào.</p>

<h3>Các mục cần hỏi</h3>

</table></div>

<h3>Giới hạn của lời mô tả</h3>
<p>Từ ngữ mô tả đau giúp gợi ý nhưng không đủ để kết luận. Bộ câu hỏi DN4 được xây dựng vì nhóm tác giả thấy chỉ riêng mô tả triệu chứng chưa phân biệt tốt đau thần kinh và không phải thần kinh: DN4 kết hợp bảy mục triệu chứng với ba mục dấu hiệu khám tại giường (xem buổi sau). Vì vậy bệnh sử gợi ý, khám xác nhận.</p>

<h3>Mẹo thực hành</h3>
<p>Để bệnh nhân kể tự do 2–3 phút đầu rồi mới hỏi chi tiết. Ghi lại nguyên văn một hai cụm từ họ dùng để mô tả đau, vì chúng giúp theo dõi sau này và cho thấy cách họ hiểu bệnh. Với bệnh nhân đã khám nhiều nơi, xin xem trước hồ sơ và phim cũ để tránh lặp lại.</p>

<div class="ev"><b>Loại bằng chứng.</b> Danh mục câu hỏi dựa trên thực hành chuẩn và giáo trình, không phải một thử nghiệm riêng. Dữ liệu trực tiếp trong buổi này chỉ là thiết kế của DN4 (Bouhassira 2005, <a href="https://doi.org/10.1016/j.pain.2004.12.010" target="_blank" rel="noopener">DOI</a>), một nghiên cứu mô tả 160 bệnh nhân.</div>

<div class="case"><b>Tự kiểm tra.</b> Nam 58 tuổi, đau thắt lưng lan xuống mặt sau cẳng chân 5 tháng, đau tăng khi ho. Em cần hỏi thêm ít nhất 3 điều gì để phân biệt đau rễ với đau khớp mặt sau hoặc đau nociplastic?</div>
`},

"1-1": {t:"Thuốc đã dùng và các cờ màu", min:15, src:["DOWN13","LBP"], h:`
<p class="lead">Hai việc dễ bị bỏ sót trong buổi khám đầu: biết chính xác bệnh nhân đã dùng gì, và sàng lọc các dấu hiệu cảnh báo về bệnh nặng cũng như yếu tố tâm lý – xã hội làm đau kéo dài.</p>

<h3>Tiền sử dùng thuốc</h3>
<p>Với mỗi thuốc, ghi tên, liều, thời gian dùng, mức giảm đau, tác dụng phụ và bệnh nhân có thật sự uống đúng không. Hỏi riêng thuốc không kê đơn, thuốc đông y, thực phẩm chức năng, rượu và thuốc lá. Với opioid, tính liều morphine tương đương hằng ngày (MME) để dùng sau này theo CDC 2022 (tuần 13–14). Ghi sẵn thuốc chống đông, chống tiểu cầu vì quyết định thủ thuật cột sống phụ thuộc vào đó (tuần 21).</p>

<h3>Hệ cờ màu</h3>
<div class="scrollx"><table>
<tr><th>Cờ</th><th>Ý nghĩa</th><th>Ví dụ</th></tr>
<tr><td><b>Đỏ</b></td><td>Nghi bệnh nặng, cần làm rõ ngay</td><td>Tiền sử ung thư, sụt cân, sốt, yếu liệt tiến triển, rối loạn cơ tròn, tê vùng yên ngựa</td></tr>
<tr><td><b>Cam</b></td><td>Rối loạn tâm thần cần đánh giá riêng</td><td>Trầm cảm nặng, ý tưởng tự sát, rối loạn nhân cách</td></tr>
<tr><td><b>Vàng</b></td><td>Niềm tin, cảm xúc, hành vi làm đau kéo dài</td><td>Sợ vận động, thảm họa hóa, tin rằng đau là tổn thương đang tiến triển</td></tr>
<tr><td><b>Xanh dương</b></td><td>Nhận thức về công việc</td><td>Công việc nặng, ít hỗ trợ, sợ mất việc</td></tr>
<tr><td><b>Đen</b></td><td>Yếu tố hệ thống và bồi thường</td><td>Tranh chấp bảo hiểm, chính sách nơi làm việc</td></tr>
</table></div>
<p class="muted small">Cách phân màu là quy ước thực hành, mô tả theo giáo trình; không phải một công cụ được kiểm chứng như nhau cho cả năm màu.</p>

<h3>Cờ đỏ: dùng có cân nhắc</h3>
<p>Tổng quan hệ thống của Downie 2013 (14 nghiên cứu, 53 cờ đỏ trong đau thắt lưng) cho thấy nhiều cờ đỏ trong guideline gần như không làm đổi xác suất gãy xương hoặc ung thư, hoặc chưa được kiểm chứng. Các cờ có giá trị cao hơn gồm tiền sử ung thư (xác suất ung thư cột sống sau test khoảng 33%), dùng corticosteroid kéo dài, chấn thương nặng và tuổi cao với gãy xương. Khi có nhiều cờ cùng lúc thì xác suất gãy xương tăng, nhưng khoảng tin cậy rất rộng. Điều này nghĩa là một cờ đỏ đơn lẻ không đủ để chụp phim ồ ạt, nhưng nhiều cờ hoặc tiền sử ung thư thì cần được làm rõ.</p>
<p><b>Cấp cứu cần nhớ:</b> yếu chi dưới tiến triển, tê vùng yên ngựa, bí tiểu hoặc tiểu không tự chủ gợi ý hội chứng đuôi ngựa, cần chẩn đoán hình ảnh và hội chẩn phẫu thuật ngay.</p>

<div class="ev"><b>Loại bằng chứng.</b> Số liệu về cờ đỏ là tổng quan hệ thống nhưng dữ liệu dị biệt, không gộp được (Downie 2013, <a href="https://doi.org/10.1136/bmj.f7095" target="_blank" rel="noopener">DOI</a>); chỉ áp dụng cho đau thắt lưng. Hệ năm màu và ngưỡng hành động là thực hành chuẩn, chưa có thử nghiệm đối chứng.</div>

<div class="case"><b>Tự kiểm tra.</b> Nữ 66 tuổi dùng prednisolon kéo dài vì viêm khớp dạng thấp, đau thắt lưng đột ngột sau khi cúi nhấc đồ nhẹ. Cờ nào đáng chú ý nhất và em đề nghị gì?</div>
`},

"1-2": {t:"Khám thần kinh", min:15, src:["FIN16","EDPM"], h:`
<p class="lead">Khám thần kinh tập trung trả lời ba câu hỏi: có tổn thương thần kinh không, ở mức nào (rễ, đám rối, dây ngoại biên, tủy, não) và có cần xử trí khẩn cấp không.</p>

<h3>Trình tự</h3>
<p>Quan sát dáng đi, tư thế, teo cơ, run giật bó sợi cơ. Sau đó khám sức cơ theo thang MRC 0–5, phản xạ gân xương, cảm giác (buổi sau) và dấu hiệu bó tháp khi nghi tổn thương tủy hoặc não.</p>

<h3>Rễ và cơ tương ứng (kiến thức giáo khoa)</h3>
<div class="scrollx"><table>
<tr><th>Rễ</th><th>Cơ để khám</th><th>Phản xạ</th></tr>
<tr><td>C5</td><td>Dạng vai (delta)</td><td>Cơ nhị đầu (C5–6)</td></tr>
<tr><td>C6</td><td>Gập khuỷu, duỗi cổ tay</td><td>Cơ cánh tay quay (C6)</td></tr>
<tr><td>C7</td><td>Duỗi khuỷu (tam đầu)</td><td>Cơ tam đầu (C7)</td></tr>
<tr><td>C8, T1</td><td>Gập ngón tay (C8), dạng ngón (T1)</td><td>—</td></tr>
<tr><td>L3–L4</td><td>Duỗi gối, gập mu bàn chân (L4)</td><td>Gân bánh chè</td></tr>
<tr><td>L5</td><td>Duỗi ngón cái, đi bằng gót</td><td>Thường không có phản xạ riêng</td></tr>
<tr><td>S1</td><td>Gập gan bàn chân, đi bằng mũi chân</td><td>Gân gót</td></tr>
</table></div>

<h3>Tổn thương neuron vận động trên và dưới</h3>
<p>Neuron vận động dưới (rễ, dây ngoại biên): yếu, giảm trương lực, giảm hoặc mất phản xạ, teo cơ, giật bó sợi cơ. Neuron vận động trên (tủy, não): yếu, tăng trương lực, tăng phản xạ, Babinski dương, có thể có Hoffmann. Tăng phản xạ kèm yếu chi và rối loạn đi lại ở bệnh nhân đau cổ gợi ý bệnh lý tủy cổ và cần hình ảnh học.</p>

<h3>Giới hạn</h3>
<p>Dermatome chồng lấn nhau nên giảm cảm giác thường không cắt gọn theo một rễ. Phản xạ gót giảm hai bên có thể gặp ở người lớn tuổi mà không có bệnh. So sánh hai bên và theo dõi thay đổi theo thời gian có giá trị hơn một lần khám đơn lẻ.</p>

<div class="ev"><b>Loại bằng chứng.</b> Nội dung là kiến thức giáo khoa và đồng thuận thực hành, không có số liệu nghiên cứu riêng trong buổi này. Phân độ đau thần kinh theo Finnerup 2016 cần dấu hiệu khám phù hợp với vùng chi phối thần kinh (xem buổi sau).</div>

<div class="case"><b>Tự kiểm tra.</b> Bệnh nhân không duỗi được ngón chân cái, yếu khi đi bằng gót, mất cảm giác mu bàn chân. Rễ nào nhiều khả năng bị ảnh hưởng nhất và cần phân biệt với tổn thương dây nào?</div>
`},

"1-3": {t:"Khám cảm giác tại giường", min:15, src:["FIN16","DN4"], h:`
<p class="lead">Khám cảm giác là bước chuyển từ "nghi đau thần kinh" sang "possible hay probable" theo Finnerup 2016. Chỉ cần vài dụng cụ đơn giản và so sánh với vùng khỏe.</p>

<h3>Dụng cụ và cách làm</h3>
<div class="scrollx"><table>
<tr><th>Cảm giác</th><th>Dụng cụ</th><th>Cách làm và cách đọc</th></tr>
<tr><td>Chạm nhẹ</td><td>Bông, cọ</td><td>Chạm và so sánh với vùng đối bên. Giảm là hypoesthesia</td></tr>
<tr><td>Kim châm (đau)</td><td>Kim tù, sợi châm</td><td>Giảm là hypoalgesia; đau quá mức là hyperalgesia</td></tr>
<tr><td>Allodynia cơ học động</td><td>Cọ chải nhẹ</td><td>Cọ nhẹ qua da mà thấy đau là allodynia</td></tr>
<tr><td>Allodynia cơ học tĩnh</td><td>Ép nhẹ bằng đầu ngón tay</td><td>Ép nhẹ gây đau</td></tr>
<tr><td>Nóng, lạnh</td><td>Ống nghiệm nước ấm và lạnh hoặc dụng cụ chuyên dụng</td><td>Giảm hay tăng cảm nhận, cảm giác đau do lạnh</td></tr>
<tr><td>Rung</td><td>Âm thoa 128 Hz</td><td>Thời gian cảm nhận so với vùng khỏe hoặc xương tương ứng</td></tr>
<tr><td>Tổng hợp theo thời gian</td><td>Chạm kim lặp lại cùng điểm</td><td>Đau tăng dần theo số lần chạm</td></tr>
</table></div>
<p>Nguyên tắc: khám vùng đau, vùng quanh đó và vùng đối bên bình thường; hướng dẫn bệnh nhân trước; so sánh hai bên; ghi rõ ranh giới vùng bất thường để đối chiếu với vùng chi phối thần kinh.</p>

<h3>Triệu chứng âm và triệu chứng dương</h3>
<p>Triệu chứng âm là mất hoặc giảm chức năng (giảm cảm giác, yếu). Triệu chứng dương là hoạt động quá mức (allodynia, hyperalgesia, dị cảm, đau tự phát). Trong đau thần kinh thường gặp cả hai. Finnerup 2016 cần dấu hiệu khám có phân bố hợp lý về giải phẫu thần kinh để nâng từ possible lên probable.</p>

<h3>DN4</h3>
<p>DN4 gồm 10 mục: bảy mục hỏi triệu chứng (rát, lạnh đau, điện giật, kiến bò hoặc kim châm, tê, ngứa) và ba mục khám (giảm cảm giác chạm, giảm cảm giác kim châm, allodynia khi cọ). Mỗi mục có là 1, không là 0; cắt ngưỡng thường dùng là từ 4 điểm trở lên (em nhớ từ bài gốc, chưa kiểm lại từng số trong bài). Vai trò đúng của DN4 là sàng lọc gợi ý, không thay cho phân độ.</p>

<div class="ev"><b>Loại bằng chứng.</b> Phân độ: đồng thuận chuyên gia (Finnerup 2016, <a href="https://doi.org/10.1097/j.pain.0000000000000492" target="_blank" rel="noopener">DOI</a>). DN4: nghiên cứu thẩm định trên 160 bệnh nhân (<a href="https://doi.org/10.1016/j.pain.2004.12.010" target="_blank" rel="noopener">DOI</a>). Độ chính xác của từng nghiệm pháp tại giường riêng lẻ tôi chưa có số liệu đã kiểm chứng để nêu ở đây.</div>

<div class="case"><b>Tự kiểm tra.</b> Bệnh nhân đái tháo đường đau rát hai bàn chân, giảm kim châm kiểu tất. Em khám thêm gì và ghi thế nào để có thể xếp "probable"? Nếu muốn lên "definite" thì cần thêm gì?</div>
`},

"1-4": {t:"Nghiệm pháp cơ xương khớp", min:15, src:["LASL05","LBP"], h:`
<p class="lead">Các nghiệm pháp kích thích giúp định hướng nguồn đau. Hầu hết có độ chính xác hạn chế khi dùng riêng lẻ, nên cần kết hợp với bệnh sử và hình ảnh học.</p>

<h3>Cột sống thắt lưng: nâng chân thẳng (SLR)</h3>
<p>Bệnh nhân nằm ngửa, nâng chân duỗi thẳng. Dương tính khi tái hiện đau lan xuống chân dưới gối (không phải đau mặt sau đùi do căng cơ) trong khoảng 30–70 độ, và đau tăng khi gập mu bàn chân. SLR chéo (nâng chân lành gây đau chân bệnh) ít nhạy nhưng đặc hiệu hơn. Theo trí nhớ về tổng quan trước đây, SLR nhạy cao, đặc hiệu thấp cho thoát vị đĩa đệm; em chưa kiểm lại số liệu cụ thể trong buổi này.</p>

<h3>Cột sống cổ: nghiệm pháp Spurling</h3>
<p>Nghiêng cổ về bên đau rồi ép dọc trục. Dương tính khi tái hiện đau hoặc tê lan xuống tay. Theo trí nhớ, đặc hiệu khá nhưng độ nhạy thấp, nên âm tính không loại trừ bệnh lý rễ cổ. Số liệu này chưa kiểm chứng trong buổi.</p>

<h3>Khớp cùng chậu: bộ nghiệm pháp kích thích</h3>
<p>Các nghiệm pháp thường dùng gồm distraction, thigh thrust, compression, sacral thrust, Gaenslen và FABER (Patrick). Từng nghiệm pháp riêng lẻ chưa đủ chính xác. Trong nghiên cứu của Laslett 2005, với chuẩn tham chiếu là tiêm thuốc tê vào khớp, từ 3 trong 6 nghiệm pháp dương tính cho độ nhạy 94% và độ đặc hiệu 78%. Khi cả 6 đều không tái hiện đau quen thuộc thì có thể loại trừ khớp cùng chậu là nguồn đau. Mẫu chỉ 48 bệnh nhân nên con số cần được hiểu thận trọng (<a href="https://doi.org/10.1016/j.math.2005.01.003" target="_blank" rel="noopener">DOI</a>).</p>

<h3>Khớp mặt sau và các nguồn đau khác</h3>
<p>Khám lâm sàng đơn thuần thường không phân biệt chắc chắn đau khớp mặt sau; chẩn đoán dựa trên block nhánh trong có kiểm soát (sẽ học ở tuần 4 với đồng thuận Cohen 2020). Khớp háng có thể gây đau lan vùng mông và bẹn, cần khám tầm vận động xoay trong hông. Điểm đau cơ gợi ý hội chứng đau cơ mạc nhưng không phải tiêu chuẩn chẩn đoán rõ ràng.</p>

<div class="ev"><b>Loại bằng chứng.</b> Duy nhất số liệu đã kiểm chứng trong buổi là Laslett 2005 (nghiên cứu độ chính xác chẩn đoán cỡ mẫu nhỏ). SLR và Spurling: kiến thức giáo khoa, số liệu độ nhạy và độ đặc hiệu em chưa tra lại. Hãy mở chương Benzon tương ứng (ch. 18 và 29–30) để đối chiếu.</div>

<div class="case"><b>Tự kiểm tra.</b> Bệnh nhân đau thắt lưng thấp lệch phải, ba nghiệm pháp kích thích khớp cùng chậu dương tính, SLR âm tính. Điều này cho phép kết luận gì, và chưa cho phép kết luận gì?</div>
`},

"1-5": {t:"Soạn phiếu khám đau", min:20, src:["EDPM","FIN16"], h:`
<p class="lead">Mục tiêu buổi này: có một phiếu khám chuẩn để dùng cho mọi bệnh nhân đau mạn, ghi đủ để tuần sau có thể phân loại theo ICD-11 và theo cơ chế.</p>

<h3>Cấu trúc đề xuất</h3>
<div class="ev">
<b>1. Hành chính:</b> tuổi, nghề, nguồn chuyển, mục tiêu bệnh nhân mong muốn.<br>
<b>2. Đau:</b> vị trí (hình người), thời gian (tháng), khởi phát, tính chất, NRS hiện tại, trung bình, nặng nhất.<br>
<b>3. Yếu tố tăng, giảm; triệu chứng đi kèm:</b> tê, yếu, rối loạn cơ tròn, sụt cân, sốt.<br>
<b>4. Điều trị trước:</b> thuốc (tên, liều, thời gian, đáp ứng, tác dụng phụ), thủ thuật, vật lý trị liệu, phẫu thuật. Thuốc chống đông, chống tiểu cầu.<br>
<b>5. Cờ màu:</b> đỏ, cam, vàng, xanh dương, đen: ghi có hoặc không và chi tiết.<br>
<b>6. Chức năng:</b> hoạt động hằng ngày, giấc ngủ, khí sắc, công việc.<br>
<b>7. Khám:</b> dáng đi, sức cơ, phản xạ, cảm giác (vùng bất thường vẽ ra), nghiệm pháp cơ xương khớp.<br>
<b>8. Nhận định ban đầu:</b> nhóm ICD-11 dự kiến, cơ chế (cảm thụ, thần kinh, nociplastic), giả thuyết cần xác nhận.<br>
<b>9. Kế hoạch:</b> cận lâm sàng cần thêm, thuốc, giáo dục, hẹn tái khám.
</div>

<h3>Cách dùng</h3>
<p>Tự điền phiếu cho một bệnh nhân giả định rồi đối chiếu với mục 1.7 trong chương trình EDPM (danh mục đánh giá). Tuần 3 sẽ bổ sung các thang đo và công cụ sàng lọc để điền vào phần chức năng và tâm lý – xã hội.</p>

<div class="case"><b>Tự kiểm tra.</b> Lấy một bệnh nhân đau mạn em đã gặp gần đây (ẩn danh), điền thử phiếu. Phần nào em không có thông tin? Đó là chỗ cần bổ sung ở lần khám sau.</div>
`}
});

// ===== Trạng thái =====
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let done = LS.get("pp-done",{}), start = LS.get("pp-start","2026-11-02"), known = LS.get("pp-known",{}), scores = LS.get("pp-scores",{});
const DOW=["T2","T3","T4","T5","T6","T7","CN"];
const REVIEW=["Ôn tập tuần","Làm lại toàn bộ thẻ trong tuần, làm bài kiểm tra, viết một ca mẫu nửa trang.",[],"Đọc lại ghi chép trong tuần; mở lại tài liệu gốc ở những chỗ còn chưa chắc."];
const items = w => W[w][2].concat([REVIEW]);
const dd=(w,d)=>{const s=new Date(start+"T00:00:00");s.setDate(s.getDate()+w*7+d);return s;};
const fmt=d=>d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"});
const TOT=()=>W.length*7;
const nDone=()=>Object.keys(done).length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function todayIdx(){const diff=Math.floor((new Date().setHours(0,0,0,0)-new Date(start+"T00:00:00"))/864e5);return diff;}
function chips(ks){return ks.length?`<div class="chips">${ks.map(k=>`<button class="chip" data-src="${k}">${k}</button>`).join("")}</div>`:"";}

const wl=w=>"Tuần "+w;
const TABS=[["home","Hôm nay"],["road","Lộ trình"],["card","Thẻ ôn"],["quiz","Kiểm tra"],["book","Nguồn"]];
let tab="home", sub={road:0,card:1,quiz:1,book:"all"};
const tabFromHash=()=>{const h=location.hash.slice(1);return TABS.some(t=>t[0]===h)?h:"home";};

function streakCount(){const t=todayIdx();let s=0;for(let i=Math.min(t,TOT()-1);i>=0;i--){const w=Math.floor(i/7),d=i%7;if(done[`${w}-${d}`])s++;else if(i<t)break;}return s;}
function renderHead(){
  const t=todayIdx(), n=nDone();
  const wk = t<0?"Chưa bắt đầu":t>=TOT()?"Đã hết lộ trình":`Tuần ${Math.floor(t/7)+1} · ${DOW[t%7]}`;
  document.getElementById("derived").innerHTML=`<span class="chip">${wk}</span><span class="chip g">Đã học ${n}/${TOT()}</span><span class="chip w">Chuỗi ${streakCount()} ngày</span>`;
  document.getElementById("nav").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" style="--tc:var(--t-${k})" aria-selected="${k===tab}">${l}</button>`).join("");
  const mw=document.getElementById("mainwrap"); const tk=tab==="lesson"?"road":tab; mw.style.setProperty("--accent",`var(--t-${tk})`); mw.style.setProperty("--accent-soft",`var(--t-${tk}-soft)`);
}
function setSub(html,scroll){const el=document.getElementById("subtabs");el.innerHTML=html;el.classList.toggle("scroll",!!scroll);}
function weekChips(kind){const ws=Object.keys(kind==="card"?CARDS:QUIZ).map(Number);return Array.from({length:W.length},(_,i)=>i+1).map(w=>`<button data-sub="${w}" class="${sub[tab]===w?"on":""}" ${ws.includes(w)?"":"disabled"}>Tuần ${w}</button>`).join("");}

function render(){
  renderHead(); const m=document.getElementById("main");
  if(tab==="lesson"){setSub("");m.innerHTML=lessonView();return;}
  if(tab==="home"){setSub("");m.innerHTML=homeView();}
  if(tab==="road"){setSub(["Tất cả"].concat(PHASES.map((p,i)=>"GĐ "+(i+1))).map((l,i)=>`<button data-sub="${i}" class="${sub.road===i?"on":""}">${l}</button>`).join(""));m.innerHTML=roadView();}
  if(tab==="card"){setSub(weekChips("card"),true);m.innerHTML=cardView();}
  if(tab==="quiz"){setSub(weekChips("quiz"),true);m.innerHTML=quizView();}
  if(tab==="book"){setSub([["all","Tất cả"],["sr","Tổng quan HT"],["gl","Guideline"],["cs","Đồng thuận"],["tb","Sách"]].map(([k,l])=>`<button data-sub="${k}" class="${sub.book===k?"on":""}">${l}</button>`).join(""));m.innerHTML=bookView();}
}

function homeView(){
  const t=todayIdx(), n=nDone(); let main;
  if(t<0){main=`<div class="card"><h2>Sắp bắt đầu</h2><div class="body"><div class="title">Lộ trình bắt đầu ${fmt(new Date(start+"T00:00:00"))}</div><p class="muted small" style="margin:0">Còn ${-t} ngày. Có thể đọc trước định nghĩa IASP 2020 trong tab Nguồn.</p></div></div>`;}
  else if(t>=TOT()){main=`<div class="card"><h2>Đã hết lộ trình ${W.length} tuần</h2><div class="body"><p class="muted small" style="margin:0">Xem lại các buổi chưa tick trong tab Lộ trình.</p></div></div>`;}
  else{const w=Math.floor(t/7),d=t%7,it=items(w)[d],id=`${w}-${d}`;
    main=`<div class="card"><h2>Hôm nay · Tuần ${w+1} · ${DOW[d]} ${fmt(dd(w,d))}</h2><div class="body">
    <div class="flexr" style="justify-content:space-between"><div class="title">${esc(it[0])}</div>${done[id]?'<span class="tag done">Đã học</span>':d===6?'<span class="tag rev">Ôn tập</span>':""}</div>
    <p class="small" style="margin:0">${esc(it[1])}</p>${chips(it[2])}${readHTML(it[3])}${LESSONS[id]?`<button class="btn lessonbtn" data-lesson="${id}">📖 Đọc bài · ${LESSONS[id].min} phút</button>`:""}
    <button class="btn ${done[id]?"":"pri"} block" data-toggle="${id}">${done[id]?"Bỏ đánh dấu":"Đánh dấu đã học"}</button>
    <div class="flexr">${CARDS[w+1]?`<button class="btn" data-go="card" data-w="${w+1}">Ôn thẻ tuần ${w+1}</button>`:""}${QUIZ[w+1]?`<button class="btn" data-go="quiz" data-w="${w+1}">Kiểm tra tuần ${w+1}</button>`:""}</div></div></div>`;}
  const k=Object.keys(known).length, tc=Object.values(CARDS).reduce((a,c)=>a+c.length,0);
  const sc=Object.entries(scores).map(([w,s])=>`<div class="row ${s.r/s.n>=.8?"ok":""}"><span class="nm">${wl(w)}</span><span class="sub">${s.r/s.n>=.8?"Đạt (≥80%)":"Chưa đạt, nên ôn lại thẻ"}</span><span class="val">${s.r}/${s.n}</span></div>`).join("")||'<div class="note" style="border-top:0">Chưa làm bài kiểm tra nào.</div>';
  const how=`<div class="card"><h2>Buổi học 90 phút</h2>
  <div class="row"><span class="nm">Bài tóm tắt trong app</span><span class="sub">Nắm khung và trọng tâm trước khi đọc gốc</span><span class="val">20<small>phút</small></span></div>
  <div class="row"><span class="nm">Đọc gốc</span><span class="sub">Chương sách hoặc guideline ghi ở mục "Đọc gốc"</span><span class="val">50<small>phút</small></span></div>
  <div class="row"><span class="nm">Thẻ ôn và ghi chép</span><span class="sub">Tóm tắt 5–7 dòng, gắn với một bệnh nhân thật</span><span class="val">20<small>phút</small></span></div>
  <div class="note">Khung kiến thức bám theo EFIC EDPM curriculum (bản 2, 2023). Mã EDPM ghi ở từng tuần trong tab Lộ trình.</div></div>`;
  return main+how+`<div class="card"><h2>Tiến độ</h2>
  <div class="row"><span class="nm">Buổi đã học</span><span class="sub"><span class="bar" style="display:block;margin-top:4px"><i style="width:${(n/TOT()*100).toFixed(1)}%"></i></span></span><span class="val">${n}<small>/ ${TOT()}</small></span></div>
  <div class="row"><span class="nm">Chuỗi ngày liên tiếp</span><span class="sub">Tính đến hôm nay</span><span class="val">${streakCount()}<small>ngày</small></span></div>
  <div class="row"><span class="nm">Thẻ đã nhớ</span><span class="sub">Trên tổng số thẻ đã soạn</span><span class="val">${k}<small>/ ${tc}</small></span></div></div>
  <div class="card"><h2>Điểm kiểm tra</h2>${sc}</div>
  <div class="card"><h2>Cài đặt</h2><div class="body"><label class="lbl" for="startdate">Ngày bắt đầu lộ trình</label><input type="date" id="startdate" value="${start}"></div><div class="note">Tiến độ lưu trên trình duyệt của thiết bị này, không đồng bộ giữa các máy.</div></div>`;
}

function roadView(){
  const ph = sub.road===0?PHASES:[PHASES[sub.road-1]];
  return ph.map(p=>{let h=`<div class="card"><h2>${p.n}</h2><div class="note" style="border-top:0"><b>${p.w}.</b> ${p.p}</div></div>`;
    for(let i=p.from;i<=p.to;i++){const w=i-1,its=items(w),c=its.filter((_,d)=>done[`${w}-${d}`]).length,cur=Math.floor(todayIdx()/7)===w;
      h+=`<details class="wk" id="wk${i}" ${cur?"open":""}><summary><span class="pill">T${String(i).padStart(2,"0")}</span><span class="wt">${esc(W[w][0])}<small>${fmt(dd(w,0))} – ${fmt(dd(w,6))}${EDPMTAG[w]&&EDPMTAG[w]!=="—"?` · EDPM ${EDPMTAG[w]}`:""}</small></span><span class="wc ${c===7?"full":""}">${c}/7</span></summary>
      <p class="goal">${esc(W[w][1])}</p><ul class="days">${its.map((it,d)=>{const id=`${w}-${d}`;return `<li class="${done[id]?"on":""}"><input type="checkbox" data-id="${id}" ${done[id]?"checked":""} aria-label="${esc(it[0])}"><div><span class="d">${DOW[d]} ${fmt(dd(w,d))}</span><b>${esc(it[0])}</b><span class="small muted">${esc(it[1])}</span>${chips(it[2])}${readHTML(it[3])}${LESSONS[id]?`<button class="btn lessonbtn" data-lesson="${id}">📖 Đọc bài · ${LESSONS[id].min} phút</button>`:""}</div></li>`;}).join("")}</ul></details>`;}
    return h;}).join("");
}

let ci=0, flipped=false, onlyNew=false;
function cardView(){
  const all=CARDS[sub.card]; if(!all) return `<div class="card"><h2>${wl(sub.card)}</h2><div class="empty muted">Chưa có thẻ cho tuần này.</div></div>`;
  const list=all.map((c,i)=>({c,i})).filter(x=>!onlyNew||!known[`${sub.card}-${x.i}`]);
  const nk=all.filter((_,i)=>known[`${sub.card}-${i}`]).length;
  const head=`<div class="card"><h2>Thẻ ôn · ${wl(sub.card)}</h2><div class="row"><span class="nm">Đã nhớ</span><span class="sub"><span class="bar" style="display:block;margin-top:4px"><i style="width:${nk/all.length*100}%"></i></span></span><span class="val">${nk}<small>/ ${all.length}</small></span></div><div class="note"><label class="flexr"><input type="checkbox" id="onlynew" ${onlyNew?"checked":""}> Chỉ hiện thẻ chưa nhớ</label></div></div>`;
  if(!list.length) return head+`<div class="card"><div class="empty"><b>Đã nhớ hết ${all.length} thẻ</b><br><button class="btn" style="margin-top:10px" data-act="allcards">Ôn lại toàn bộ</button></div></div>`;
  if(ci>=list.length) ci=0; const {c,i}=list[ci];
  return head+`<div class="flip ${flipped?"on":""}" data-act="flip" role="button" tabindex="0" aria-label="Lật thẻ"><div class="in">
  <div class="face"><span class="lbl">Thẻ ${ci+1}/${list.length} · Câu hỏi</span><div class="q">${esc(c[0])}</div><span class="s">Chạm để xem đáp án</span></div>
  <div class="face back"><span class="lbl">Đáp án</span><div>${esc(c[1])}</div><span class="s">Nguồn: ${c[2]}</span></div></div></div>
  <div class="cardnav"><button class="btn bad" data-know="0" data-i="${i}">Chưa nhớ</button><button class="btn good" data-know="1" data-i="${i}">Đã nhớ</button></div>`;
}

let qi=0, picked=null, right=0;
function quizView(){
  const Q=QUIZ[sub.quiz]; if(!Q) return `<div class="card"><h2>${wl(sub.quiz)}</h2><div class="empty muted">Chưa có bài kiểm tra cho tuần này.</div></div>`;
  if(qi>=Q.length) return `<div class="card"><h2>Kết quả · ${wl(sub.quiz)}</h2><div class="empty"><div class="big">${right}/${Q.length}</div><p class="muted small">${right/Q.length>=.8?"Đạt mục tiêu (≥80%).":"Dưới 80%: nên ôn lại thẻ rồi làm lại."}</p><button class="btn pri" data-act="restart">Làm lại</button></div></div>`;
  const q=Q[qi];
  return `<div class="card"><h2>${wl(sub.quiz)} · Câu ${qi+1}/${Q.length} · Đúng ${right}</h2><div class="body">
  <div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
  <div class="title" style="font-size:16px">${esc(q[0])}</div>
  ${q[1].map((o,j)=>`<button class="opt ${picked==null?"":j===q[2]?"right":j===picked?"wrong":""}" data-pick="${j}" ${picked!=null?"disabled":""}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}</div>
  ${picked!=null?`<div class="note"><b>${picked===q[2]?"Đúng.":"Chưa đúng."}</b> ${esc(q[3])} ${chips([q[4]])}</div><div class="body"><button class="btn pri block" data-act="next">${qi+1<Q.length?"Câu tiếp":"Xem kết quả"}</button></div>`:""}</div>`;
}

const LVN={sr:"Tổng quan HT",gl:"Guideline",cs:"Đồng thuận",tb:"Sách / tài nguyên"};
function bookView(){
  const e=Object.entries(SRC).filter(([k,v])=>sub.book==="all"||v.lvl===sub.book);
  return `<div class="banner">Nhãn "Đồng thuận" nghĩa là khuyến cáo chủ yếu dựa trên ý kiến chuyên gia vì thiếu RCT; hướng dẫn chống đông và an toàn tiêm NMC thuộc nhóm này.</div>
  <div class="card"><h2>Nguồn tài liệu · ${e.length}</h2>`+
  e.map(([k,v])=>`<div class="row src" id="s-${k}" style="grid-template-columns:1fr"><span class="nm"><span class="lv">${LVN[v.lvl]}</span>${esc(v.t)}</span><span class="sub">${esc(v.n)}</span>${v.doi?`<a href="https://doi.org/${v.doi}" target="_blank" rel="noopener">doi:${v.doi}</a>`:`<a href="${v.url}" target="_blank" rel="noopener">${v.url.replace("https://","")}</a>`}</div>`).join("")+`</div>`;
}


let lessonId=null, lessonFrom="home";
function lessonView(){
  const L=LESSONS[lessonId]; const [w,d]=lessonId.split("-").map(Number); const keys=Object.keys(LESSONS);
  const i=keys.indexOf(lessonId), prev=keys[i-1], next=keys[i+1];
  return `<div class="card"><h2>Tuần ${w+1} · ${DOW[d]} · ${esc(L.t)}</h2><div class="lesson">${L.h}
  <div><span class="lbl">Nguồn</span>${chips(L.src)}</div>
  <p class="muted small">Bài tóm tắt do trợ lý soạn từ các nguồn trên, không chép nguyên văn. Với liều thuốc và ngưỡng quyết định quan trọng, đối chiếu lại tài liệu gốc.</p></div></div>
  <button class="btn ${done[lessonId]?"":"pri"} block" data-toggle="${lessonId}" style="margin-bottom:10px">${done[lessonId]?"✓ Đã học buổi này":"Đánh dấu đã học buổi này"}</button>
  <div class="lnav"><button class="btn" ${prev?`data-lesson="${prev}"`:"disabled"}>‹ Bài trước</button><button class="btn" ${next?`data-lesson="${next}"`:"disabled"}>Bài sau ›</button></div>
  <button class="btn block" data-back="1" style="margin-top:10px">Quay lại</button>`;
}
function go(t){tab=t; if(location.hash.slice(1)!==t) history.replaceState(null,"","#"+t); render(); window.scrollTo(0,0);}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act]"); if(!b) return;
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.lesson){if(tab!=="lesson")lessonFrom=tab;lessonId=b.dataset.lesson;tab="lesson";render();window.scrollTo(0,0);return;}
  if(b.dataset.back){go(lessonFrom);return;}
  if(b.dataset.sub!==undefined){const v=b.dataset.sub; sub[tab]= (tab==="book")?v:Number(v); ci=0;flipped=false;qi=0;picked=null;right=0; return render();}
  if(b.dataset.src){sub.book="all";go("book");const el=document.getElementById("s-"+b.dataset.src);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);}return;}
  if(b.dataset.toggle){const id=b.dataset.toggle; if(done[id]) delete done[id]; else done[id]=1; LS.set("pp-done",done); return render();}
  if(b.dataset.go){sub[b.dataset.go]=Number(b.dataset.w);ci=0;flipped=false;qi=0;picked=null;right=0;return go(b.dataset.go);}
  const a=b.dataset.act;
  if(a==="flip"){flipped=!flipped;b.classList.toggle("on",flipped);return;}
  if(b.dataset.know!==undefined){const key=`${sub.card}-${b.dataset.i}`; if(b.dataset.know==="1") known[key]=1; else delete known[key]; LS.set("pp-known",known); flipped=false; if(!(onlyNew&&b.dataset.know==="1")) ci++; return render();}
  if(a==="allcards"){onlyNew=false;ci=0;return render();}
  if(b.dataset.pick!==undefined&&picked==null){picked=Number(b.dataset.pick); if(picked===QUIZ[sub.quiz][qi][2]) right++; return render();}
  if(a==="next"){qi++;picked=null; if(qi>=QUIZ[sub.quiz].length){scores[sub.quiz]={r:right,n:QUIZ[sub.quiz].length};LS.set("pp-scores",scores);} return render();}
  if(a==="restart"){qi=0;picked=null;right=0;return render();}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.act==="flip"){e.preventDefault();e.target.click();}});
document.addEventListener("change",e=>{
  if(e.target.dataset.id){const id=e.target.dataset.id; if(e.target.checked) done[id]=1; else delete done[id]; LS.set("pp-done",done);
    e.target.closest("li").classList.toggle("on",e.target.checked); const w=id.split("-")[0]; const c=[0,1,2,3,4,5,6].filter(d=>done[`${w}-${d}`]).length;
    const wc=e.target.closest("details").querySelector(".wc"); wc.textContent=`${c}/7`; wc.classList.toggle("full",c===7); renderHead();}
  if(e.target.id==="startdate"&&e.target.value){start=e.target.value;LS.set("pp-start",start);render();}
  if(e.target.id==="onlynew"){onlyNew=e.target.checked;ci=0;flipped=false;render();}
});
window.addEventListener("hashchange",()=>{tab=tabFromHash();render();});
tab=tabFromHash(); render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}
</script>
</body>
