SIJ.push(
{ id:9, t:"Chương 9 · Y học tái tạo cho bệnh khớp cùng–chậu", yt:"", min:32,
 pts:[
  "Năm nhóm liệu pháp tái tạo/sinh học: prolotherapy, tế bào gốc trung mô (MSC), PRP, máu toàn phần tự thân, axit hyaluronic (HA). Bằng chứng riêng cho SIJ rất hạn chế: ASIPP xếp PRP cho SIJ ở mức IV (trên thang I–V); thường suy từ dữ liệu khớp ngoại biên.",
  "Prolotherapy: tiêm chất kích ứng/ưu trương để thúc đẩy lành, làm chắc dây chằng; mô tả hiện đại 1937; NIH xếp là y học bổ sung–thay thế; ban đầu cho lỏng lẻo dây chằng. 3 nhóm chất: thẩm thấu (dextrose ưu trương, kẽm sulfat, glycerin), kích ứng (phenol, guaiacol, pumic acid), hóa hướng động (natri morrhuate).",
  "Dược lý prolotherapy: gây viêm cấp → nguyên bào sợi → lắng đọng collagen; giả thuyết chưa chắc (chuột: viêm không khác chấn thương do kim). Tiêm trong khớp có thể tác động cấu trúc phía trước (bệnh lý phía trước ở đến 69% bệnh nhân có phong bế chẩn đoán dương) mà RFA không với tới. Hiệu quả có thể >2 năm; 3–6 đợt cách 2–6 tuần; không đáp ứng sau mũi đầu thì khó cải thiện.",
  "Bằng chứng prolotherapy: Yelland (trái chiều; dùng riêng không hơn tiêm chứng); Rabago (34 báo cáo ca/loạt ca + 6 RCT: “còn xa mới kết luận”, có vẻ an toàn); RCT SIJ: dextrose 25%, 2–3 mũi cách 2 tuần vs steroid: >50% giảm đau ở 15 tháng 58% vs 10%; Cusi: dextrose 18% vào dây chằng gian cốt sau dưới CT, 3 mũi cách 6 tuần: Quebec cải thiện 20 điểm ở 3 tháng, đến 2 năm; Hoffman & Agnish: 103 bệnh nhân, 15% dextrose trong lidocaine, 3 mũi cách 4 tuần: 23% cải thiện ≥15 điểm ODI, ~50% không cải thiện, 29% <15 điểm.",
  "Chuẩn bị prolotherapy: dextrose ưu trương phổ biến nhất, nồng độ gây viêm 12,5–25%; cách 4–6 tuần; trung bình 3–6 lần. Nguy cơ: chảy máu, bầm, sưng, nhiễm trùng, dị ứng/phản vệ; tác dụng phụ nhẹ thoáng qua (đau lưng, cứng).",
  "MSC: nguồn tủy xương và mô mỡ; FDA → khả thi nhất là tủy xương (B-MSC). Định nghĩa: bám nhựa; CD105+, CD73+, CD90+; CD45−, CD34−, CD14/CD11b−, CD79α−, CD19−, HLA-DR−; biệt hóa 3 dòng (nguyên bào xương, tế bào mỡ, nguyên bào sụn); CFU-F; Stro-1.",
  "Dược lý MSC: không bám trụ, không tồn tại quá ~2 tuần; tác dụng nhờ dinh dưỡng (trophic), cận tiết (paracrine), điều hòa miễn dịch (NO, PGE2, IDO, IL-10, TGF-β1; tế bào B, T, NK, tế bào đuôi gai); nguồn gốc quanh mạch; Caplan: “medicinal signaling cells”; quy định chỉ cho thao tác tối thiểu.",
  "Bằng chứng MSC: chưa có nghiên cứu nào tiêm MSC trong SIJ; chưa báo cáo biến cố nặng; đĩa đệm: mức I/IV, ≥3 nghiên cứu cải thiện ≥1 năm, ≥1 không cải thiện; phân tích gộp 17 nghiên cứu thoái hóa gối: 15/17 cải thiện lâm sàng, 9/11 cải thiện sụn trên MRI, 6/7 sửa chữa mô khi nội soi, nhưng nguy cơ sai lệch cao, chỉ 1 nghiên cứu chất lượng cao (GRADE).",
  "Quy định FDA (HCT/P): cần IND trừ khi thỏa 4 tiêu chí miễn trừ (mục 361): thao tác tối thiểu; dùng đồng loại (homologous); không phối hợp chất khác ngoài nước/dịch tinh thể/chất vô trùng-bảo quản; dùng tự thân (hoặc họ hàng bậc 1–2 nếu tác dụng toàn thân). Tiêu hóa enzyme = hơn mức tối thiểu; mô mỡ cho bệnh thoái hóa/viêm = dùng KHÔNG đồng loại; PRP ngoài phạm vi.",
  "Lấy tủy xương (BMAC): nguy cơ thần kinh hông, mạch mông trên, động mạch chậu ngoài (cao hơn ở người béo, ít kinh nghiệm); hỗ trợ hình ảnh; mào chậu sau (sách ghi nằm ngửa); rạch 1 cm trên PSIS; Shapiro: không sâu >4 cm, 4 lần pass, 5–8 mL mỗi lần; huỳnh quang: hình “giọt lệ hợp nhất” PSIS–AIIS, trocar đồng trục, sâu tối đa 6 cm, 3–5 mL ở 6 cm, xoay 90° rồi rút nhẹ, tối đa 30 mL; CT 260 bệnh nhân: >1 cm trên khuyết ngồi lớn.",
  "Xử lý và tiêm BMAC: máy ly tâm được FDA cấp phép + chất chống đông do hãng khuyến cáo; đặt hematocrit để giàu/nghèo bạch cầu; tiêm dưới huỳnh quang/siêu âm, cản quang hoặc gadolinium xác nhận; thể tích ≤3 mL; KHÔNG dùng thuốc tê trong khớp (lidocaine độc với MSC).",
  "PRP: máu tự thân, tiểu cầu cao hơn nền; yếu tố tăng trưởng PDGF A–C, TGF-β1, IGF-1, FGF-2, HGF, VEGF-A; ~70% yếu tố tiết trong 10 phút, 30% còn lại trong 1 giờ; thường 2–3 mũi cách ~1 tháng; hiệu quả suy ra ≥12 tháng. Bằng chứng SIJ: Ko 2017 (4 ca, 2 mũi 10 mL vào dây chằng cùng–chậu sau, giảm đau ở 1 và 4 năm); PRP vs steroid (3 mL PRP không bạch cầu + 0,5 mL CaCl2): ở 6 tuần và 3 tháng PRP đau ít hơn, không đau ở 3 tháng 90% vs 25%; loạt 10 ca (4 mL, huỳnh quang) cải thiện ở 3 tháng.",
  "An toàn PRP: tác dụng phụ 2–5% (đau/nhạy tại chỗ); đau và cứng sau tiêm nhiều hơn steroid nhưng hết trong 2 ngày; ngừng NSAID; trì hoãn PRP ~6 tuần sau tiêm steroid; không dị ứng. Chống chỉ định: tiểu cầu thấp, Hb <10 g/dL, rối loạn tiểu cầu, NSAID trong 48 giờ, steroid tại chỗ hoặc toàn thân trong 2 tuần, nhiễm khuẩn huyết, nhiễm trùng hoạt động, ung thư hoạt động.",
  "Chuẩn bị PRP: rút máu + chống đông (natri citrate, ACD, EDTA) → ly tâm (hồng cầu, buffy coat, huyết tương nghèo tiểu cầu) → ly tâm lần 2; thêm canxi clorid để tiểu cầu giải phóng hạt; quy trình rất khác nhau → khó đánh giá. Hình 9.3: huyết tương ~55%, bạch cầu + tiểu cầu ~4%, hồng cầu ~41%.",
  "Máu toàn phần tự thân: không xử lý; chưa có thử nghiệm SIJ (mức IV); bệnh gân: cải thiện ở 4 tuần, thêm ở 8 tuần, tối đa trung bình 3 tuần; mũi cách 4–8 tuần (tác giả ≥8 tuần); viêm cân gan chân: steroid giảm đau hơn ở 1,5 và 3 tháng; viêm lồi cầu ngoài: PRP hơi hơn ở 8 tuần; thể tích 3 mL trong khớp, 5 mL quanh khớp; có thể trộn 1 mL lidocaine 2% hoặc bupivacaine 0,5% nhưng không cần.",
  "HA: glycosaminoglycan không sulfat tổng hợp ở màng tế bào (không phải Golgi), ~7 triệu Dalton; bảo vệ sụn (giảm chết theo chương trình, tăng sinh tế bào sụn qua CD44), chống viêm (ức chế IL-1β), bôi trơn; gối: khởi phát 1–4 tuần, kéo dài 6–12 tháng. SIJ: loạt 4 ca, Hylan GF 20 ×3 cách 2 tuần, giảm VAS 40–67% ở 12 và 16 tuần. Gối: phân tích gộp 2012 lợi ích nhỏ không có ý nghĩa lâm sàng; Jevsevar 2015 không khác placebo. Tác dụng phụ: đau/sưng, nhiễm trùng, phản ứng giả nhiễm trùng (pseudoseptic), giả gút; sản phẩm chim vs lên men; phân tử lượng cao tốt hơn.",
  "Đạo đức: Cossu cảnh báo khoảng cách giữa lạc quan và bằng chứng; lợi nhuận phòng khám tư; cần RCT chất lượng cao, lý tưởng dưới IND, thang đo đã thẩm định."

  ["Máu toàn phần tự thân: thể tích và khoảng cách mũi?","3 mL trong khớp, 5 mL quanh khớp; không xử lý; mũi cách 4–8 tuần (tác giả khuyên ≥8 tuần).","SIJ"],

  ["HA là gì?","Glycosaminoglycan không sulfat, tổng hợp ở màng tế bào (không phải Golgi), ~7 triệu Dalton; thành phần chất nền ngoại bào.","SIJ"],

{ id:10, t:"Chương 10 · Kỹ thuật hình ảnh dẫn đường để tiêm khớp cùng–chậu", yt:"", min:16,
 pts:[
  "Tiêm SIJ để chẩn đoán hoặc điều trị (kể cả y học tái tạo) dưới ba phương tiện: CT, huỳnh quang, siêu âm.",
  "Chống chỉ định tuyệt đối: u tại chỗ, nhiễm trùng. Tương đối: rối loạn đông máu, thai kỳ (tùy loại hình ảnh), nhiễm trùng toàn thân, khớp nhiễm khuẩn, viêm xương tủy.",
  "CT (Pulisetti, 71 mũi tiêm): chính xác nhất để xác nhận tiêm chẩn đoán. Nằm sấp, CT một lát cắt sơ bộ, vô trùng, kỹ thuật liều thấp/xung, điểm vào ~1 cm trên đầu dưới khe khớp, kỹ thuật tự do; xác nhận khe khớp bằng ≥1–3 mL cản quang không ion (ioversol).",
  "Biến chứng CT: phản ứng phế vị thoáng qua (Kennedy: >8.000 mũi tiêm huỳnh quang); vô trùng thì hạn chế ngoài phơi nhiễm tia X.",
  "Huỳnh quang: môi trường vô trùng (phòng khám hoặc trung tâm ngoại trú); nằm sấp trên bàn xuyên tia, gối dưới bụng dưới; C-arm chếch bên đối diện 10–20°; dùng cản quang để vẽ khe khớp, hoặc xác nhận AP/chếch/nghiêng không cản quang.",
  "Thuốc dưới huỳnh quang: trung bình 4–6 mL, một nửa trong khớp, một nửa quanh khớp; mục tiêu thấm khớp và dây chằng gian cốt. Khuba: không cần góc chếch, chỉ AP vẫn vào được phần dưới khớp sau; Chauhan (RCT): AP cho thời gian soi ngắn hơn.",
  "Biến chứng huỳnh quang: thường không có (Navani) hoặc đau tăng 15–30%; Maugars: đau tăng thoáng qua, tê đáy chậu thoáng qua, đau thần kinh tọa tạm thời; hiếm viêm khớp nhiễm khuẩn (nguy cơ: đái tháo đường, vật liệu nhân tạo, nhiễm trùng tại chỗ, lớn tuổi, ức chế miễn dịch); hình nghiêng tránh tiêm nhầm tạng chậu.",
  "Siêu âm (Hartung): nằm sấp, gối dưới khung chậu; bàn chân xoay trong và lật vào; đầu dò thẳng 2,5–8,0 MHz, trường nhìn 44 mm; khe SIJ = khe giảm âm giữa hai đường tăng âm của xương cùng và xương chậu.",
  "Saunders: cải tiến nhắm dây chằng gian cốt sau (ở mức S1–S2, nơi nên tiêm điều trị). Kim từ trong ra ngoài (Hình 10.3).",
  "Siêu âm – độ chính xác/biến chứng: nhiễm trùng nếu không vô trùng; biến chứng nặng (kim vào khoang sau chậu) hiếm; ít vào đúng trong khớp hơn nhưng tiêm quanh khớp vẫn hiệu quả (Hartung); thời gian dài hơn (giảm theo kinh nghiệm); nhìn thấy thuốc lan ngoài khớp để chỉnh kim.",
  "Kết luận: kỹ thuật tiêm thay đổi theo đào tạo, kinh nghiệm. Chế phẩm tái tạo (từ máu tự thân): nguy cơ giống phản ứng truyền máu, dị ứng/miễn dịch; không tương tác thuốc; nguy cơ chính là phá vỡ vô trùng hoặc tiêm nhầm cấu trúc."
 ],

/* Chương 11 của mục Đau khớp cùng chậu (nối vào mảng SIJ). Điền link YouTube vào yt khi có. */
SIJ.push(
{ id:11, t:"Chương 11 · Chọn bệnh nhân và dụng cụ cho kích thích thần kinh ngoại biên (PNS)", yt:"", min:18,
 pts:[
  "PNS khác kích thích vùng ở chỗ có một dây thần kinh ngoại biên đích; báo cáo ca trong thập kỷ qua cho thấy hữu ích cho đau SIJ. Phải hiểu các dây thần kinh chi phối khớp để hiểu vị trí/kỹ thuật phong bế chẩn đoán.",
  "Thần kinh mông giữa (MCN): thuần cảm giác, 4–6 nhánh; đau vùng thắt lưng thấp và mông; xuất phát nhánh sau S1–S4; đi dưới và kẹp dây chằng cùng–chậu sau dài (LPSL) giữa PSIS và gai chậu sau dưới, vòng qua mào chậu xuống mông. Kẹt MCN có thể bị điều trị như đau SIJ.",
  "Đau SIJ gây 15–30% đau thắt lưng; không có bệnh sử/khám nhất quán; Patrick, Gaenslen giá trị tiên đoán dương thấp; hình ảnh ít đóng góp (chẩn đoán lâm sàng); phong bế dưới huỳnh quang củng cố chẩn đoán.",
  "LPSL là nguồn đau: Fortin (76 arthrogram CT): rò sau quanh LPSL 18 ca (24%), vào lỗ S1 6 ca (8%). Murakami: tiêm quanh LPSL hiệu quả ở 25/25, trong khớp chỉ 9/25 (36%); cả 16 người không đáp ứng tiêm trong khớp đều gần hết đau sau tiêm quanh LPSL; 18/25 có đau chính trong 2 cm quanh PSIS đáp ứng phong bế quanh khớp; Fortin: chỉ chỗ đau bằng một ngón, ngay trong–dưới PSIS trong 1 cm.",
  "Kẹt MCN: 82% có triệu chứng chân; nặng khi đứng, gập thắt lưng, trở mình, ngồi lâu, đặc biệt đi bộ (giống bệnh thắt lưng); dấu giống Tinel ở 35 mm phía đuôi PSIS, hơi lệch ngoài, ở bờ mào chậu; ấn điểm kích hoạt gây tê và đau lan vùng MCN = dấu chẩn đoán then chốt.",
  "Hộp 11.1 – 5 tiêu chuẩn MCN: (1) đau thắt lưng lan mông; (2) nặng lên theo vận động/tư thế thắt lưng; (3) ấn đau ~35 mm phía đuôi PSIS; (4) ấn điểm kích hoạt gây tê–đau lan vùng MCN; (5) giảm triệu chứng sau phong bế MCN.",
  "Chỉ định PNS: triệu chứng kháng trị với vật lý trị liệu, thuốc, TENS, phong bế/tiêm; phải loại trừ bệnh lý sửa được bằng chẩn đoán và hình ảnh.",
  "Đánh giá tâm lý: yếu tố nguy cơ kết quả kém – đau mạn kéo dài, căng thẳng tâm lý, bi quan hóa, tiền sử lạm dụng/chấn thương, nicotine/lạm dụng chất, hỗ trợ xã hội kém, suy giảm nhận thức; 50–80% bệnh nhân ở phòng khám đau mạn có dấu hiệu bệnh lý tâm thần.",
  "4 tiêu chí chọn bệnh nhân PNS: (1) đau theo vùng cảm giác của một dây thần kinh ngoại biên; (2) phong bế thần kinh ngoại biên chẩn đoán dương; (3) không bệnh tâm lý/tâm thần nặng; (4) vận hành được thiết bị. Đồng thuận; chưa có nghiên cứu cho thấy phong bế chẩn đoán hay TENS dự đoán thành công.",
  "Chống chỉ định: rối loạn đông máu, nhiễm trùng vị trí mổ, bệnh tâm thần, phong bế chẩn đoán thất bại, mất cảm giác hoàn toàn (chủ yếu cho cấy vĩnh viễn; một số tương đối). Tư vấn: nhiễm trùng, tổn thương thần kinh, di lệch điện cực, hỏng cơ học (tuột kết nối), không đủ kích thích/giảm đau, đau, thẩm mỹ.",
  "Thuốc chống đông (ASRA + NANS): PNS thuộc nhóm nguy cơ chảy máu THẤP; cao: kích thích tủy sống, hạch rễ sau, giải ép qua da, catheter nội tủy, tạo hình thân đốt sống, nội soi ngoài màng cứng; trung bình: tiêm ngoài màng cứng, qua lỗ liên hợp, khối mặt khớp cổ, thủ thuật đĩa đệm, phong bế giao cảm, dây V; thấp: PNS, khớp ngoại biên, điểm kích hoạt, tiêm SIJ, RFA ngực–thắt lưng, chỉnh túi máy. Nguy cơ ngừng thuốc có thể lớn hơn nguy cơ thủ thuật; bệnh nhân nguy cơ cao xếp lên một mức.",
  "Dụng cụ: điện cực/lead; nguồn IPG (pin hạn chế, thay sau vài năm) hoặc máy ngoài ghép nối sóng cao tần (RF coupling; pin gia dụng; cần bệnh nhân tham gia nhiều hơn); introducer thường là kim Tuohy; siêu âm hoặc X-quang xác định mốc; neo điện cực vào mạc bằng chỉ không tiêu (Ethibond polyester, Prolene polypropylene, Ethilon nylon; giữ độ bền sau 60 ngày); tạo túi (dao + kéo Metzenbaum hoặc bóc tách bằng ngón); dụng cụ luồn (tunneling).",
  "Đóng vết mổ: tưới rửa; chỉ tiêu lớp sâu giảm khoảng chết; da nông bằng ghim hoặc Monocryl ± Steri-Strip/keo; bằng chứng ghim–nhiễm trùng mâu thuẫn, tùy phẫu thuật viên. Hướng dẫn NACC giảm nhiễm trùng; công nghệ ngày càng nhỏ, dễ đặt hơn."
 ],

  "Đánh giá trước mổ: khám ở lần đầu và NGAY trước thủ thuật; bệnh nhân đã thất bại điều trị bảo tồn; xem bệnh nền (đái tháo đường, tim, chống đông); yếu tố làm khó hình ảnh (phẫu thuật cũ, không nằm được tư thế); đánh giá lại xem bệnh nhân làm đúng dặn dò (ngừng chống đông).",

  "Chống đông: ASRA 2018 – thử và cấy PNS là nguy cơ chảy máu thấp–trung bình tùy dây thần kinh đích; đường sau cho SIJ ít gặp mạch lớn nhưng phải biết giải phẫu động–tĩnh mạch; phân tầng từng bệnh nhân (chảy máu vs nguy cơ tim mạch khi ngừng); phối hợp bác sĩ kê đơn.",

/* Chương 13 của mục Đau khớp cùng chậu (nối vào mảng SIJ). Điền link YouTube vào yt khi có. */
SIJ.push(
{ id:13, t:"Chương 13 · Thử và cấy kích thích thần kinh ngoại biên (PNS) cho khớp cùng–chậu", yt:"", min:30,
 pts:[
  "PNS = kích thích điện trực tiếp các dây thần kinh có tên, nằm ngoài trục thần kinh, ức chế trực tiếp sợi hướng tâm sơ cấp. Từ mổ mở bóc tách → thủ thuật qua da với hướng dẫn hình ảnh; nay có thiết bị chuyên cho PNS (trước đây dùng máy kích thích tủy sống cấy ngoại biên ngoài chỉ định).",
  "Đích của SIJ: nhánh sau S1, S2, S3; ngoài ra nhánh trước L4, L5, thần kinh mông trên, nhánh sau L5, thần kinh mông giữa (nhánh cảm giác của nhánh sau S1–S3, nằm sau PSIS, chi phối mông sau–trong). Thường dùng huỳnh quang; siêu âm hỗ trợ.",
  "Lịch sử: PNS từ thập niên 1960 (thuyết cổng kiểm soát đau Melzack–Wall; bệnh nhân đầu tiên là phụ nữ 26 tuổi hội chứng đau vùng phức tạp); ít áp dụng vì thiếu nghiên cứu và tính dự đoán; 1980s Weiner & Reed đặt điện cực qua da cạnh dây thần kinh chẩm (cạnh dây cho giảm đau như đặt trực tiếp); 1999 phát triển đường qua da.",
  "Thử kích thích: 7–14 ngày (như kích thích tủy sống); giảm đau có thể kéo dài sau tháo; một số thiết bị dùng ~60 ngày rồi tháo, kết quả ≥12 tháng; ngoại trú, điện cực tạm cố định vào da nối máy phát tạm; bệnh nhân ghi đau mỗi ngày; thành công khi giảm đau >50%; thử thất bại ≈ chống chỉ định tuyệt đối cho cấy vĩnh viễn.",
  "Chuẩn bị thử: xin đồng ý (nói rõ nếu dùng ngoài chỉ định); xác định tư thế tốt nhất (cho máy thu và điện cực cấy); đặt tư thế, kê đệm.",
  "Xác định đích: sát khuẩn; vị trí điện cực theo kích thích thần kinh và phản hồi bệnh nhân (cường độ, vị trí, cảm giác); huỳnh quang/siêu âm/cả hai (siêu âm thấy dây thần kinh; huỳnh quang cần biết rõ giải phẫu); đánh dấu da bằng bút vô trùng; tê tại chỗ nhưng KHÔNG làm tê dây thần kinh đích; introducer tạo đường; Hình 13.2: đích nông → hai dấu da xa nhau, đích sâu → gần nhau, khoảng cách 5–10 cm. Bộ introducer: dilator, sheath, khóa Luer (Hình 13.3).",

 cards:[
  ["Định nghĩa PNS?","Kích thích điện trực tiếp các dây thần kinh có tên, nằm ngoài trục thần kinh, ức chế trực tiếp sợi hướng tâm sơ cấp.","SIJ"],
  ["PNS đã tiến hóa thế nào?","Từ mổ mở bóc tách dây thần kinh → thủ thuật qua da chỉ cần hướng dẫn hình ảnh; có thiết bị chuyên dụng thay vì dùng máy kích thích tủy sống ngoài chỉ định.","SIJ"],
  ["Đích chính của PNS ở SIJ?","Nhánh sau S1, S2, S3.","SIJ"],
  ["Các thần kinh khác chi phối SIJ nêu trong chương?","Nhánh trước L4, L5; thần kinh mông trên; nhánh sau L5; thần kinh mông giữa.","SIJ"],
  ["Thần kinh mông giữa là gì?","Nhánh cảm giác của nhánh sau S1–S3, nằm sau PSIS, chi phối vùng mông sau–trong.","SIJ"],
  ["Cơ sở lý thuyết của PNS?","Thuyết cổng kiểm soát đau (Melzack và Wall): thông tin cảm giác vô hại có thể ức chế dẫn truyền đau.","SIJ"],
  ["Vì sao PNS bị chấp nhận chậm?","Thiếu nghiên cứu, không dự đoán/thử trước được; mổ mở cồng kềnh, biến chứng nhiều (tổn thương thần kinh phổ biến, mổ lại >85%).","SIJ"],
  ["Weiner và Reed (1980s)?","Tiên phong đặt điện cực qua da gần dây thần kinh chẩm; điện cực cạnh dây cho giảm đau như đặt trực tiếp lên dây.","SIJ"],
  ["Năm nào phát triển đường qua da?","1999: hiệu quả hơn, hiệu quả tương đương hoặc cao hơn, biến chứng giảm và nhẹ hơn.","SIJ"],

  ["Tiêu chuẩn thử thành công?","Giảm đau >50%; thử thất bại gần như luôn là chống chỉ định tuyệt đối cho cấy vĩnh viễn.","SIJ"],
  ["Thử kích thích: điện cực cố định thế nào?","Điện cực tạm cố định vào da, nối máy phát tạm; bệnh nhân ghi đau hằng ngày; thủ thuật ngoại trú.","SIJ"],
  ["Chuẩn bị trước khi thử?","Xin đồng ý (nói rõ nếu ngoài chỉ định); xác định tư thế tốt nhất cho máy thu và điện cực; đặt tư thế, kê đệm.","SIJ"],
  ["Hướng dẫn hình ảnh khi đặt điện cực?","Huỳnh quang, siêu âm hoặc cả hai; siêu âm thấy dây thần kinh; huỳnh quang cần kiến thức giải phẫu vững.","SIJ"],
  ["Lưu ý gây tê khi đặt điện cực?","Có thể tê tại chỗ nhưng KHÔNG làm tê dây thần kinh đích (mất phản hồi cảm giác).","SIJ"],
  ["Hình 13.2: khoảng cách dấu da?","Đích nông: hai dấu xa nhau; đích sâu: hai dấu gần nhau; 5–10 cm giữa điểm đích và điểm rạch.","SIJ"],
  ["Các thành phần bộ introducer?","Dilator (nong), sheath (vỏ), lắp ráp có khóa Luer; một số hãng có stimulation probe.","SIJ"],
  ["Biên độ kích thích ban đầu?","Đặt bằng 0; trợ lý không vô trùng tăng từ từ đến khi bệnh nhân khó chịu hoặc tối đa; quá cao có thể gây tổn thương mô.","SIJ"],
  ["Mục đích của kích thích thử?","Xác định vị trí dị cảm trong vùng cảm giác của dây thần kinh đích; ghi thông số để dùng khi cấy.","SIJ"],
  ["Không thấy dị cảm thì làm gì?","Đặt lại vị trí; không được bẻ cong probe.","SIJ"],
  ["Cách tìm biên độ tối thiểu?","Giảm từng nấc đến khi bệnh nhân mất dị cảm; tăng chậm đến khi trở lại; mức lúc trở lại là biên độ tối thiểu.","SIJ"],
  ["Vì sao giữ nguyên độ sâu và hướng que?","Chuyển động nhỏ làm mất vị trí đã xác định và ảnh hưởng kết quả; chụp huỳnh quang ghi lại để tham chiếu.","SIJ"],
  ["Cách đưa điện cực vào introducer?","Đầu neo trước nếu có; giữ chặt điện cực; rút introducer chậm đến vạch của hãng để đầu kích thích lộ ra.","SIJ"],
  ["Bệnh nhân không nhận ra đáp ứng khi thử điện cực?","Rút introducer và điện cực cùng nhau, kiểm tra hư hỏng; nếu nguyên vẹn thì đặt lại và thử lại.","SIJ"],
  ["Khi đã xác nhận vị trí điện cực?","Rút introducer chậm, giữ điện cực/loader, ấn nhẹ mô quanh đầu kích thích; nối đầu thu với cáp; thử lại; một số thiết bị bung neo tại điểm rút định sẵn.","SIJ"],

  ["Hệ thống không dây khác IPG thế nào?","Không cấy IPG: máy phát đặt nông gần điện cực, giữ bằng đai hoặc quần áo, máy phát phía trên cấp năng lượng.","SIJ"],
  ["Nguyên tắc luồn đầu thu dưới da?","Không được qua đường khớp; kết thúc ở nơi bệnh nhân chịu được; kim luồn song song, nông nhất có thể; kim rất sắc.","SIJ"],
  ["Cách phòng điện cực di lệch khi rút kim luồn?","Ấn mô tại vết rạch khi rút kim luồn; đưa đầu thu vào kim không chùng, không kẹp hay làm hỏng; tránh kẹp có răng.","SIJ"],
  ["Tạo túi cho IPG?","Tê tại chỗ, giữ trên mạc, túi chỉ vừa đủ cho IPG; huỳnh quang ghi vị trí đầu thu và IPG; đóng bằng chỉ khâu chuẩn.","SIJ"],
  ["Dặn dấu hiệu nhiễm trùng sau cấy?","Ban đỏ mới, cứng, đau mới (có thể lan rộng), sốt mới, mệt chung; tái khám tùy bệnh nhân và thiết bị.","SIJ"]

  "PGIC: tự báo cáo cải thiện là tiêu chuẩn vàng; thang 7 điểm: 1 rất nhiều cải thiện, 2 cải thiện nhiều, 3 tối thiểu, 4 không đổi, 5 xấu đi tối thiểu, 6 xấu đi nhiều, 7 rất nhiều xấu đi; chỉ số hài lòng chung.",

{ id:15, t:"Chương 15 · Biến chứng của PNS cho đau khớp cùng–chậu", yt:"", min:18,
 pts:[
  "3 nhóm biến chứng PNS: (1) liên quan phần cứng; (2) sinh học; (3) lập trình/điều trị.",
  "Lịch sử: PNS xuất phát từ Campbell và Long (Johns Hopkins, 1976); điện cực vòng bề mặt lớn → lập bản đồ chức năng thần kinh → điện cực dạng bản (paddle) → điện cực trụ qua da kiểu SCS → kim sóng cao tần (gây dị cảm ở bệnh nhân tỉnh để lập bản đồ đau); thiết bị nhỏ hơn, dễ cấy hơn, hiệu quả chi phí hơn.",
  "PNS “cất cánh” cuối thập niên 1990: trước đó trì trệ vì cách mổ không chuẩn hóa → kết quả kém, bệnh suất (xoay, xoắn, tịnh tiến điện cực), mất kích thích do sẹo; điện cực trụ qua da cho phép đặt trường điện gần bó thần kinh không cần bóc tách; thiết bị điều biến thần kinh mới được FDA duyệt tăng 35% năm 2007.",
  "Biến chứng PHẦN CỨNG thường gặp nhất: di lệch hoặc gãy điện cực, vấn đề kết nối, hết pin sớm.",
  "Điện cực đời đầu: dây kim loại (Wall, Sweet); điện cực vòng (Shelden, ~1960s) → sẹo, xơ hóa, thắt chặt dây thần kinh; kích thích ưu thế (chỉ phần dây tiếp xúc kim loại đáp ứng); điện cực dạng nút phải khâu vào màng quanh thần kinh: tốn thời gian, nhiều thao tác → nhiễm trùng, sẹo, xơ hóa; điện cực vòng gây siết dây thần kinh (xơ hóa/thiếu máu) → bị bỏ hẳn.",
  "Di lệch điện cực: vẫn là vấn đề dai dẳng; bóc tách tỉ mỉ và khâu chắc cũng không hết; giải pháp thường là đặt lại hoàn toàn; tỷ lệ mổ lại >85% trước khi có đường qua da.",
  "Ngày nay (đường qua da): biến chứng chủ yếu là phần cứng (di lệch, gãy); di lệch dễ sửa hơn – đặt lại không cần mở túi máy phát; gập/gãy điện cực ở điểm chuyển tiếp qua khớp, đoạn dài, kéo giãn/ép quá mức; thiết bị chuyên cho PNS chú ý chiều dài và đường luồn, ít cần luồn xa; vẫn phải tính đường đi từ điện cực đến máy phát.",
  "Biến chứng SINH HỌC: nhiễm trùng thường gặp nhất, ~3%, sớm hoặc muộn; nguyên nhân hàng đầu: kỹ thuật phẫu thuật kém → giữ vô trùng suốt cuộc mổ; nếu nhiễm trùng: nhiều khả năng phải tháo toàn bộ thiết bị + kháng sinh toàn thân, có thể cấy lại sau vài tháng.",
  "Biến chứng sinh học khác: xuất huyết hiếm, dễ kiểm soát (vị trí nông); tụ máu hiếm khi có triệu chứng; hở vết mổ và loét do thiết bị hiếm; đau tại vị trí cấy thoáng qua hoặc dễ xử trí; tổn thương thần kinh nặng, liệt cực hiếm.",
  "Biến chứng LẬP TRÌNH/ĐIỀU TRỊ: ít đe dọa nhất; mất dị cảm hoặc dị cảm gây đau/khó chịu; xử trí bằng chỉnh lập trình; hiếm khi phải tháo máy khi điều trị được xem là thất bại.",

 cards:[
  ["3 nhóm biến chứng của PNS?","Liên quan phần cứng; sinh học; lập trình/điều trị.","SIJ"],
  ["Ai khởi đầu PNS và khi nào?","Campbell và Long, Đại học Johns Hopkins, 1976.","SIJ"],
  ["Tiến hóa của điện cực PNS?","Điện cực vòng bề mặt lớn → lập bản đồ chức năng thần kinh → điện cực dạng bản (paddle) → điện cực trụ qua da kiểu kích thích tủy sống → kim sóng cao tần.","SIJ"],

  ["Điện cực đầu tiên của Wall và Sweet?","Dây kim loại cắm vào hoặc sát dây thần kinh.","SIJ"],
  ["Điện cực vòng (Shelden) gây vấn đề gì?","Sẹo, xơ hóa, thắt chặt dây thần kinh; kích thích ưu thế; nguy cơ siết dây (xơ hóa/thiếu máu) → bị bỏ hẳn.","SIJ"],
  ["Kích thích ưu thế (preferential stimulation)?","Chỉ phần dây thần kinh tiếp xúc trực tiếp với kim loại đáp ứng; dây lớn: dị cảm chỉ khi co/thư giãn hoặc không có.","SIJ"],
  ["Điện cực dạng nút: ưu và nhược?","Giải quyết kích thích ưu thế nhưng phải khâu vào màng quanh dây thần kinh: tốn thời gian, cần chuyên môn, thao tác nhiều → nhiễm trùng, sẹo, xơ hóa.","SIJ"],
  ["Di lệch điện cực thời mổ mở?","Giải pháp thường là đặt lại hoàn toàn; tỷ lệ mổ lại >85% trước khi có đường qua da.","SIJ"],
  ["Di lệch điện cực ngày nay khác trước thế nào?","Vẫn thường gặp nhưng dễ sửa: đặt lại không cần mở túi máy phát.","SIJ"],
  ["Gập/gãy điện cực xảy ra ở đâu?","Điểm chuyển tiếp qua khớp, đoạn đi dài, hoặc do kéo giãn/ép quá mức.","SIJ"],
  ["Thiết bị chuyên cho PNS có điểm tốt gì?","Chú ý chiều dài điện cực và đường luồn; đặt được ở nhiều nơi; ít cần luồn xa đến túi máy.","SIJ"],
  ["Tỷ lệ nhiễm trùng của PNS?","~3% (sớm hoặc muộn); nguyên nhân hàng đầu: kỹ thuật phẫu thuật kém.","SIJ"],
  ["Xử trí nhiễm trùng thiết bị PNS?","Nhiều khả năng phải tháo toàn bộ thiết bị + kháng sinh toàn thân phù hợp; có thể cấy lại sau vài tháng.","SIJ"],
  ["Xuất huyết/tụ máu khi đặt PNS?","Hiếm, dễ kiểm soát vì vị trí nông; tụ máu hiếm khi có triệu chứng.","SIJ"],
  ["Các biến chứng sinh học hiếm khác?","Hở vết mổ, loét do thiết bị; đau tại vị trí cấy (thoáng qua); tổn thương thần kinh nặng, liệt (cực hiếm).","SIJ"],
  ["Biến chứng lập trình/điều trị?","Mất dị cảm; dị cảm gây đau/khó chịu; xử trí bằng chỉnh lập trình; hiếm khi phải tháo máy.","SIJ"],
  ["Đặt sai khoang giải phẫu: thực hay lý thuyết?","Lý thuyết hơn là thực; quan trọng: điện cực nằm trong mặt phẳng dưới da, trên mạc, sát dây thần kinh.","SIJ"],
  ["Phương tiện xác nhận vị trí điện cực?","Huỳnh quang hoặc siêu âm trong mổ để định vị dây thần kinh và xác nhận vị trí.","SIJ"],
  ["Nhóm biến chứng nhẹ nhất?","Lập trình/điều trị (xử trí bằng chỉnh máy).","SIJ"],
  ["Thông điệp kết luận chương 15?","Biến chứng PNS hiện nay hiếm và nhẹ; nhập viện cực kỳ ít; đường qua da đã thay đổi tất cả.","SIJ"]

/* Chương 16 của mục Đau khớp cùng chậu (nối vào mảng SIJ). Điền link YouTube vào yt khi có. */
SIJ.push(
{ id:16, t:"Chương 16 · Chọn bệnh nhân cho phẫu thuật hàn khớp cùng–chậu", yt:"", min:25,
 pts:[
  "Lịch sử: Smith-Petersen và Rogers mô tả hàn SIJ năm 1921 (đường mở sau–bên xuyên chậu); hàn mở nay chỉ dành cho gãy vòng chậu chấn thương, nhiễm trùng SIJ, u xương cùng, hoặc hàn đoạn dài cho biến dạng cột sống (hồi phục lâu, biến chứng cao). 2008: FDA duyệt thiết bị xâm lấn tối thiểu đầu tiên; 2012: >80% ca hàn là xâm lấn tối thiểu.",
  "Bằng chứng: hàn xâm lấn tối thiểu giảm đau, chức năng, chất lượng sống tốt hơn điều trị không phẫu thuật ở bệnh nhân chọn lọc. Graham-Smith (đoàn hệ so sánh đa trung tâm đầu tiên): thời gian mổ ngắn hơn ~1,5 giờ; nằm viện ngắn hơn gần 4 ngày; mất máu ít hơn; VAS giảm −6,2 vs −2,7 (hơn 3 điểm).",
  "Rủi ro: cao hơn tiêm/RFA; Shamrock: 11% có biến chứng liên quan thủ thuật; thường gặp nhất nhiễm trùng/chảy dịch vết mổ; khác: chèn ép rễ thần kinh, viêm bao hoạt dịch mấu chuyển, tụ máu, nứt xương chậu.",
  "Chỉ định (ISASS/NASS) – 7 điều kiện: (1) chẩn đoán đau SIJ, SIJ là nguồn đau chính, đã loại trừ chẩn đoán khác; (2) rối loạn chức năng do vỡ khớp hoặc viêm khớp cùng–chậu thoái hóa (kể cả bắt đầu thai kỳ/sau sinh kéo dài >6 tháng; gãy liên quan SIJ); (3) đau vừa–nặng dai dẳng, thường ≥5/10; (4) ấn đau mặt sau khớp và rãnh cùng (điểm Fortin); (5) dương tính ≥3/5 nghiệm pháp kích thích; (6) thất bại ≥6 tháng bảo tồn (thuốc, vật lý trị liệu, tiêm huỳnh quang, RFA); (7) giảm đau ≥50% sau tiêm thuốc tê vào SIJ dưới huỳnh quang.",
  "Chống chỉ định: biến dạng/biến thể giải phẫu cản trở đặt thiết bị; u xương cùng hoặc chậu; nhiễm trùng hoạt động tại vị trí; gãy không vững xương cùng/chậu liên quan SIJ; dị ứng/không dung nạp kim loại hoặc thành phần implant. Không chỉ định: đau <6 tháng; không theo đuổi bảo tồn (trừ chống chỉ định); đau không được xác nhận bằng đáp ứng tiêm trong khớp; có bệnh lý khác ngăn lợi ích.",
  "Hình ảnh (NASS): X-quang + CT hoặc MRI SIJ (loại trừ u, nhiễm trùng, bệnh khớp viêm); X-quang khung chậu AP (loại trừ bệnh khớp háng); CT hoặc MRI cột sống thắt lưng (loại trừ chèn ép thần kinh/thoái hóa khác). Hình ảnh chủ yếu để LOẠI TRỪ nguyên nhân khác, không chẩn đoán đau SIJ vô căn.",
  "Hai đường hàn xâm lấn tối thiểu: từ bên (FDA 2008, phần lớn y văn; thường phẫu thuật viên; bóc tách qua cơ mông bên đến xương chậu, đặt thiết bị xuyên chậu–cùng qua SIJ; nguy cơ tổn thương rễ thần kinh thắt lưng–cùng cao hơn) và từ sau (mới hơn; bác sĩ can thiệp đau cũng làm được; rạch giữa/cạnh giữa lưng đến ngách dây chằng sau, làm sạch mô mềm, implant + ghép xương; ít xâm lấn, ít cơ tổn thương, quan sát tốt hơn ở người to lớn). Độ vững tương tự.",
  "Tâm thần: không nên có rối loạn đau toàn thể (somatoform, fibromyalgia); soma hóa trước mổ liên quan đáp ứng kém với phẫu thuật thắt lưng và kích thích tủy sống; lo âu–trầm cảm tiền phẫu ở ~1/3 bệnh nhân đau lưng mạn, thường cải thiện sau khi hết đau; yếu tố nguy cơ: đau mạn, căng thẳng tâm lý, bi quan hóa, lạm dụng/chấn thương, nicotine/lạm dụng chất, hỗ trợ xã hội kém, suy giảm nhận thức.",
  "Mật độ xương: BMD là chỉ báo cho độ chắc cố định vít ở xương cùng; lỏng implant phía xương cùng là kiểu thất bại thường gặp nhất; loãng xương (T-score < −2,5 trên DEXA) là chống chỉ định tương đối; CT cơ hội đo đơn vị Hounsfield xương cùng để dự đoán BMD (cần nghiên cứu thêm ngưỡng).",
  "Từng hàn cột sống thắt lưng: đau SIJ ở 43–61% sau hàn thắt lưng–cùng; có thể gây nhiễu nguồn đau; khi đã xác định SIJ là nguồn đau chính thì có thể hàn SIJ; Rudolf: hài lòng hơi cao hơn, vẫn cải thiện đau có ý nghĩa.",
  "Tối ưu: bỏ thuốc lá 4–6 tuần (Dengler: người đang hút thuốc giảm đau kém hơn 5,9 điểm VAS, tàn tật cao hơn); HbA1c: chưa có ngưỡng cấm tuyệt đối, mục tiêu an toàn <8–9 (tăng đường huyết → nhiễm trùng vết mổ, chậm lành, thuyên tắc phổi).",
  "Hiệu quả lâu dài: bền đến 5 năm nếu có lợi; Cher (11.388 bệnh nhân, 2009–2014): tỷ lệ mổ lại cộng dồn 4 năm 3,5% (sống sót 96,5%), giảm hằng năm; so sánh: thay khớp háng toàn phần <2–4%; giải ép thắt lưng 10,6–17,2%; hàn thắt lưng 10,7–13,5%.",
  "Kết luận: (1) khám kỹ bảo đảm SIJ là nguồn đau; (2) hình ảnh loại trừ hẹp ống sống, bệnh rễ thắt lưng, hội chứng sau cắt cung, bệnh khớp háng; (3) tối ưu bệnh nhân (đái tháo đường, trầm cảm, hút thuốc, loãng xương); hoãn mổ nếu giúp giảm rủi ro."
 ],

  ["Graham-Smith: xâm lấn tối thiểu so với mở?","Thời gian mổ ngắn hơn ~1,5 giờ; nằm viện ngắn hơn gần 4 ngày; mất máu ít hơn; VAS giảm −6,2 vs −2,7.","SIJ"],
  ["Shamrock về biến chứng hàn xâm lấn tối thiểu?","11% có biến chứng liên quan thủ thuật; thường gặp nhất nhiễm trùng/chảy dịch vết mổ.","SIJ"],
  ["Các biến chứng khác của hàn xâm lấn tối thiểu?","Chèn ép rễ thần kinh, viêm bao hoạt dịch mấu chuyển, tụ máu, nứt xương chậu dạng đường chân tóc.","SIJ"],
  ["Chỉ định 1 và 2 của hàn SIJ?","(1) SIJ là nguồn đau chính, đã loại trừ chẩn đoán khác; (2) rối loạn chức năng do vỡ khớp/viêm khớp cùng–chậu thoái hóa (kể cả thai kỳ/sau sinh >6 tháng; gãy liên quan SIJ).","SIJ"],
  ["Chỉ định 3 và 4?","(3) Đau vừa–nặng dai dẳng, thường ≥5/10; (4) ấn đau mặt sau khớp và rãnh cùng (điểm Fortin).","SIJ"],
  ["Chỉ định 5, 6, 7?","(5) Dương tính ≥3/5 nghiệm pháp kích thích; (6) thất bại ≥6 tháng điều trị bảo tồn; (7) giảm đau ≥50% sau tiêm thuốc tê vào SIJ dưới huỳnh quang.","SIJ"],
  ["Chống chỉ định hàn xâm lấn tối thiểu?","Biến dạng/biến thể cản trở thiết bị; u xương cùng/chậu; nhiễm trùng hoạt động; gãy không vững xương cùng/chậu liên quan SIJ; dị ứng kim loại/thành phần implant.","SIJ"],
  ["Khi nào KHÔNG chỉ định hàn?","Đau <6 tháng; chưa thử bảo tồn (trừ chống chỉ định); đau không được xác nhận bằng đáp ứng tiêm trong khớp; có bệnh lý khác ngăn lợi ích.","SIJ"],
  ["Vai trò hình ảnh trước hàn?","Chủ yếu loại trừ nguyên nhân khác chứ không chẩn đoán đau SIJ vô căn.","SIJ"],
  ["Hình ảnh NASS yêu cầu?","X-quang + CT/MRI SIJ (loại u, nhiễm trùng, bệnh khớp viêm); X-quang khung chậu AP (khớp háng); CT/MRI cột sống thắt lưng (chèn ép thần kinh, thoái hóa).","SIJ"],
  ["Hàn từ bên: đặc điểm?","FDA 2008, phần lớn y văn; thường phẫu thuật viên; bóc tách qua cơ mông bên đến xương chậu, đặt thiết bị xuyên chậu–cùng; nguy cơ tổn thương rễ thần kinh cao hơn.","SIJ"],
  ["Hàn từ sau: đặc điểm?","Mới hơn; bác sĩ can thiệp đau cũng làm được; rạch giữa/cạnh giữa lưng đến ngách dây chằng sau, làm sạch mô mềm, implant + ghép xương; ít xâm lấn, ít cơ tổn thương, quan sát tốt hơn ở người to lớn.","SIJ"],
  ["Độ vững khớp giữa hai đường hàn?","Tương tự nhau.","SIJ"],
  ["Tiền sử tâm thần và chọn bệnh nhân hàn?","Không nên có rối loạn đau toàn thể (somatoform, fibromyalgia); soma hóa liên quan đáp ứng kém; lo âu–trầm cảm ở ~1/3, thường cải thiện sau khi hết đau.","SIJ"],
  ["Yếu tố nguy cơ kết quả không thành công?","Đau mạn, căng thẳng tâm lý, bi quan hóa, tiền sử lạm dụng/chấn thương, nicotine/lạm dụng chất, hỗ trợ xã hội kém, suy giảm nhận thức.","SIJ"],
  ["Mật độ xương và hàn SIJ?","BMD chỉ báo độ chắc vít ở xương cùng; lỏng phía xương cùng là kiểu thất bại phổ biến nhất; loãng xương (T-score < −2,5) là chống chỉ định tương đối.","SIJ"],
  ["CT cơ hội và mật độ xương cùng?","Đo đơn vị Hounsfield xương cùng trên CT chẩn đoán để sàng lọc loãng xương và dự đoán BMD; cần nghiên cứu thêm ngưỡng HU theo vùng.","SIJ"],
  ["Đau SIJ ở bệnh nhân sau hàn cột sống thắt lưng?","43–61% sau hàn thắt lưng–cùng; có thể hàn SIJ nếu đã xác định SIJ là nguồn đau chính; Rudolf: hài lòng hơi cao hơn.","SIJ"],
  ["Hút thuốc và hàn SIJ?","Bỏ thuốc ≥4–6 tuần; Dengler: người đang hút thuốc giảm đau kém hơn 5,9 điểm VAS, tàn tật cao hơn.","SIJ"],
  ["HbA1c trước hàn?","Cần kiểm soát; chưa có ngưỡng cấm tuyệt đối; mục tiêu an toàn <8–9; tăng đường huyết → nhiễm trùng vết mổ, chậm lành, thuyên tắc phổi.","SIJ"],
  ["Hiệu quả lâu dài của hàn SIJ?","Bền đến 5 năm nếu có lợi; Cher (11.388 bệnh nhân): mổ lại cộng dồn 4 năm 3,5% (sống sót 96,5%), giảm hằng năm.","SIJ"],
  ["So sánh tỷ lệ mổ lại 4 năm?","Hàn SIJ 3,5%; thay khớp háng toàn phần <2–4%; giải ép thắt lưng 10,6–17,2%; hàn thắt lưng 10,7–13,5%.","SIJ"],
  ["3 ý kết luận chương 16?","Khám kỹ để chắc SIJ là nguồn đau; hình ảnh loại trừ hẹp ống sống, bệnh rễ, hội chứng sau cắt cung, khớp háng; tối ưu bệnh nhân (đái tháo đường, trầm cảm, hút thuốc, loãng xương), hoãn mổ nếu giúp.","SIJ"]
 ],

/* Chương 17 của mục Đau khớp cùng chậu (nối vào mảng SIJ). Điền link YouTube vào yt khi có. */
SIJ.push(
{ id:17, t:"Chương 17 · Dụng cụ phẫu thuật hàn khớp cùng–chậu", yt:"", min:22,
 pts:[
  "Hàn SIJ mở nguyên thủy 1921; từ 2008 có 2 đường xâm lấn tối thiểu (sau và bên); hiện có >20 hệ thống hàn SIJ. Thủ thuật dẫn đường bằng huỳnh quang (hình tia X liên tục) hoặc CT (nhiều ảnh tia X từ các góc ghép lại, chi tiết hơn), không nhìn trực tiếp giải phẫu.",
  "Tư thế: bàn xuyên tia, giảm tối đa ưỡn thắt lưng; khung Wilson (gây gù tăng gập L4–5 thêm 47% và L5–S1 thêm 21%; gây gù trước rạch da giúp bộc lộ tốt hơn); không có thì kê gối gel hoặc khăn cuộn dưới bụng.",
  "Sát khuẩn: Lister (1827–1912) dùng acid carbolic (phenol); trước giữa thế kỷ 19 cắt cụt chi tử vong 50% do nhiễm trùng huyết; hiện dùng iodophor và chlorhexidine gluconate; chuẩn bị vùng thắt lưng–cùng bên hàn; khăn/drap vô trùng; có thể dùng miếng dán Ioban.",
  "Vật dụng không phải dụng cụ: bút đánh dấu vô trùng; que chỉ cản quang; kim da 25G dài 1,5 inch + ống 10 mL; thuốc tê ± epinephrine (hỗ trợ cầm máu); kim chọc tủy sống 22G dài 3,5 inch (tê dọc đường kim dẫn); Ray-tec/gạc; nước muối ± kháng sinh để rửa; băng vô trùng (Steri-Strips, gạc, Tegaderm).",
  "Bảng 17.1 – dụng cụ do cơ sở cung cấp: dao mổ (số 10 rạch da lớn; số 11 rạch đâm; số 15 rạch tinh); dao điện (lưỡng cực/đơn cực); kẹp bọc gạc (giữ kim dẫn ngoài trường tia X); kẹp mô (Adson: có/không răng, dùng nhiều nhất; Debakey: dài, tinh, không răng); kẹp kim (lớn/nhỏ); búa chỉnh hình (không phải “cái búa”, còn để đẩy/nắn); máy khoan chỉnh hình (chạy pin, mũi khoan trong bộ); chỉ (tiêu/không tiêu); kéo Mayo thẳng cắt chỉ.",
  "Dao điện: lưỡng cực – dòng chạy từ một nhánh kẹp qua mô về nhánh kia rồi về máy; đơn cực – bút điện, dòng về máy qua miếng tiếp đất dán da gần vùng mổ. Cầm máu: máy hút; dao điện; miếng xốp Gelfoam thrombin (gelatin da lợn tinh chế) nếu khó cầm máu.",
  "Đặt implant: kẹp bọc gạc giữ kim dẫn ngoài trường tia X để giảm phơi nhiễm cho phẫu thuật viên; búa chỉnh hình đẩy kim dẫn, que nong, dụng cụ nạo vỏ xương (broach), thiết bị đưa implant; máy khoan: một số đường sau để mở đường implant và kích thích mọc xương; một số đường bên khoan kim dẫn từ xương chậu qua SIJ hoặc đặt vít.",
  "Đóng vết mổ: kẹp mô giữ mép da và gắp kim khâu; kẹp kim; đóng 2 lớp – lớp sâu chỉ tiêu bện (Vicryl), da bằng chỉ đơn sợi tiêu (Monocryl) hoặc ghim; kéo cắt chỉ.",
  "Bộ dụng cụ nhà sản xuất: kim dẫn (guide pin) vào SIJ; que nong/ống (dilator/cannula) đặt qua kim dẫn để nong SIJ; dụng cụ nạo vỏ xương (decorticator/broach) mở đường implant và kích thích mọc xương; mũi khoan (một số hãng); búa trượt (slap hammer) rút que nong bị kẹt; hệ thống đưa implant."
 ],
 cards:[
  ["Hàn SIJ mở nguyên thủy và các đường xâm lấn tối thiểu?","Hàn mở 1921; từ 2008 có 2 đường xâm lấn tối thiểu: sau và bên; hiện có >20 hệ thống trên thị trường.","SIJ"],
  ["Hàn xâm lấn tối thiểu dẫn đường bằng gì?","Huỳnh quang hoặc CT (không nhìn trực tiếp giải phẫu).","SIJ"],
  ["Huỳnh quang và CT khác nhau thế nào?","Huỳnh quang: hình tia X liên tục trên màn hình; CT: ghép nhiều ảnh tia X từ các góc, chi tiết hơn.","SIJ"],
  ["Tư thế bệnh nhân khi hàn SIJ?","Bàn xuyên tia; giảm tối đa ưỡn thắt lưng bằng khung Wilson hoặc gối gel/khăn cuộn dưới bụng.","SIJ"],
  ["Khung Wilson: số liệu?","Gây gù tăng gập L4–5 thêm 47% và L5–S1 thêm 21%; gây gù trước rạch da giúp bộc lộ tốt hơn.","SIJ"],
  ["Lister và sát khuẩn?","Joseph Lister (1827–1912) dùng acid carbolic (phenol); trước đó cắt cụt chi tử vong 50% do nhiễm trùng huyết; tỷ lệ nhiễm trùng huyết giảm mạnh.","SIJ"],
  ["Chất sát khuẩn da thường dùng hiện nay?","Iodophor và chlorhexidine gluconate.","SIJ"],

  ["Kim chọc tủy sống trong hàn SIJ?","22G dài 3,5 inch; tiêm thuốc tê dọc đường đi dự kiến của kim dẫn.","SIJ"],
  ["Que chỉ cản quang dùng làm gì?","Xác định dưới huỳnh quang điểm vào dự kiến của kim, kim dẫn hoặc dao.","SIJ"],
  ["Vật dụng vô trùng khác?","Ray-tec/gạc (thấm dịch, ép cầm máu); nước muối ± kháng sinh (rửa trước đóng); băng Steri-Strips, gạc, Tegaderm.","SIJ"],
  ["Lưỡi dao mổ số 10, 11, 15?","Số 10: rạch da lớn; số 11: rạch đâm (stab); số 15: rạch da nhỏ, tinh.","SIJ"],
  ["Dao điện lưỡng cực vs đơn cực?","Lưỡng cực: dòng đi qua một nhánh kẹp, qua mô, về nhánh kia rồi về máy. Đơn cực: bút điện; dòng về máy qua miếng tiếp đất dán da gần vùng mổ.","SIJ"],
  ["Cách cầm máu khi khó?","Máy hút, dao điện, miếng xốp Gelfoam thrombin (gelatin da lợn tinh chế) cắt và đặt vào vết thương.","SIJ"],
  ["Kẹp bọc gạc (ring forceps) dùng để làm gì?","Giữ kim dẫn ngoài trường tia X để giảm phơi nhiễm bức xạ tập trung cho phẫu thuật viên.","SIJ"],
  ["Búa chỉnh hình dùng để làm gì?","Đẩy kim dẫn, que nong, dụng cụ nạo vỏ xương, thiết bị đưa implant; không phải “cái búa”; còn đẩy/nắn chỉnh.","SIJ"],
  ["Máy khoan chỉnh hình trong hàn SIJ?","Đường sau: mở đường implant và kích thích mọc xương; đường bên: khoan kim dẫn từ xương chậu qua SIJ hoặc đặt vít; chạy pin, mũi khoan trong bộ.","SIJ"],
  ["Kẹp mô Adson và Debakey?","Adson: có hoặc không răng, dùng nhiều nhất; Debakey: dài hơn, tinh tế, không răng.","SIJ"],
  ["Đóng vết mổ hàn SIJ?","Hai lớp: lớp sâu chỉ tiêu bện (Vicryl); da bằng chỉ đơn sợi tiêu (Monocryl) hoặc ghim; dụng cụ: kẹp mô, kẹp kim, kéo Mayo thẳng.","SIJ"],
  ["Thành phần bộ dụng cụ của hãng?","Kim dẫn, que nong/ống, dụng cụ nạo vỏ xương (broach), mũi khoan (một số hãng), búa trượt, hệ thống đưa implant.","SIJ"],
  ["Búa trượt (slap hammer) để làm gì?","Rút các que nong bị kẹt trong khe hẹp.","SIJ"],
  ["Dụng cụ nạo vỏ xương (decorticator/broach)?","Mở đường cho implant và kích thích mọc xương.","SIJ"]

SIJ.push(
{ id:18, t:"Chương 18 · Cân nhắc trước mổ khi hàn khớp cùng–chậu", yt:"", min:25,
 pts:[
  "13–30% đau thắt lưng do SIJ. Ba trụ cột trước mổ: bệnh sử và yếu tố nguy cơ; kế hoạch thủ thuật; kiểm soát nguy cơ nhiễm trùng và chảy máu (thuốc chống đông).",
  "Bệnh sử/khám: xác nhận đau từ SIJ, tìm bệnh nền; bệnh nhân đã hoàn thành điều trị không phẫu thuật (vật lý trị liệu theo APTA, tiêm steroid trong khớp, thuốc giảm đau uống, RFA nhánh cùng) mà không cải thiện; hàn SIJ không giúp nếu đau do bệnh viêm hoặc lan từ nguyên nhân thắt lưng khác; khám cơ xương–thần kinh thắt lưng và hai chi dưới + tầm vận động; bệnh nền (đái tháo đường, tim mạch, suy thận, phù mạn, MRSA); rà soát thuốc, tuân thủ thuốc chống đông; yếu tố ảnh hưởng tư thế/quan sát (sẹo cũ); đánh giá lại ngay trước thủ thuật.",
  "Ứng viên: khám có cấu trúc – Fortin, ấn đau PSIS, posterior thigh thrust, FABER, giãn khung chậu, ép khung chậu, Gaenslen, sacral thrust; phong bế chẩn đoán SIJ có dẫn đường giảm triệu chứng >50%. Loại trừ: háng (tiêm chẩn đoán khớp háng nếu mơ hồ); cột sống (hình ảnh, nếu bất thường: ESI, phong bế rễ chọn lọc, mặt khớp – kém tin cậy hơn); đánh giá tâm lý (không bắt buộc); chọn mổ khi lợi ích > nguy cơ.",
  "Đường hàn: mổ mở (có thể cả đường trước) và MIS (sau hoặc xuyên chậu = bên); MIS giảm đau tốt hơn, chỉ số quanh mổ tốt hơn. Ít gặp mạch lớn nhưng phải biết rõ giải phẫu.",
  "Aspirin: aspirin đang dùng có thể là yếu tố nguy cơ tụ máu ngoài màng cứng; liều thấp trước mổ → chảy máu dẫn lưu nhiều hơn. NSAID không phải aspirin: ngừng 5 chu kỳ bán hủy; ức chế chọn lọc COX-2 không cần ngừng; fondaparinux và NOAC: 5 chu kỳ bán hủy; nguy cơ huyết khối tĩnh mạch cao: NOAC nửa liều 12 giờ sau thủ thuật.",
  "Bảng 18.1 (NOAC): dabigatran ngừng 4–5 ngày (6 ngày nếu bệnh thận); rivaroxaban 3 ngày; apixaban 3–5 ngày; dùng lại 24 giờ.",
  "Bảng 18.2 (P2Y12): clopidogrel 7 ngày (dùng lại 12–24 giờ; liều thường 75 mg sau 12 giờ, liều nạp chờ 24 giờ); prasugrel 7–10 ngày (24 giờ); ticagrelor 5 ngày (24 giờ).",
  "Bảng 18.3: warfarin 5 ngày, INR bình thường (24 giờ); heparin tĩnh mạch 4 giờ (dùng lại 2 giờ); heparin dưới da 2–3 lần/ngày 8–10 giờ (2 giờ; tăng lên 24 giờ nếu thủ thuật chảy máu nhiều); LMWH 24 giờ (24 giờ); tiêu sợi huyết ≥48 giờ (≥48 giờ; cục máu chưa ổn định đến ~10 ngày sau tiêu sợi huyết); fondaparinux 4 ngày (24 giờ). Warfarin nguy cơ huyết khối cao: cầu nối LMWH (hội chẩn).",
  "Quyết định chung (thầy thuốc can thiệp + bệnh nhân + bác sĩ kê đơn): ức chế phosphodiesterase (dipyridamole + aspirin tăng nguy cơ chảy máu), thuốc chẹn GP IIb/IIIa, P2Y12; thuốc tiêu sợi huyết gần đây → chuyển đội quản lý. Nguy cơ chảy máu cao: dùng đồng thời thuốc chống đông, tuổi cao, bệnh gan/thận nặng, tiền sử chảy máu bất thường.",
  "SSRI/SNRI: tăng nguy cơ chảy máu khi dùng cùng aspirin; không ngừng thường quy; nguy cơ cao: giảm dần bắt đầu từ vài tuần trước (chu kỳ bán hủy dài, quy tắc 5 chu kỳ), dùng lại sớm (~1 ngày). Thảo dược: tỏi, ginkgo biloba ngừng; người dùng warfarin cũng dùng đương quy, đan sâm, nhân sâm Panax: ngừng.",
  "Nhiễm trùng: yếu tố nguy cơ – hút thuốc, đái tháo đường, ung thư, suy giảm miễn dịch, tuổi, thừa cân; nhiễm trùng vị trí mổ cao hơn ở mổ mở so với MIS. Kháng sinh: cefazolin trước rạch da (cả MIS và mở), tiêu chuẩn chăm sóc; Anderson: phổ rộng bao phủ tụ cầu vàng (cephalosporin), dị ứng beta-lactam → clindamycin, tránh vancomycin (kháng thuốc; hiệu quả nếu MRSA dương); tiêm trong 30 phút trước mổ (so với 30–60 phút) giảm nhiễm trùng vị trí mổ; làm ấm trước mổ có thể giảm; đường sau có thể ít biến chứng quanh mổ.",
  "Đặt kỳ vọng: tổng quan 2015 – hài lòng xuất sắc 84% (MIS) vs 54% (mở); biến cố: gãy xương, tụ máu mông, viêm mô tế bào, huyết khối tĩnh mạch sâu, đau mặt khớp, té ngã, đau háng, đau dải chậu chày, đau chân, u mỡ sẹo, đau thắt lưng, tràn khí màng phổi, thuyên tắc phổi, lỏng vít; biến cố chung 18% (MIS) vs 21% (mở)."

{ id:19, t:"Chương 19 · Hàn khớp cùng–chậu từ bên (Lateral fusion)", yt:"", min:45,
 pts:[
  "Bối cảnh: thị trường hàn SIJ xâm lấn tối thiểu (MIS) dự kiến 450 triệu USD cuối 2025; 2017 Mỹ + châu Âu chiếm 85%; trước 2008 hàn cố định còn hiếm. Smith-Petersen 1921 (đường mở sau–bên xuyên chậu; mất máu, bóc tách mô, hồi phục dài, đau). 2008: Wise và Dall (qua da từ sau), Al-Khayer (qua da từ bên); FDA cấp 510(k) cho iFuse (SI-BONE). 2012: 85% ca hàn là MIS. Nay >25 hệ thống được FDA duyệt, ≥14 cho đường bên; SIJ gây đau lưng kháng trị ở đến 30%.",
  "Đường hàn: MIS bên, MIS sau (một số hệ thống phối hợp); đường mở sau và Smith-Petersen vẫn dùng khi không làm được MIS; đang phát triển đường chếch bên và mini-mở + MIS.",
  "Implant – 4 đặc điểm chung: (1) thân rỗng luồn qua dây dẫn (một số vít tự ren, không cần khoan lỗ mồi); (2) khe/lỗ (fenestration) để nhồi ghép xương tự thân, đồng loại hoặc tổng hợp (hydroxyapatite, canxi sulfat, canxi phosphat); Entasis vừa tạo vừa đặt xương tự thân; lỗ cho xương mọc vào/xuyên qua; (3) xử lý bề mặt vi–nano giống xương bản địa; (4) phủ hydroxyapatite hoặc vật liệu dẫn xương khác. Chất liệu: hợp kim titan; in 3D (titan xốp); 2017 FDA duyệt implant SIJ in titan đầu tiên: iFuse-3D.",
  "Huỳnh quang – chuẩn bị: mê toàn thân (có thể MAC); nằm sấp trên bàn xuyên tia (Jackson + khung Wilson); IONM: điện cực cơ chày trước (L5), cơ bụng chân (S1), cơ thắt hậu môn (S2); C-arm chụp lateral, inlet, outlet, AP thật (vuông góc đường SIJ sau); lateral thật khi các khuyết và cánh xương cùng thẳng hàng.",
  "Huỳnh quang – đặt dây dẫn: đánh dấu da trên cánh xương cùng và đường SIJ sau đến chỗ hội tụ (mép rostrodorsal); rạch ~3 cm ở/ngay sau đường xương cùng sau và ngay đuôi đường cánh xương cùng; dây dẫn có đầu ở mép sau khớp xương cùng khi chạm xương chậu; trên AP thật, đóng dây dẫn xuyên SIJ vào xương cùng bằng búa, hướng cuống S1, dừng ở phía NGOÀI lỗ thần kinh.",
  "Nong–đo–khoan–bắt vít: ống nong tăng dần đường kính, sát xương chậu; thước đo độ sâu → chiều dài vít; mũi khoan rỗng khoan lỗ mồi đến ngay sau vỏ xương hai bên khớp; vít rỗng (có thể nhồi ghép xương) vặn thuận chiều kim đồng hồ đến khi mũ vít phẳng với xương; kiểm tra huỳnh quang; tháo tua vít, giữ dây dẫn. Vít 2 và 3: dụng cụ căn thẳng trượt qua dây dẫn đầu để đặt dây dẫn thứ hai về phía đuôi; 2–3 vít cách đều, song song; mổ ~1 giờ.",
  "Lợi ích MIS so với mổ mở: ít mất máu, ít bóc tách mô mềm, vết rạch nhỏ, nằm viện ngắn, ít đau, hồi phục nhanh.",
  "Navigation (excelsiusGPS, NAV3i/Stryker, StealthStation; iFuse-Navigation): chồng dụng cụ lên CT trong mổ (O-arm, Airo); mê toàn thân; nằm sấp; IONM; camera ở cuối bàn; sờ PSIS; chốt cản quang đóng qua SIJ; gắn khung với cầu phản quang; CT, scout AP/bên; bác sĩ gây mê tạm ngưng thở để giảm nhiễu chuyển động; đầu dò phẳng xác định đường rạch và implant phía đầu; ống dẫn khoan; dây dẫn; dụng cụ tách tù + ống bảo vệ mô mềm; khoan rỗng ở xương chậu bên; broach đóng vào xương cùng; implant (bắt vít hoặc đóng bằng impactor); 2–3 implant, implant phía đuôi nhắm vào thân S2.",
  "Mổ mở (Smith-Petersen cải tiến, xuyên chậu, tránh phức hợp dây chằng sau): mê toàn thân, nằm sấp; CT trước mổ; rạch cong 8–10 cm dọc mào chậu; bóc tách dưới màng xương; độ dày xương chậu 15–20 mm; vít xốp ở hai đầu SIJ hoặc nẹp + vít; cửa sổ hình chữ nhật qua xương chậu lấy khối nguyên; nạo sụn và xương dưới sụn; ghép xương tự thân từ PSIS; ấn chìm khối; nẹp + vít; dẫn lưu dưới da; chạm ngón chân 6–12 tuần.",
  "An toàn: MIS bên an toàn hơn mổ mở (ít biến chứng, ít không liền); mổ mở: mất máu, giả khớp, nhiễm trùng sâu, phần cứng đau; MIS: nguy cơ chèn ép rễ thần kinh cùng → ở phía ngoài lỗ thần kinh, hình ảnh và IONM. Schoell 2016: 16,4% biến chứng + bệnh lý thắt lưng mới ở 6 tháng (nam 9,1%, nữ 3,3%); Duhon 2013 (iFuse, 94 người): 52 biến cố ở 34 người, đa số không cấp cứu, 6 nặng, 2 liên quan thủ thuật; Ledonio 2014: mổ mở mất máu nhiều hơn, mổ dài hơn, nằm viện dài hơn; Shamrock 2019 (14 nghiên cứu): biến chứng 11,1%, nhiễm trùng/chảy dịch 17/819 (2%), 3% liên quan implant, chèn ép rễ 13/819 (1,6%).",
  "Hiệu quả: Smith 2013 (MIS vs mở): VAS 24 tháng −5,6 vs −2,0; mất máu 33 vs 288 mL; mổ 70 vs 163 phút; nằm viện 1,3 vs 5,1 ngày; tháo implant 44% (mở, đau ở vít) vs 3,5% (MIS, đặt lại do chèn ép rễ). Rudolf 2012: −4,3 (12 tháng), hài lòng 82%; 5 năm −5,9, 82%; Sachs 2012 −6,2; Cummings 2013 −6,6; Duhon 2016 −5,4 (2 năm); Patel 2019 VAS −5,1, ODI −23,6 (6 tháng); Kube 2016: lưng 81,7 → 44,1, chân 63,6 → 27,7; Rappoport 2017: VAS lưng 55,8 → 32,7 mm, chân 40,6 → 12,5 mm; Whang 2019 (5 năm): VAS −54/100, ODI −26; Heiney 2015: mổ 59 phút, mất máu 36,9 mL, nằm viện 1,7 ngày, ODI −31 (12 tháng), VAS −6,1 (24 tháng); Shamrock: VAS −5,3, ODI −28,0; Martin 2020: VAS 80,3 → 32,2, ODI 56,2 → 34,4.",
  "Hàn liền: 25–90% khi báo cáo; mổ mở giả khớp 41,2%; Smith 2013: giả khớp, lỏng vít, kích ứng implant là lý do mổ lại ở 43% mổ mở, MIS không có; Buchowski 2005: Smith-Petersen cải tiến + nẹp T/L và vít + 12 tuần không chịu lực: 85% hàn chắc; Whang 2019: 88% hàn trên CT ở 5 năm.",
  "Hạn chế: đa số bằng chứng hồi cứu; đa số nghiên cứu dùng iFuse; cần nghiên cứu tiến cứu mức 1 và hệ thống khác. Khớp lân cận: chưa có bằng chứng đáng kể; Lindsey 2015 (mô hình phần tử hữu hạn): ít thay đổi tầm vận động thắt lưng; Joukar 2019: không đổi áp lực khớp háng."

SIJ.push(
{ id:20, t:"Chương 20 · Hàn khớp cùng–chậu từ sau (Posterior fusion)", yt:"", min:40,
 pts:[
  "Bối cảnh: rối loạn chức năng SIJ ước tính đến 62% ở một số nhóm bệnh nhân đau thắt lưng; hàn SIJ MIS đã thành lựa chọn chủ đạo; >25 hệ thống FDA duyệt, số hệ thống thiết kế cho đường sau ngày càng tăng. Mổ mở mô tả từ những năm 1920: nhiều biến chứng, hồi phục dài, kết quả kém → ít được áp dụng.",
  "Mốc lịch sử: 2008 Wise và Dall (đường sau qua da) và Al-Khayer (đường bên qua da); đến 2012, 85% ca hàn là MIS; 2012 loạt ca hồi cứu dùng hai chốt allograft sợi qua đường sau MIS: gần 90% ổn định khớp trên hình ảnh và giảm đau có ý nghĩa → kỹ thuật ghép allograft đường sau khả thi.",
  "Các đường hàn: MIS bên, MIS sau, kết hợp; mổ mở sau và Smith-Petersen sau–bên xuyên chậu dùng khi không làm được MIS. Chương mô tả 3 kỹ thuật đường sau: LinQ (PainTEQ, một mảnh ghép), CornerLoc (hai mảnh ghép), implant trụ có ren (CTI) đặt bằng đường sau chếch bảo tồn cơ với định vị lập thể.",
  "Hộp 20.1 – 11 hệ thống đặt từ sau được FDA duyệt: LinQ (PainTEQ), CornerLoc, Rialto (Medtronic), PsiF (Omnia), SI-DESIS (SI Technology), Catamaran (SpineSource), SiJoin (VGI), TransFasten (Captiva), SiCure (Alevio), Sacrix Sacrofuse (KIC), DIANA (Signus). Bảng 20.1: LinQ – allograft, cửa sổ ghép lớn, không khoan, một implant, dễ đặt, dụng cụ dễ dùng, dữ liệu SECURE; PsiF – allograft, dễ đặt, registry; CornerLoc – allograft, dễ đặt, COVI; Rialto – cửa sổ ghép lớn, loạt ca.",
  "Chuẩn bị chung: mê toàn thân (hoặc MAC); nằm sấp trên bàn thấu quang (mặt phẳng hoặc Jackson); đệm gel/cuộn chăn 6–8 inch dưới rốn nâng thắt lưng khỏi ưỡn, làm phẳng khung chậu, háng gấp 15–20°; nguy cơ thần kinh thấp nhưng có thể IONM: cơ chày trước (L5), cơ bụng chân (S1), cơ thắt hậu môn (S2).",
  "Một mảnh ghép (LinQ) – hình chiếu: để lộ hông bên mổ, SIJ ở giữa màn hình; xác định xương cùng, xương chậu, PSIS, AJL, PJL; xoay C-arm chếch về phía đối bên đến khi PJL và AJL chồng khít (thường 10–35°) – các đường vỏ trong/ngoài xương chậu sắc nét; hình bên thật (bờ vỏ sau xương cùng sắc nét), nghiêng bàn/lắc C-arm để hai khuyết ngồi thẳng hàng, vừa thấy lỗ S1.",
  "Kim dẫn: điểm vào ở giữa khớp, ngay phía trong thành vỏ trong xương chậu, gần lỗ S1; rạch da nhỏ; kim song song chùm tia; đích là 1/3 giữa khớp; hướng từ trên xuống dưới để quỹ đạo vuông góc (xác nhận trên hình bên); vùng đích tối ưu dưới PSIS gần lỗ S1; góc gần vuông góc với đường sau xương cùng (quá nông → ngạnh trên không bám khớp). Xoay hình bên: mũi kim phải vượt PCL (đường vỏ sau xương cùng) – nếu chưa thì chưa trong khớp; gõ nhẹ để kim bám chắc.",
  "Rạch da và ống nong: đường rạch đủ rộng cho ống nong ngoài (kẻ từ ngạnh đến ngạnh); dao số 10 dọc hai bên kim xuống tới khớp để dọn gân, dây chằng (dây chằng có thể cản ống nong); đưa ống nong trong và ngoài riêng rẽ rồi lồng vào nhau (kiểu ổ khóa: thanh dẫn trượt vào rãnh định hướng); gõ búa đẩy theo kim, theo dõi hình bên, dừng khi ngạnh chạm PCL.",
  "Kiểm tra ngạnh: về hình chếch ban đầu; nghiêng C-arm hướng đầu thấy ngạnh trên phải ngay phía trong thành vỏ trong xương chậu; nghiêng hướng đuôi thấy ngạnh dưới thẳng với đường khớp sau; nếu chưa đúng thì xoay ống nong; rồi về hình bên, gõ đến khi điểm dừng của ống ngoài chạm PCL; rút ống trong → ống ngoài thành kênh làm việc.",
  "Hình nòng súng (barrel shot): hình AP đầu tiên thường thấy kênh chếch trên xuống dưới; nghiêng hướng đầu đến khi kênh ở 9 giờ–3 giờ; giữ kênh ở giữa màn hình; chùm tia đồng trục với kênh: khớp phải hiện giữa kênh; nếu không thấy khớp có thể chưa vào khớp → làm lại (hiếm khi đã trong khớp mà không thấy – kiểm tra hướng kênh); nếu hướng đúng và vào khớp với ít gõ búa → tiếp tục.",
  "Bóc vỏ và đặt implant: dụng cụ bóc vỏ khớp (decorticator) vào kênh, thanh dẫn–rãnh thẳng hàng, gõ đến khi tay cầm chạm kênh hoặc mũi tới đường vỏ trước xương cùng → tạo ổ; vặn tay cầm ngược chiều kim đồng hồ thành búa trượt để rút. Implant xương vỏ vào inserter, lấp đầy cửa sổ bằng DBM, DBM thừa quanh gờ; trượt inserter vào kênh, gõ đến khi ngồi hẳn; rút inserter và kênh; đúng vị trí = giữa xương chậu và xương cùng ở phần sau khớp.",
  "Hai mảnh ghép (CornerLoc): C-arm chụp AP thật rồi chếch 15–20° từ trong ra ngoài đến khi thấy rõ đường khớp; kim Steinmann làm vật cản quang đánh dấu da; kẻ đường 3 cm từ trong ra ngoài ở đỉnh đầu và đỉnh đuôi; đường vào 2 cm cách điểm trên 1 cm trong + 1 cm hướng đầu, và điểm cách điểm dưới 0,5–1 cm trong + 1 cm hướng đuôi. Kim trên: ngay ngoài khớp mấu L5–S1, đi xuống theo quỹ đạo khớp; kim dưới: ngay đuôi chỗ lồi PSIS, đi lên; đẩy 1,5–2 cm; hình bên: hai kim cắt nhau 70–90°; giữ C-arm ở hình bên khi dùng dụng cụ.",
  "CornerLoc – dụng cụ: kim Steinmann 2,4 mm × 9 inch; dụng cụ tìm (finder) với tay cầm chữ T (mặt vát dài hướng xương chậu, bậc dừng ngắn hướng xương cùng; không trượt kim vào từ bên); ống dẫn kéo mô (retraction guide tube) đưa vào khớp, gõ bằng ống búa đến khi bậc dừng chạm xương cùng, rút finder và kim; mũi khoan quay thuận, cắt ở đầu và hai bên, khoan đến chốt chặn, nhả cò khi rãnh ló ra → kênh tròn dọc bờ trong PSIS; dụng cụ nạo vuông (broach) khớp chốt định hướng–rãnh khóa (mật độ xương thấp có thể nạo nông hơn), rút bằng búa trượt; miếng bọt DBM (sách ghi 9 mm³, nghi lỗi in) + mảnh xương vỏ 8 × 8 × 20,6 mm; rút dụng cụ, cầm máu, đóng vết mổ.",
  "Implant trụ có ren + định vị lập thể (hình do Medtronic): rạch nhỏ trên PSIS đối bên, khung tham chiếu qua da cho StealthStation; O-arm 3D; bóc vỏ SIJ cùng bên bằng taro lớn để ghép allograft; định vị điểm vào và quỹ đạo hai CTI qua SIJ; hai rạch nhỏ, lỗ dẫn theo định vị, đặt hai CTI chứa allograft, tránh thủng lỗ cùng; O-arm 3D xác nhận. Huỳnh quang: nằm sấp bàn Jackson; C-arm 30° hướng đầu (vuông góc độ nghiêng xương cùng) thấy lỗ S1; quỹ đạo hướng vào hoặc thấp hơn mỏm nhô; chếch 25–30° (bờ trước/sau khớp chồng nhau; thấy bờ ngoài PSIS = nơi rạch da); cửa vào (inlet) 25–30° hướng đuôi (vòng chậu tròn, tránh phạm bờ trước vòng chậu); xác nhận cuối trên 3 hình: bên, inlet, outlet – nghi dây dẫn tiến thêm thì dừng và kiểm tra cả ba.",
  "An toàn: MIS sau có hồ sơ an toàn tốt hơn mổ mở và MIS bên (mổ mở: mất máu, giả khớp, nhiễm trùng sâu, đau phần cứng); đa trung tâm và Ledonio: MIS ít mất máu, mổ ngắn, nằm viện ngắn; MIS bên có nguy cơ tổn thương cơ mông hoặc chèn rễ cùng → ở phía ngoài lỗ cùng, dùng hình ảnh và IONM; đường sau tiếp cận đơn giản, không xuyên cơ mông, ít tụ máu/tổn thương thần kinh, mổ ngắn, không hạn chế chịu lực (nhận định tác giả); báo cáo ‘không biến cố nghiêm trọng’ của đường sau từ tóm tắt hội nghị, loạt 10 ca.",

  "Hàn liền và iFuse: Fuchs 2018 (Đức; sách ghi 115 ca): chỉ 31,3% hàn liền rõ ràng trên CT ở >6 tháng, nhưng không tương quan với lâm sàng (hàn liền chậm vẫn vững; theo tài liệu tham khảo là hàn giãn khớp). SIFI (Duhon 2016): 172 bệnh nhân, 138 đạt tiêu chí thành công gộp. INSITE: 6 tháng 81,5% vs 23,9% (Whang); Polly: 82% vs <10%; Darr 3 năm: 86% hiệu quả chính, hài lòng 96%. Đường sau: bằng chứng trực tiếp tối thiểu; SECURE (LinQ; một nhánh, đa trung tâm, 12 tháng, 150 bệnh nhân; VAS, ODI, PROMIS-29); CornerLoc: RCT mở bắt chéo so với tiêm steroid, kết cục chính ≥50% giảm đau ở 6 tháng.",

  "Bối cảnh: hàn mở = đường trước hoặc sau + lấy xương ghép + nẹp thường 3 vít; MIS bên = thường 3 thanh implant tam giác phun plasma (iFuse); MIS sau = cage/vít hoặc mảnh allograft nhỏ qua da (LinQ). Lợi ích nổi bật của MIS: hồi phục ngắn hơn rất nhiều; mổ ngắn, ít mất máu, nằm viện ngắn → ít biến chứng.",
  "Tập đi sau hàn mở: vận động sớm để phòng DVT/PE; toe-touch 6 tuần → tập hồ bơi 4 tuần (tăng dần chịu lực) → vật lý trị liệu cạn 8 tuần (tăng cường cơ lõi).",
  "Tập đi sau MIS (chưa có hướng dẫn chính thức): giới hạn chịu lực 0–6 và 6–12 tuần vì xương cần tối thiểu 6 tuần để hàn; quyết định theo từng ca (loãng xương, béo phì, kỹ thuật). Đường sau có phần cứng (cage): tránh hoạt động đè SIJ, không nâng > 10 pound (≈ 4,5 kg), hạn chế cúi eo, tránh đứng chịu lực lâu trên chân bên mổ; đai cùng (sacral belt) 3 tháng; CT ở mốc 6 tháng; nếu ổn → hoạt động đầy đủ.",
  "Hàn bên với implant tam giác: ‘ngoài khớp’ (out of joint) – độ vững kém → walker hoặc gậy 6 tuần, toe-touch; ‘trong khớp’ (in joint) – vững hơn → dụng cụ hỗ trợ 3 tuần đầu, chịu đến 20 pound (≈ 9 kg), sau đó bỏ nếu sức/thăng bằng cho phép; béo phì → walker hoặc nạng suốt 6 tuần, không quá 20 pound; điều chỉnh theo loãng xương nặng hoặc thăng bằng kém (đột quỵ…).",
  "Hàn đường sau: đi không cần hỗ trợ từ ngày 1; tránh nâng > 8 pound (≈ 3,6 kg), cúi hoặc xoay eo; được lên xuống cầu thang nhưng bám tay vịn (ngã có hại). Đi bộ khoảng 1 dặm trong 1–2 tháng đầu; trở lại làm việc trung bình 47 ngày (lao động nặng ~2 tháng); với allograft qua da chỉ hạn chế hoạt động tải cao lên SIJ → có thể đi làm trong vài ngày nếu việc không nặng.",
  "Vật lý trị liệu: nhóm cơ cần hồi phục là cơ duỗi và dạng háng (mông lớn, nhỡ, bé); 3 tuần đầu 2 lần/tuần, vận động thụ động, tránh gấp háng tối đa và khép háng; sau đó tăng sức cản (nâng đến 10 pound ≈ 4,5 kg, bỏ giới hạn thời gian đi bộ); trước mổ bên đau yếu, bên đối diện gánh bù → mất đối xứng, cần tập lại sức, đối xứng và thăng bằng.",
  "Nhiễm trùng: Martin (gộp nghiên cứu mức IV, implant tam giác): 6/361 = 1,6%; Shamrock: 17/819 = 2,0%, chiếm ≈ 11% mọi biến chứng (nhiều nhất); NASS: nhiễm trùng vết mổ cột sống dù có kháng sinh dự phòng 0,7–10%. MIS (rạch ngắn, mổ ngắn, ít tổn thương mô) nhiều khả năng ít nhiễm trùng hơn mổ mở.",
  "Kháng sinh: NASS – tĩnh mạch 30 phút trước rạch da, nhắc lại mỗi 3 giờ nếu cần sau mổ cột sống không biến chứng (cần đối chiếu hướng dẫn gốc). Kakimaru (hồi cứu, 284 bệnh nhân): chỉ trong mổ 1,4% (2/143) so với thêm sau mổ (TB 2,7 ngày) 2,8% (4/141) → kháng sinh sau mổ không giảm nhiễm trùng, không cần thiết (dữ liệu cột sống, chưa riêng SIJ).",
  "Chăm sóc vết mổ: Steri-Strips ± ghim da; giữ Steri-Strips đến ngày 7–10 rồi bóc; ghim tháo tại phòng khám; giữ khô 48 giờ đầu; không ngâm nước 1 tháng; tắm vòi sen được nhưng không chà lên vết rạch; theo dõi chảy dịch, đỏ, sưng, sốt > 101°F (38,3°C).",
  "Mất máu: MIS có cage thường < 100 mL; ghép xương qua da thường < 20 mL → thường không cần định nhóm máu/phản ứng chéo; tụ máu khu trú hoặc bầm tím ở bệnh nhân yếu/gầy → theo dõi bảo tồn.",
  "Nằm viện: mổ mở thường nhập viện 2–5 ngày (đa số > 3 ngày); MIS có phần cứng lớn 1–4 ngày (đa số ~2 ngày).",
  "Giảm đau và liền xương: NSAID phổ biến (ketorolac ở phòng hồi tỉnh; ibuprofen, naproxen, meloxicam, diclofenac sau xuất viện; COX chọn lọc nếu bệnh dạ dày). Sivaganesan 2017: không có bằng chứng mức I về ảnh hưởng lên hàn liền; hầu hết nghiên cứu người sau 2005: NSAID < 2 tuần không giảm hàn liền; < 48 giờ không giảm theo liều; dùng mạn nên giảm/ngưng quanh mổ nếu có thể nhưng không chống chỉ định; thiếu NSAID có thể tăng opioid → liều thấp, ngắn ngày có thể có lợi; steroid kéo dài không nên, liều đơn dự phòng buồn nôn không ảnh hưởng liền xương.",
  "Biến chứng: hiếm; gặp nhiều nhất ở mổ mở hoặc MIS với phần cứng đáng kể; vài báo cáo thuyên tắc phổi sau mổ; thỉnh thoảng mòn do phần cứng hoặc kích thích rễ thần kinh; chưa có PE sau MIS ghép xương qua da (hợp lý: DVT/PE liên quan nằm bất động lâu với đường mổ xâm lấn nhiều hơn).",
  "Điểm đau và theo dõi: Smith (mở n = 149 vs MIS tam giác): 12 tháng VAS giảm 2,7 vs 6,2; theo dõi 96 bệnh nhân giảm 2 vs 5,6. Ledonio (22 mở, 17 MIS): ODI trung vị 64 → 46 (mở), 53 → 13 (MIS) (sách ghi chênh 9 điểm – không khớp phép trừ trung vị). Fuchs và Ruhl (171 bệnh nhân, 20 bệnh viện, cage DIANA hàn giãn): ODI 51 → 33, VAS 74 → 37. Duhon 24 tháng (172 bệnh nhân): đau SIJ 79,8 → 26,0, ODI 55,2 → 30,9.",
  "Phân tích gộp (Martin 2020; Hình 21.1–21.3, OpenMeta, DerSimonian–Laird, hiệu ứng ngẫu nhiên): VAS 80,3 (KTC 78,0–82,6) → 32,2 (KTC 27,4–36,9) – 18 nghiên cứu; ODI 56,2 (KTC 54,8–57,6) → 34,4 (KTC 30,7–38,1) – 10 nghiên cứu; đa số là loạt ca không đối chứng.",
 ],
 cards:[
  ["Hàn mở gồm những bước gì?","Đường trước hoặc sau, lấy xương ghép và nẹp thường bắt 3 vít.","SIJ"],
  ["MIS bên điển hình dùng gì?","Thường 3 thanh implant tam giác phun plasma cho xương mọc vào (iFuse).","SIJ"],
  ["MIS đường sau có thể dùng gì?","Phần cứng như cage hoặc vít, hoặc mảnh allograft nhỏ đặt qua da (LinQ).","SIJ"],
  ["Lợi ích nổi bật nhất của MIS so với mổ mở sau mổ?","Thời gian hồi phục ngắn hơn rất nhiều (mổ ngắn, ít mất máu, nằm viện ngắn → ít biến chứng).","SIJ"],
  ["Vì sao khuyến khích vận động sớm sau mổ?","Phòng huyết khối tĩnh mạch sâu và thuyên tắc phổi.","SIJ"],
  ["Tập đi sau hàn mở?","Toe-touch 6 tuần → hồ bơi 4 tuần → vật lý trị liệu cạn 8 tuần.","SIJ"],
  ["Vì sao MIS có giới hạn chịu lực 0–6 và 6–12 tuần?","Xương cần tối thiểu 6 tuần để hàn; quyết định theo từng ca (loãng xương, béo phì, kỹ thuật).","SIJ"],
  ["Khuyến cáo sau đường sau có phần cứng (cage)?","Tránh hoạt động đè SIJ; không nâng > 10 pound; hạn chế cúi eo; tránh đứng chịu lực lâu trên chân bên mổ.","SIJ"],
  ["Đai cùng (sacral belt) mang bao lâu và CT khi nào?","Đai cùng 3 tháng; CT ở mốc 6 tháng; nếu ổn → hoạt động đầy đủ.","SIJ"],
  ["Implant tam giác ‘ngoài khớp’ so với ‘trong khớp’?","Ngoài khớp kém vững hơn → walker/gậy 6 tuần, toe-touch; trong khớp vững hơn → hỗ trợ 3 tuần, chịu đến 20 pound.","SIJ"],
  ["Hàn bên ở bệnh nhân béo phì?","Walker hoặc nạng suốt 6 tuần, không chịu quá 20 pound (≈ 9 kg).","SIJ"],
  ["Khi nào phải điều chỉnh hướng dẫn tập đi?","Loãng xương nặng hoặc thăng bằng kém do bệnh khác như đột quỵ.","SIJ"],
  ["Tập đi sau hàn đường sau?","Đi không cần hỗ trợ từ ngày 1; tránh nâng > 8 pound, cúi hoặc xoay eo; lên xuống cầu thang bám tay vịn.","SIJ"],
  ["Vì sao phải bám tay vịn khi lên xuống cầu thang?","Ngã sẽ rất bất lợi cho hồi phục.","SIJ"],
  ["Nhóm cơ cần hồi phục sau hàn SIJ?","Cơ duỗi và dạng háng: mông lớn, mông nhỡ, mông bé.","SIJ"],
  ["Vật lý trị liệu 3 tuần đầu?","2 lần/tuần, vận động thụ động; tránh gấp háng tối đa và khép háng.","SIJ"],
  ["Vì sao cần tập lại đối xứng cơ sau mổ?","Trước mổ bên đau yếu, bên đối diện gánh bù → mất đối xứng.","SIJ"],
  ["Đi bộ và trở lại làm việc sau đường sau?","Đi ~1 dặm trong 1–2 tháng; trở lại làm việc TB 47 ngày (lao động nặng ~2 tháng).","SIJ"],
  ["Trở lại làm việc sau allograft qua da?","Chỉ hạn chế hoạt động tải cao lên SIJ → có thể đi làm trong vài ngày nếu việc không nặng.","SIJ"],
  ["Nhiễm trùng trong Martin (implant tam giác)?","6/361 = 1,6%.","SIJ"],
  ["Nhiễm trùng trong Shamrock?","17/819 = 2,0%; chiếm ≈ 11% mọi biến chứng, nhiều nhất trong các nhóm.","SIJ"],
  ["Nhiễm trùng vết mổ cột sống theo NASS dù có kháng sinh dự phòng?","0,7–10%.","SIJ"],
  ["Hướng dẫn kháng sinh NASS?","Tĩnh mạch 30 phút trước rạch da; nhắc lại mỗi 3 giờ nếu cần (cần đối chiếu hướng dẫn gốc).","SIJ"],
  ["Nghiên cứu Kakimaru so sánh gì?","284 bệnh nhân: chỉ kháng sinh trong mổ 1,4% (2/143) vs thêm sau mổ 2,8% (4/141) → kháng sinh sau mổ không cần thiết.","SIJ"],
  ["Vì sao MIS có thể ít nhiễm trùng hơn?","Rạch ngắn hơn, mổ ngắn hơn, ít tổn thương mô.","SIJ"],
  ["Dán gì lên vết mổ và giữ bao lâu?","Steri-Strips (± ghim da), giữ đến ngày 7–10 rồi bóc; ghim tháo tại phòng khám.","SIJ"],
  ["Hướng dẫn nước cho vết mổ?","Giữ khô 48 giờ đầu; không ngâm nước 1 tháng; tắm vòi sen được nhưng không chà lên vết rạch.","SIJ"],
  ["Dấu hiệu bệnh nhân phải báo?","Chảy dịch, đỏ, sưng, sốt > 101°F (38,3°C).","SIJ"],
  ["Mất máu trong MIS?","Có cage < 100 mL; ghép xương qua da < 20 mL → thường không cần định nhóm máu/phản ứng chéo.","SIJ"],
  ["Tụ máu khu trú hoặc bầm tím xử trí?","Theo dõi bảo tồn, thường không cần can thiệp (gặp ở bệnh nhân yếu/gầy).","SIJ"],
  ["Thời gian nằm viện sau mổ mở và MIS có phần cứng?","Mở: 2–5 ngày (đa số > 3 ngày); MIS có phần cứng lớn: 1–4 ngày (đa số ~2 ngày).","SIJ"],
  ["NSAID thường dùng sau mổ SIJ?","Ketorolac ở phòng hồi tỉnh; ibuprofen, naproxen, meloxicam, diclofenac sau xuất viện; COX chọn lọc nếu bệnh dạ dày.","SIJ"],
  ["Bằng chứng NSAID và liền xương?","Không có mức I (Sivaganesan 2017); NSAID < 2 tuần không giảm hàn liền; < 48 giờ không giảm theo liều.","SIJ"],
  ["Người dùng NSAID mạn quanh mổ?","Nên giảm hoặc ngưng nếu có thể, nhưng không phải chống chỉ định.","SIJ"],
  ["Vì sao liều thấp, ngắn ngày NSAID có thể có lợi?","Thiếu NSAID có thể làm tăng dùng opioid.","SIJ"],
  ["Steroid sau mổ SIJ?","Không nên dùng kéo dài; liều đơn dự phòng buồn nôn–nôn không ảnh hưởng liền xương.","SIJ"],
  ["Biến chứng sau mổ thường gặp ở đâu?","Hiếm; nhiều nhất ở mổ mở hoặc MIS có phần cứng đáng kể (thuyên tắc phổi, mòn do phần cứng, kích thích rễ).","SIJ"],
  ["Vì sao chưa có PE sau MIS ghép xương qua da?","DVT/PE liên quan nằm bất động lâu ở đường mổ xâm lấn nhiều hơn.","SIJ"],
  ["Smith: VAS giảm sau 12 tháng?","Mở (n = 149) giảm 2,7; MIS giảm 6,2; theo dõi 96 bệnh nhân: 2 vs 5,6.","SIJ"],
  ["Ledonio: ODI trung vị?","Mở 64 → 46; MIS 53 → 13 (22 mở, 17 MIS); sách ghi chênh 9 điểm – không khớp phép trừ trung vị.","SIJ"],
  ["Fuchs và Ruhl (cage DIANA)?","171 bệnh nhân, 20 bệnh viện, hàn giãn: ODI 51 → 33; VAS 74 → 37.","SIJ"],
  ["Duhon 24 tháng?","172 bệnh nhân: đau SIJ 79,8 → 26,0; ODI 55,2 → 30,9.","SIJ"],
  ["Tổng hợp VAS (Hình 21.1, 21.3)?","80,3 (KTC 78,0–82,6) → 32,2 (KTC 27,4–36,9); 18 nghiên cứu.","SIJ"],
  ["Tổng hợp ODI (Hình 21.2, 21.3)?","56,2 (KTC 54,8–57,6) → 34,4 (KTC 30,7–38,1); 10 nghiên cứu.","SIJ"],

 quiz:[

SIJ.push(
{ id:22, t:"Chương 22 · Biến chứng của hàn SIJ và cách xử trí (Complications)", yt:"", min:15,
 pts:[
  "Bối cảnh: đau thắt lưng mạn do SIJ ~15–30%; tỷ lệ thật khó xác định vì kiểu lan đau chồng lấp (thoát vị đĩa trong, thoái hóa khớp mấu, SIJ, sau hàn cột sống thắt lưng). Mổ mở: nhiễm trùng vết mổ, rạch dài, nằm viện lâu, lấy xương ghép, tổn thương thần kinh. Sách ghi MIS báo cáo lần đầu 2004 (các chương trước ghi 2008 – cần đối chiếu).",
  "Hạn chế y văn: đa số nghiên cứu MIS tập trung hiệu quả và hài lòng; rất ít nghiên cứu về an toàn, mẫu nhỏ, không đủ kết luận có ý nghĩa thống kê.",
  "Tỷ lệ biến chứng chung của MIS bên (thanh titan): 3,5–18%. Miller: 3,5–5,6% – thấp nhất nhưng có tài trợ ngành và báo cáo tự nguyện → thiên lệch. Hai biến chứng hay gặp: nhiễm trùng và tổn thương thần kinh–mạch máu.",
  "Đường sau: không có bó thần kinh–mạch máu lớn dọc phía sau SIJ → về lý thuyết an toàn hơn đường bên; nhưng chưa có nghiên cứu tiền cứu dài hạn về an toàn/hiệu quả, chỉ báo cáo ca và loạt ca.",
  "Nhiễm trùng – phòng ngừa trước mổ: nhiễm trùng hoạt động = không phải ứng viên; nghi ngờ → công thức máu có phân loại bạch cầu, tổng phân tích nước tiểu, tốc độ máu lắng; có thể hoãn mổ cấy implant đến khi xong kháng sinh và triệu chứng/xét nghiệm trở về bình thường; theo thực hành tốt nhất phòng nhiễm trùng vết mổ như các thủ thuật can thiệp cột sống–đau tiên tiến; có thể tham khảo khuyến cáo NACC (phòng và xử trí nhiễm trùng) khi chưa có hướng dẫn riêng.",
  "Nhiễm trùng sau mổ: Schoell – 4,1% trong 6 tháng (sách còn ghi 2,9% ở 6 tháng đầu và 4,9% ở 12 tháng – không khớp); MIS cột sống tương tự (cắt đĩa, mở lỗ liên hợp, giải ép, hàn) 1,1% → đường bên thanh titan cao hơn. Nhiễm trùng tiểu sau đường bên: 3,8% ở 90 ngày, 4,9% ở 6 tháng, nữ nhiều hơn nam.",
  "Thần kinh–mạch máu – phòng ngừa: chảy máu/tụ máu thường do chống đông và kháng tiểu cầu → theo hướng dẫn đồng thuận ‘Interventional Spine and Pain Procedures in Patients on Antiplatelet and Anticoagulant Medications (2nd edition)’ (ASRA, ESRA, AAPM, INS, NANS, WIP); đề xuất xếp MIS SIJ đường sau vào thủ thuật NGUY CƠ CAO theo ASRA (sách không nêu thời gian ngưng từng thuốc – xem hướng dẫn gốc).",
  "Hematoma và tổn thương thần kinh sau mổ: MIS ít biến chứng hơn mổ mở (mổ mở mất máu nhiều hơn, mổ dài hơn, nằm viện lâu hơn); đường bên thanh titan có nguy cơ thần kinh–mạch máu đáng kể vì bó nằm dọc bờ bên xương cùng: tổn thương thần kinh ~4,3% ở 90 ngày và 6,2% ở 6 tháng (Schoell).",
  "Đọc số liệu biến chứng: các con số khác nhau vì định nghĩa, thời gian theo dõi, thiết kế và nguồn tài trợ; báo cáo tự nguyện thường thấp hơn thực tế; nhiễm trùng 1,6% (Martin), 2,0% (Shamrock), 4,1% (Schoell) khác nguồn; nên nói khoảng dao động cho bệnh nhân.",
 ],
