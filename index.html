  "Hậu quả chức năng: đau ấn khớp/dây chằng, lệch tư thế, đau khi giao hợp, thay đổi bàng quang, dáng đi bất thường, ngồi lâu kém, đổi tư thế liên tục; hạn chế đi, leo cầu thang, xoay thân, đứng lâu.",
  "Sinh lý: stress mạn → kích hoạt lặp lại → đáp ứng cortisol giảm (giảm cortisol do stress) → rối loạn trí nhớ/chú ý, giấc ngủ, đau xơ cơ, mệt mỏi mạn, đau chậu mạn; viêm toàn thân tăng (loãng xương, viêm khớp dạng thấp, đau thắt lưng mạn).",
  "Tâm lý–xã hội (Hộp 4.2, Hình 4.1): mô hình sợ–né tránh; bi quan hóa (catastrophizing); mất kiểm soát, tự thấy tàn tật → bất lực, vô vọng, trầm cảm. Điều trị: liệu pháp nhận thức–hành vi + vật lý/hoạt động trị liệu (đối mặt); công nhận cơn đau, bệnh nhân có quyền quyết định.",
  "Gánh nặng: 83 triệu năm sống khỏe mất đi; 25,5 triệu người nghỉ trung bình 11,4 ngày (2012); 2,3% lượt khám ở Mỹ; >100 tỷ USD; >8.000 USD/người/năm. Opioid: LBP là nguyên nhân hàng đầu kê opioid; ~4 triệu lệ thuộc (2017); 68% tử vong quá liều; 75,8 tỷ USD/năm; 13,7% khám được kê 7 ngày; 27% bệnh nhân chưa dùng opioid được kê (Azad).",
  "Điều trị khuyến cáo: cấp/bán cấp – nóng/lạnh, VLTL, xoa bóp, châm cứu, nắn chỉnh + NSAID/giãn cơ. Mạn – đa mô thức (tập luyện, thân–tâm, tập kiểm soát vận động, biofeedback); tramadol hoặc duloxetine tuyến hai; ACP chỉ dùng opioid khi thất bại các biện pháp trên.",
  "Chất lượng sống đau SIJ kém hơn COPD, bệnh mạch vành, hen, suy tim nhẹ; giảm rõ hơn trượt đốt sống, hẹp ống sống, thoát vị đĩa đệm; tương tự thoái hóa háng/gối; ODI tương quan nghịch với chất lượng sống.",
  "Đánh giá tàn tật: Oswestry (tự chăm sóc, nâng, đi, ngồi, đứng, đi lại, xã hội, tình dục), WOMAC; ICIDH 1999 (4 mức: bệnh lý, tổn thương, tàn tật, thiệt thòi), ICF 2001 (3 phần), mô hình IOM. Xếp loại tại MMI để bồi thường; không hệ thống nào bồi thường đủ thu nhập."
 ],
 cards:[
  ["Định nghĩa tàn tật (disability)?","Mất chức năng do tổn thương hoặc thay đổi cấu trúc, giới hạn khả năng làm sinh hoạt hằng ngày (ADL) ở gia đình, công việc, cộng đồng.","SIJ"],
  ["Đau thắt lưng trên thế giới?","Hơn 1,7 tỷ người; nằm trong 3 nguyên nhân hàng đầu gây số năm sống chung với tàn tật (cùng đau đầu, trầm cảm).","SIJ"],
  ["Đau thắt lưng trọn đời và tàn tật?","84% người lớn sẽ đau thắt lưng; đến 12% trở nên tàn tật hoặc không thể làm việc có thu nhập.","SIJ"],
  ["Đau SIJ chiếm bao nhiêu trong đau thắt lưng trục?","14–22%; 32–42% sau hàn cột sống thắt lưng; 49% ở thai phụ.","SIJ"],
  ["Hiện mắc/hằng năm/cả đời của đau SIJ?","Hiện mắc 15–30%; hằng năm 20–60%; cả đời 60–70%.","SIJ"],
  ["Nữ giới có nguy cơ đau SIJ cao gấp mấy lần?","Gấp 3–4 lần (Hộp 4.1).","SIJ"],
  ["Kể 5 yếu tố nguy cơ đau SIJ.","Béo phì, thai kỳ, chấn thương, chênh lệch chiều dài chân, sau hàn cột sống, nghề văn phòng, ngồi lâu, dáng đi bất thường, viêm khớp do viêm...","SIJ"],
  ["Nghiên cứu Lee: đau SIJ mới sau hàn cột sống?","38/317 = 12,0%; hàn thắt lưng–cùng nhiều hơn; xuất hiện 6–48 tháng (trung bình 22); mới mắc 3,5% năm đầu.","SIJ"],
  ["Yếu tố làm đau thắt lưng kéo dài?","Đau nặng ngay từ đầu, trầm cảm, đau nhiều vị trí, từng đau trước đó, stress tâm lý; nhạy cảm hóa trung ương do viêm.","SIJ"],
  ["Vận động SIJ ở nam so với nữ?","Nam thiên về trượt, nữ thiên về xoay; sụn xương cùng dày hơn ở nữ; góc mu nam 50–80°, nữ 90–100°.","SIJ"],
  ["Xương cùng xoay so với xương chậu bao nhiêu độ?","Khoảng 6°; dây chằng cùng–chậu sau đảm nhiệm phần lớn.","SIJ"],
  ["Nguyên nhân tổn thương SIJ nào phổ biến hơn?","Ngoài khớp (chấn thương, gãy, dây chằng, đau cơ–cân) phổ biến hơn trong khớp.","SIJ"],
  ["Hậu quả thể chất của đau SIJ?","Đau ấn khớp/dây chằng, lệch tư thế, đau khi giao hợp, thay đổi bàng quang, dáng đi bất thường, ngồi lâu kém.","SIJ"],
  ["Giảm cortisol do stress gây hậu quả gì?","Rối loạn trí nhớ/chú ý, giấc ngủ; đau xơ cơ, mệt mỏi mạn, đau chậu mạn; viêm toàn thân tăng (loãng xương, viêm khớp dạng thấp, đau thắt lưng mạn).","SIJ"],
  ["Hai kiểu đáp ứng trong mô hình sợ–né tránh?","Né tránh vì sợ và bi quan hóa (catastrophizing).","SIJ"],
  ["Điều trị phá vòng đau–sợ–né tránh?","Liệu pháp nhận thức–hành vi + vật lý/hoạt động trị liệu (đối mặt); công nhận cơn đau; cho bệnh nhân quyền quyết định.","SIJ"],
  ["Gánh nặng kinh tế của đau thắt lưng ở Mỹ?","2,3% lượt khám; >100 tỷ USD; chi phí trực tiếp >8.000 USD/người/năm; 25,5 triệu người nghỉ TB 11,4 ngày (2012).","SIJ"],
  ["Opioid và đau thắt lưng?","LBP là nguyên nhân hàng đầu kê opioid; ~4 triệu lệ thuộc (2017); 68% tử vong quá liều; 75,8 tỷ USD/năm; 13,7% khám có toa 7 ngày; 27% bệnh nhân chưa dùng opioid được kê.","SIJ"],
  ["Điều trị đau thắt lưng mạn theo ACP?","Đa mô thức (tập luyện, thân–tâm, tập kiểm soát vận động, biofeedback); tramadol hoặc duloxetine tuyến hai; opioid chỉ khi thất bại.","SIJ"],
  ["So sánh chất lượng sống đau SIJ?","Kém hơn COPD, bệnh mạch vành, hen, suy tim nhẹ; giảm rõ hơn trượt đốt sống, hẹp ống sống, thoát vị đĩa đệm; tương tự thoái hóa háng/gối.","SIJ"],
  ["Oswestry (ODI) đánh giá gì?","Mức đau giới hạn tự chăm sóc, nâng, đi, ngồi, đứng, đi lại, xã hội, tình dục.","SIJ"],
  ["ICIDH 1999 có mấy mức?","4: bệnh lý, tổn thương cơ quan, tàn tật (giới hạn hoạt động), thiệt thòi (hạn chế xã hội). ICF 2001 có 3 phần: chức năng–cấu trúc, thực hiện hoạt động, tham gia hoạt động.","SIJ"],
  ["MMI là gì và dùng để làm gì?","Điểm cải thiện y khoa tối đa; dùng xếp loại mất chức năng và hạn chế khi quay lại làm việc để bồi thường; không hệ thống nào bồi thường đủ thu nhập.","SIJ"]
 ],
 quiz:[
  ["Đau SIJ là nguồn đau chính ở bao nhiêu % bệnh nhân đau thắt lưng trục?",["2–5%","14–22%","40–50%","Trên 70%"],1,"14–22%; 32–42% sau hàn cột sống; 49% ở thai phụ.","SIJ"],
  ["Tỷ lệ đau SIJ ở bệnh nhân từng hàn cột sống thắt lưng?",["5–10%","14–22%","32–42%","80–90%"],2,"32–42%; thai phụ 49%.","SIJ"],
  ["Nữ có nguy cơ đau SIJ cao gấp mấy lần nam?",["1–2 lần","3–4 lần","10 lần","Bằng nhau"],1,"Hộp 4.1: nữ nguy cơ cao gấp 3–4 lần.","SIJ"],
  ["Yếu tố nào KHÔNG thuộc Hộp 4.1?",["Béo phì","Chênh lệch chiều dài chân","Uống rượu","Ngồi lâu"],2,"Hộp 4.1: béo phì, thai kỳ, chấn thương, giải phẫu chuyển tiếp, chênh lệch chân, viêm khớp, dáng đi, hàn cột sống, nữ, nghề văn phòng, ngồi lâu.","SIJ"],
  ["Nghiên cứu Lee: tỷ lệ đau SIJ mới sau hàn cột sống?",["3,5%","12,0%","32%","49%"],1,"38/317 = 12,0%; mới mắc hằng năm 3,5% trong năm đầu.","SIJ"],
  ["Đau SIJ mới sau hàn cột sống xuất hiện sau bao lâu (trung bình)?",["2 tháng","6 tháng","22 tháng","5 năm"],2,"Dao động 6–48 tháng, trung bình 22 tháng.","SIJ"],
  ["Về giải phẫu, khớp ở nữ so với nam?",["Sụn xương cùng mỏng hơn","Khung chậu hẹp và cao hơn","Góc mu 90–100° (nam 50–80°)","Vận động thiên về trượt"],2,"Nữ: xoay, sụn xương cùng dày, khung chậu rộng–thấp, góc mu 90–100°.","SIJ"],
  ["Xương cùng xoay so với xương chậu tối đa khoảng?",["6°","30°","60°","90°"],0,"Chỉ khoảng 6°.","SIJ"],
  ["Nguyên nhân tổn thương SIJ phổ biến hơn?",["Trong khớp","Ngoài khớp","Bằng nhau","Chỉ nhiễm trùng"],1,"Ngoài khớp (chấn thương, gãy, dây chằng, đau cơ–cân) phổ biến hơn.","SIJ"],
  ["Hậu quả của rối loạn cortisol (giảm cortisol do stress)?",["Tăng cân đơn thuần","Giảm viêm hệ thống","Rối loạn giấc ngủ, nhận thức, đau xơ cơ; tăng viêm hệ thống","Hết đau"],2,"Cortisol chống viêm giảm → viêm toàn thân tăng.","SIJ"],
  ["Mô hình sợ–né tránh gồm hai đáp ứng?",["Sợ và tức giận","Né tránh và bi quan hóa","Lo âu và hưng cảm","Tập luyện và nghỉ"],1,"Né tránh vì sợ và catastrophizing.","SIJ"],
  ["Điều trị nhằm phá vòng đau–sợ–né tránh?",["Chỉ opioid","Nghỉ ngơi tuyệt đối","Liệu pháp nhận thức–hành vi + vật lý trị liệu/hoạt động trị liệu","Chỉ phẫu thuật"],2,"Dùng nguyên tắc đối mặt; công nhận cơn đau; cho bệnh nhân quyền kiểm soát.","SIJ"],
  ["Chi phí trực tiếp trung bình của đau thắt lưng ở Mỹ?",["Dưới 500 USD","Hơn 8.000 USD/người/năm","2 triệu USD","Không đáng kể"],1,"Tổng chi phí chăm sóc >100 tỷ USD; chi phí trực tiếp >8.000 USD/người/năm.","SIJ"],
  ["Ở Mỹ, đau thắt lưng là nguyên nhân hàng đầu của?",["Kê kháng sinh","Kê opioid","Phẫu thuật tim","Chụp MRI"],1,"LBP là nguyên nhân phổ biến nhất kê opioid.","SIJ"],
  ["Tỷ lệ tử vong do quá liều liên quan opioid (2017)?",["10%","30%","68%","95%"],2,"68% tử vong do quá liều thuốc liên quan opioid; ~4 triệu ca lệ thuộc.","SIJ"],
  ["Điều trị tuyến hai cho đau thắt lưng mạn theo ACP?",["Morphine","Tramadol hoặc duloxetine","Steroid uống dài ngày","Benzodiazepine"],1,"Opioid chỉ khi thất bại các biện pháp bảo tồn và các nhóm thuốc khác.","SIJ"],
  ["Chất lượng sống của đau SIJ so với các bệnh?",["Tốt hơn COPD","Tương tự cảm cúm","Kém hơn COPD, bệnh mạch vành, hen, suy tim nhẹ","Không so sánh được"],2,"Cũng giảm rõ hơn trượt đốt sống, hẹp ống sống, thoát vị đĩa đệm.","SIJ"],
  ["Thang nào đánh giá tàn tật do đau thắt lưng (tự chăm sóc, nâng, đi, ngồi, tình dục)?",["VAS","Oswestry (ODI)","Glasgow","Apgar"],1,"ODI; WOMAC đánh giá vận động chức năng và ADL.","SIJ"],
  ["ICIDH 1999 gồm các mức nào?",["Bệnh lý, tổn thương, tàn tật, thiệt thòi","Cấu trúc, chức năng, hoạt động","Cấp, bán cấp, mạn","Thể chất, tâm lý"],0,"ICF 2001 có 3 phần: chức năng–cấu trúc cơ thể, thực hiện hoạt động, tham gia hoạt động.","SIJ"],
  ["MMI trong xếp loại tàn tật là?",["Điểm cải thiện y khoa tối đa","Mức đau tối đa","Chỉ số khối cơ","Mức đáp ứng thuốc"],0,"Dùng để xếp loại mất chức năng và hạn chế khi quay lại làm việc.","SIJ"]
 ]},

{ id:5, t:"Chương 5 · Gây mê, gây tê cho thủ thuật khớp cùng–chậu", yt:"", min:40,
 pts:[
  "Mức gây mê theo thủ thuật (Bảng 5.4): tiêm chẩn đoán – KHÔNG gây tê (lidocaine 1%); tiêm điều trị, phong bế, đốt RFA – gây tê tại chỗ 3–5 mL lidocaine 1% ở da (thuốc tiêm bupivacaine/ropivacaine ± corticoid cho tiêm khớp); Simplicity – MAC; hàn xâm lấn tối thiểu – MAC / tê trục / mê toàn thân; hàn mổ mở – mê toàn thân.",
  "Lịch sử: cocaine (thế kỷ 19) chẹn kênh natri → 1905 procaine (dị ứng nặng) → 1946 lidocaine. Ether 30/3/1842 (Crawford Long); chloroform Simpson 1853. Hàn SIJ xâm lấn tối thiểu từ 2008. Phong bế nhắm L5 nhánh sau và nhánh ngoài S1–S3; phía sau do đám rối L5–S4 chi phối.",
  "Tiêm chẩn đoán không gây tê: đáp ứng dương xác nhận đau SIJ với độ đặc hiệu cao; giá trị tiên đoán dương 19–75%; gây tê kèm làm giảm độ nhạy; kim 22–25G. Chen 2019 (99 bệnh nhân, 306 mũi kim): nốt thuốc tê ở da lại đau hơn (p = 0,007). Ackerman 2004 (75 nam, 5 nhóm): tê cơ nông giảm đau nhiều hơn → dương tính giả.",
  "Thuốc xịt lạnh thay thế: Cochrane 2016 (9 nghiên cứu, 1.070 bệnh nhân) giảm đau 12,5 mm/100 mm khi xịt ngay trước đâm kim.",
  "Tiêm điều trị khớp: 2–3 mL thuốc tê + 1–2 mL steroid; lidocaine 1% 2–5 mL dưới da; thêm bicarbonate hoặc làm ấm giảm rát (làm ấm: 831 bệnh nhân/19 thử nghiệm giảm 11 mm; đệm: 5 mm). Phong bế: lidocaine da + bupivacaine/ropivacaine trên thần kinh (lidocaine gắn protein thấp → ngắn). RFA: 3–5 mL lidocaine 1% da; steroid sau đốt giảm viêm thần kinh.",
  "3 yếu tố thuốc tê: gắn lipid → độ mạnh (bupivacaine mạnh ~10× lidocaine); gắn protein → thời gian tác dụng; pKa → khởi phát (lidocaine pKa 7,9, ~25% không ion hóa → nhanh).",
  "Bảng 5.2: lidocaine khởi phát 45–90 giây, tác dụng 10–20 phút (liều đơn), gắn protein 60–80%, pKa 7,9; bupivacaine tác dụng 1,5–8 giờ, 95%, pKa 8,1, nửa đời 2,7 giờ; ropivacaine khởi phát 3–5 phút, 3–15 giờ, 94%, pKa 8,1, nửa đời 4,2 giờ.",
  "Liều tối đa (độc tính toàn thân): lidocaine 4,5 mg/kg (không epinephrine) ≤300 mg (30 mL lidocaine 1%); bupivacaine 2,5 mg/kg ≤175 mg/lần hoặc 400 mg/24 giờ; ropivacaine 3 mg/kg ≤225 mg. Bupivacaine 0,75% không dùng cho sản khoa. Epinephrine giảm hấp thu, giảm độc tính.",
  "Độc tính: thứ tự mất chức năng đau → nhiệt → xúc giác → bản thể → trương lực cơ. Kích thích TKTW (tê quanh miệng, ù tai, mờ mắt, co giật) trước ức chế (buồn ngủ, mất ý thức, ức chế hô hấp); tim mạch: tụt huyết áp, nhịp chậm, loạn nhịp, ngừng tim. Bupivacaine độc tim nhất (CC:CNS thấp nhất), rồi ropivacaine, rồi lidocaine.",
  "Xử trí LAST: ngừng thuốc, gọi hỗ trợ, tuần hoàn ngoài cơ thể; đường thở + oxy; cắt co giật bằng benzodiazepine (midazolam 1–2 mg), tránh propofol; nhũ tương lipid 20%: <70 kg bolus 1,5 mL/kg rồi 0,25 mL/kg/phút; >70 kg 100 mL rồi 200–250 mL/15–20 phút; lặp bolus 1–2 lần, tối đa ~12 mL/kg; truyền tiếp 10 phút sau khi ổn.",
  "MAC (ASA): an thần + giảm đau chuẩn độ, giữ thở tự nhiên và phản xạ đường thở; 10–30% phẫu thuật; dùng cho Simplicity và hàn xâm lấn tối thiểu. Theo dõi chuẩn ASA + capnography; oxy bổ sung khi an thần vừa/sâu. Biến chứng chính: tắc đường thở, ức chế hô hấp, hít sặc.",
  "Thuốc MAC: midazolam 0,5–2 mg (khởi phát 1–3 phút, 1–4 giờ; không giảm đau; flumazenil 0,2 mg/15 giây, lặp mỗi phút tối đa 1 mg); propofol ~20 mg bolus hoặc 25–75 mcg/kg/phút; fentanyl 25–50 mcg (30–60 phút), remifentanil (nửa đời 3 phút); dexmedetomidine 0,5–1,0 mcg/kg trong 10 phút, 0,2–1,0 mcg/kg/giờ – chậm, ít phù hợp; ketamine 0,25–0,5 mg/kg (20–30 phút).",
  "Tê trục: tủy sống tại L3–4 hoặc L4–5 (tủy tận cùng L1); kim đầu bút chì 24–27G giảm đau đầu sau chọc màng cứng; ngoài màng cứng không chọc màng cứng, truyền liên tục; CSE nhanh + kéo dài. Baricity: hyperbaric lên mức cao hơn; bupivacaine 6–15 mg (1–2 giờ), lidocaine 40–100 mg (45–75 phút), ropivacaine 15–20 mg (75–120 phút).",

 cards:[

  ["Vì sao không gây tê khi tiêm chẩn đoán SIJ?","Gây tê kèm làm giảm độ nhạy; tê cơ nông có thể gây dương tính giả (Ackerman 2004); thủ thuật dung nạp tốt với kim 22–25G.","SIJ"],
  ["Giá trị tiên đoán dương của tiêm chẩn đoán SIJ?","19–75% đối với đau nguồn gốc SIJ (ASA/ASRA).","SIJ"],
  ["Chen 2019 cho thấy gì?","99 bệnh nhân, 306 mũi kim phong bế nhánh giữa; kim 25G có nốt thuốc tê ở da đau hơn nhìn chung (p = 0,007).","SIJ"],

  ["Thời gian tác dụng bupivacaine và ropivacaine?","Bupivacaine 1,5–8 giờ; ropivacaine 3–15 giờ; lidocaine 10–20 phút (liều toàn thân đơn).","SIJ"],

  ["Liều nhũ tương lipid 20% trong LAST?","<70 kg: bolus 1,5 mL/kg rồi 0,25 mL/kg/phút; >70 kg: 100 mL rồi 200–250 mL trong 15–20 phút; lặp bolus 1–2 lần, tối đa ~12 mL/kg.","SIJ"],
  ["MAC là gì?","An thần và giảm đau chuẩn độ để thoải mái nhưng vẫn giữ thở tự nhiên và phản xạ đường thở; dùng ở 10–30% phẫu thuật.","SIJ"],
  ["Theo dõi trong MAC?","Chuẩn ASA (nhiệt độ, SpO2, huyết áp, nhịp tim, ECG) + capnography; oxy bổ sung khi an thần vừa/sâu.","SIJ"],
  ["Midazolam: liều, khởi phát, đảo ngược?","0,5–2 mg; khởi phát 1–3 phút; 1–4 giờ; không giảm đau; flumazenil 0,2 mg/15 giây (tối đa 1 mg), không đảo ngược ức chế hô hấp do opioid.","SIJ"],

  ["Vì sao dexmedetomidine ít phù hợp thủ thuật SIJ?","Khởi phát chậm (~15 phút), nửa đời kéo dài (4–250 phút), ảnh hưởng tim mạch.","SIJ"],

  ["Tê tủy sống ở mức nào, vì sao?","L3–4 hoặc L4–5 vì tủy sống tận cùng ở thân L1; kim đầu bút chì 24–27G giảm đau đầu sau chọc màng cứng.","SIJ"],
  ["Baricity?","Tỷ trọng dung dịch so với dịch não tủy; hyperbaric (thêm dextrose) lên mức tê cao hơn; hypobaric thêm nước cất.","SIJ"],
  ["Liều tê tủy sống bupivacaine/lidocaine/ropivacaine?","Bupivacaine 6–15 mg (1–2 giờ); lidocaine 40–100 mg (45–75 phút); ropivacaine 15–20 mg (75–120 phút).","SIJ"],
  ["4 giai đoạn gây mê?","1 giảm đau (tỉnh); 2 mê sảng; 3 mê phẫu thuật (không tự bảo vệ đường thở); 4 ức chế hành tủy (ngừng thở). Mục tiêu giai đoạn 3.","SIJ"],

{ id:7, t:"Chương 7 · Phong bế nhánh ngoài (Lateral branch blocks)", yt:"", min:12,
 pts:[
  "LBB là xét nghiệm CHẨN ĐOÁN và TIÊN LƯỢNG cho đốt sóng cao tần (RFA), không giảm đau lâu dài. Đồng thuận: SIJ chi phối từ nhánh sau L4–L5 và nhánh ngoài của nhánh sau S1–S3; chi phối phía trước còn tranh luận.",
  "Giải phẫu: tủy sống tận cùng L1–L2 → chùm đuôi ngựa; dây cùng thoát qua lỗ cùng trước/sau → nhánh trước (đám rối cùng) và nhánh sau. Nhánh trước khó nhắm (qua các tạng, nguy cơ tổn thương thần kinh); sợi L4–S2 có thể chi phối mặt trước (xác chết).",
  "Đám rối cùng phía sau (PSN): đóng góp S1 và S2 100%, S3 77% (hình ghi 88%), L5 8%, S4 4%; nhánh thoát ở 2–6 giờ (phải), 6–10 giờ (trái); đi qua mào cùng ngoài giữa củ ngang cùng 1 và 3.",
  "Nguyên tắc chung (cả huỳnh quang và siêu âm): KHÔNG an thần, KHÔNG steroid/chất phụ gia (tránh nhiễu), dùng thuốc tê tác dụng dài nồng độ cao (bupivacaine 0,75% có thể giảm đau đến 24 giờ).",
  "Huỳnh quang (Soto): 16 mũi tiêm, nhiều vị trí, 2 độ sâu; nằm sấp, chụp tại khoang đĩa L5–S1; kim chọc tủy sống đặt quanh lỗ cùng sau, cách 8–10 mm.",
  "Đồng hồ lỗ cùng (bờ ngoài là tâm): bên phải S1, S2: 2:30, 4:00, 5:30; bên trái 9:30, 8:00, 6:30; S3: phải 2:30, 4:00; trái 9:30, 8:00. Mỗi điểm 0,2 mL bupivacaine 0,75%, rút kim ~3 mm, tiêm thêm 0,2 mL.",
  "Bằng chứng Dreyfuss (RCT): 7/10 giảm đau khi thăm dò dây chằng lỗ cùng (so với 1/10 giả dược); nhưng khi kích thích trong khớp chỉ 2/10 vs 0/10. Nhiều độ sâu vì nhánh nông hoặc sâu so với dây chằng cùng–chậu sau; nhiều điểm vì nhánh thoát hướng đầu, ngang hay đuôi.",
  "Siêu âm: nằm sấp, mặt cắt ngang; đầu dò cong C5–2 MHz; tìm khe cùng (đường giữa), giữ mào cùng giữa, lên phía đầu thấy lỗ cùng và mào cùng ngoài; kim in-plane.",
  "Triple-target (siêu âm): 1,5 mL giữa củ ngang S2–S3; 0,5 mL ngay trên củ S2; 0,5 mL phía ngoài ở mức củ S1 (tổng 3 mL/bên); quét dọc xác nhận trước khi tiêm. Một mũi ở S2 không lan đủ đến S1; kỹ thuật hai mũi cần kiểm chứng.",
  "So sánh: RCT cho thấy siêu âm thủ thuật ngắn hơn (thay đổi theo kinh nghiệm); hiệu quả khối không khác nhau dù huỳnh quang nhắm PSN đặc hiệu hơn.",
  "An toàn: nguy cơ thấp (chảy máu, nhiễm trùng tối thiểu). ASRA xem LBB là phong bế thần kinh ngoại biên nguy cơ thấp → thuốc chống đông/chống kết tập KHÔNG phải chống chỉ định, thường không cần ngừng. Vô trùng, không dùng lại lọ thuốc; LAST rất hiếm (75 kg: tối đa bupivacaine 0,75% = 225 mg = 30 mL).",
  "Ý nghĩa: giảm đau ≥50% sau LBB → tỷ lệ cao thành công lâu dài với RFA (Cohen: 8/9). Không đáp ứng LBB do: (1) chi phối phía trước còn tranh luận; (2) chi phối phía sau biến thiên, phức tạp."
 ],
 cards:[
  ["LBB là gì và để làm gì?","Phong bế các nhánh ngoài (S1–S3, ± L4–L5) phía sau SIJ; xét nghiệm chẩn đoán và tiên lượng thành công của RFA, không giảm đau lâu dài.","SIJ"],
  ["Chi phối SIJ theo đồng thuận?","Nhánh sau L4–L5 và nhánh ngoài của nhánh sau S1–S3.","SIJ"],
  ["Vì sao không nhắm nhánh trước?","Khó tiếp cận (qua các tạng), nguy cơ tổn thương thần kinh (đám rối cùng); vai trò gây đau còn tranh luận.","SIJ"],
  ["Tủy sống tận cùng ở mức nào?","L1–L2, rồi thành chùm đuôi ngựa (L2–L5, S1–S5, dây cụt).","SIJ"],
  ["Đóng góp vào đám rối cùng sau (PSN)?","S1 và S2 100%; S3 77% (hình ghi 88%); L5 8%; S4 4%.","SIJ"],
  ["Nhánh ngoài thoát khỏi lỗ cùng ở vị trí nào?","2–6 giờ bên phải; 6–10 giờ bên trái.","SIJ"],
  ["Nhánh ngoài đi qua cấu trúc nào?","Mào cùng ngoài, giữa củ ngang cùng 1 và 3.","SIJ"],
  ["Vì sao không an thần/steroid khi LBB?","Tránh giảm đau gây nhiễu từ thuốc tĩnh mạch hoặc steroid, để đánh giá đúng hiệu quả khối.","SIJ"],
  ["Thuốc tê dùng cho LBB?","Tác dụng dài, nồng độ cao: bupivacaine 0,75% (giảm đau đến 24 giờ).","SIJ"],
  ["Kỹ thuật Soto dưới huỳnh quang?","16 mũi tiêm, nhiều vị trí và 2 độ sâu quanh lỗ cùng S1–S3; kim cách lỗ 8–10 mm; chụp tại L5–S1.","SIJ"],
  ["Vị trí đồng hồ cho S1–S2 bên phải/trái?","Phải: 2:30, 4:00, 5:30; trái: 9:30, 8:00, 6:30. S3: phải 2:30, 4:00; trái 9:30, 8:00.","SIJ"],
  ["Liều mỗi điểm trong kỹ thuật Soto?","0,2 mL bupivacaine 0,75%, rút kim ~3 mm, tiêm thêm 0,2 mL.","SIJ"],
  ["Vì sao tiêm ở 2 độ sâu?","Nhánh ngoài có thể nằm nông hoặc sâu so với dây chằng cùng–chậu sau.","SIJ"],
  ["Vì sao tiêm nhiều điểm quanh lỗ?","Nhánh không thoát ở vị trí cố định: có thể hướng đầu, ngang hoặc đuôi.","SIJ"],
  ["Kết quả Dreyfuss (RCT)?","7/10 giảm đau khi thăm dò dây chằng lỗ cùng (1/10 giả dược); kích thích trong khớp chỉ 2/10 vs 0/10 được bảo vệ.","SIJ"],
  ["Đầu dò siêu âm cho LBB?","Đầu dò cong C5–2 MHz đặt ở xương cùng thấp; tìm khe cùng = đường giữa; giữ mào cùng giữa; lên phía đầu tìm lỗ cùng và mào cùng ngoài.","SIJ"],
  ["Triple-target siêu âm: 3 điểm và thể tích?","1,5 mL giữa củ ngang S2–S3; 0,5 mL ngay trên S2; 0,5 mL phía ngoài ở mức S1.","SIJ"],
  ["Vì sao không dùng một mũi tiêm ở S2?","Thuốc tê không lan đáng tin cậy đến mức S1.","SIJ"],
  ["So sánh huỳnh quang và siêu âm trong LBB?","Siêu âm ngắn hơn (thay đổi theo kinh nghiệm); hiệu quả khối không khác nhau.","SIJ"],
  ["Thuốc chống đông có phải chống chỉ định LBB?","Không: ASRA xem là phong bế thần kinh ngoại biên nguy cơ thấp; thường không cần ngừng thuốc (vẫn thận trọng nếu có yếu tố nguy cơ chảy máu khác).","SIJ"],
  ["Liều tối đa bupivacaine 0,75% cho 75 kg?","225 mg = 30 mL; nguy cơ LAST rất thấp vì lượng dùng nhỏ và hấp thu kém.","SIJ"],
  ["Ngưỡng LBB tiên đoán RFA?","Giảm đau ≥50% sau LBB → tỷ lệ cao thành công lâu dài với RFA (Cohen: 8/9).","SIJ"],
  ["Hai lý do không đáp ứng LBB?","Chi phối phía trước còn tranh luận; chi phối phía sau biến thiên và phức tạp (không chắc đã phủ mọi nhánh).","SIJ"]
 ],

  ["Nguyên tắc khi làm LBB?",["Không an thần, không steroid, dùng thuốc tê tác dụng dài","An thần sâu","Thêm steroid","Dùng lidocaine 0,5%"],0,"Để tránh nhiễu giảm đau và đánh giá đúng hiệu quả.","SIJ"],
  ["Thuốc tê điển hình trong LBB?",["Lidocaine 1%","Bupivacaine 0,75%","Procaine","Nước muối"],1,"Giảm đau đến 24 giờ.","SIJ"],
  ["Số mũi tiêm trong kỹ thuật Soto?",["3","8","16","32"],2,"Nhiều vị trí, 2 độ sâu.","SIJ"],
  ["Mỗi điểm trong kỹ thuật Soto tiêm bao nhiêu?",["0,2 mL, rút kim 3 mm, 0,2 mL nữa","5 mL","1 mL một lần","10 mL"],0,"Bupivacaine 0,75%.","SIJ"],
  ["Vì sao cần tiêm ở hai độ sâu?",["Cho đẹp","Nhánh có thể nằm nông hoặc sâu so với dây chằng cùng–chậu sau","Giảm thể tích","Do kim ngắn"],1,"Nhánh cũng thoát lỗ hướng đầu, ngang hoặc đuôi → nhiều điểm.","SIJ"],
  ["Kết quả Dreyfuss khi kích thích trong khớp?",["Chỉ 2/10 nhóm thuốc tê được bảo vệ khỏi đau","Cả 10/10","0/10 cả hai nhóm","8/10"],0,"Nghĩa là LBB chủ yếu làm tê vùng dây chằng phía sau.","SIJ"],
  ["Đầu dò siêu âm cho LBB?",["Đầu dò thẳng 15 MHz","Đầu dò cong C5–2 MHz","Đầu dò nội soi","Đầu dò tim"],1,"Tìm khe cùng làm mốc đường giữa.","SIJ"],

  ["Vì sao không dùng một mũi tiêm ở S2?",["Thuốc không lan đáng tin đến S1","Quá đau","Chống chỉ định","Quá rẻ"],0,"Kỹ thuật hai mũi cần kiểm chứng thêm.","SIJ"],
  ["So sánh siêu âm và huỳnh quang trong LBB?",["Siêu âm ngắn hơn, hiệu quả khối tương tự","Huỳnh quang luôn hiệu quả hơn","Siêu âm không dùng được","Siêu âm đau hơn"],0,"Thời gian dưới siêu âm thay đổi theo kinh nghiệm.","SIJ"],
  ["Thuốc chống đông với LBB?",["Chống chỉ định tuyệt đối","Không phải chống chỉ định, thường không cần ngừng","Luôn phải ngừng 7 ngày","Chỉ dùng heparin"],1,"ASRA xem là phong bế thần kinh ngoại biên nguy cơ thấp.","SIJ"],

{ id:8, t:"Chương 8 · Đốt sóng cao tần khớp cùng–chậu (RFA)", yt:"", min:20,
 pts:[
  "RFA: làm mất chi phối (denervation) các thần kinh dẫn đau SIJ bằng dòng sóng cao tần qua điện cực → tổn thương nhiệt; chết thần kinh do thoái hóa Wallerian; cần vài tuần mới đỡ; thần kinh tái sinh nên đau tái phát (6–12 tháng) → lặp lại.",
  "Bằng chứng: Ferrante 2001 (hồi cứu) 12/33 (36,4%) giảm ≥50%, trung bình 12 ± 1,2 tháng; Cohen 2003 8/9 (88,9%) ở 9 tháng (chọn nhờ LBB dương); RCT giả dược có lợi, rõ nhất tháng 3; phân tích gộp 2010: 60,1% >50% ở 3 tháng, 49,9% ở 6 tháng. Lợi ích: giảm đau kéo dài, giảm opioid.",
  "Đích: nhánh ngoài của nhánh sau L4–S3; tỷ lệ bắt được S1–S2 100%, S3 88%, L5 8%, S4 4%. Phía trước (nhánh sau L1–S2, TK mông trên, TK bịt) KHÔNG nhắm được bằng RFA. Điện cực cách lỗ cùng sau ≥7 mm.",
  "Chọn bệnh nhân bằng LBB (≥50%). Dreyfuss: LBB đặc biệt hữu ích để nhận đau từ dây chằng cùng–chậu sau; bổ sung cho phong bế trong khớp.",
  "Phối hợp thuốc: tiêm trước nước muối làm tổn thương lớn hơn (giảm trở kháng, tăng dẫn nhiệt); KHÔNG chỉ định kháng sinh; steroid không thường quy (trước RFA làm giảm tổn thương; sau RFA không giảm viêm thần kinh).",
  "Quy trình: an thần có ý thức, huỳnh quang; miếng tiếp đất, trở kháng 300–700 ohm (xác nhận vị trí, kiểm tra thiết bị); kích thích vận động 2 Hz 1–3 V, cảm giác 50 Hz; theo dõi nhiệt độ, điện áp, dòng, công suất.",
  "Miếng tiếp đất: đường quay về của dòng; diện tích rộng, gel dính; đặt xa điện cực (khoảng cách tỷ lệ nghịch nhiệt độ), vd bắp chân đối bên; cạnh dài hướng về kim; kiểm tra cách điện của kim.",
  "Thường quy (đơn cực): đến 90 °C, đến 120 giây, mô bị phá hủy từ 60 °C; phần lớn đã được thay thế. Làm lạnh (c-RFA): nước lạnh lưu thông, đầu kim ~60 °C vài phút, tổn thương lớn hơn gấp đôi nhưng không giảm đau lâu hơn.",
  "Lưỡng cực: 2 kim kề nhau tạo tổn thương dải; Roberts (xác chết): bắt nhiều nhánh hơn đơn cực; ít phức tạp, ít tia X, rẻ hơn c-RFA. Palisade (RCT 2016): khoảng cách kim >1 cm → 50% giảm đau ở 12 tháng; đúng 1 cm → <25%.",
  "Simplicity: đầu dò 3 điện cực, tổn thương dải liên tục, một lần đưa kim (có thể dùng 2 điện cực). Xung (pulsed): <45 °C, 500 kHz, 45–60 V, 2 xung/giây, 20 ms, 2 phút; không đốt, điều biến; bằng chứng hạn chế (Vallejo 72,7% ≥50%).",
  "Xếp hạng 6 tháng (phân tích gộp): c-RFA > nhiệt thường quy > xung; nhìn chung lưỡng cực có lợi thế nhờ tổn thương dải.",
  "Hạn chế: không denervate phía trước; dự đoán thất bại: tuổi >65 kèm đau lan dưới gối, dùng opioid thường xuyên; không vĩnh viễn (thần kinh tái sinh vài tháng–1 năm).",
  "Biến chứng: chảy máu, bỏng, nhiễm trùng, tổn thương thần kinh, viêm thần kinh. Phòng bỏng: miếng tiếp đất đúng; bệnh nhân an thần nguy cơ cao hơn; máy tạo nhịp/ICD không chống chỉ định nhưng cần hỏi bác sĩ tim mạch, đại diện hãng, nam châm, máy sốc ngoài."
 ],
 cards:[
  ["RFA là gì?","Làm mất chi phối thần kinh dẫn đau SIJ bằng dòng sóng cao tần tạo tổn thương nhiệt có kiểm soát.","SIJ"],
  ["Cơ chế chết thần kinh trong RFA?","Đứt sợi trục và thoái hóa sợi thần kinh (thoái hóa Wallerian); cần vài tuần mới đỡ đau.","SIJ"],
  ["Vì sao đau tái phát sau RFA?","Thần kinh tái sinh (vài tháng–1 năm) → lặp lại thủ thuật.","SIJ"],
  ["Ferrante 2001?","Nghiên cứu lâm sàng đầu tiên: 12/33 (36,4%) giảm ≥50%, trung bình 12 ± 1,2 tháng.","SIJ"],
  ["Cohen 2003?","8/9 (88,9%) giảm ≥50% ở 9 tháng; bệnh nhân chọn nhờ LBB thành công.","SIJ"],
  ["Phân tích gộp 2010 (9 nghiên cứu)?","60,1% giảm >50% ở 3 tháng; 49,9% ở 6 tháng.","SIJ"],
  ["Lợi ích của RFA?","Giảm đau kéo dài (đến 1 năm) và giảm dùng opioid.","SIJ"],
  ["Tỷ lệ bắt được nhánh ngoài (RFA)?","S1–S2 100%; S3 88%; L5 8%; S4 4%.","SIJ"],
  ["Phần nào của SIJ không nhắm bằng RFA?","Phía trước (nhánh sau L1–S2, TK mông trên, TK bịt).","SIJ"],
  ["Khoảng cách điện cực đến lỗ cùng sau?","Ít nhất 7 mm để tránh làm hỏng dây thần kinh tủy.","SIJ"],
  ["Dreyfuss về LBB và RFA?","LBB hữu ích nhận đau từ dây chằng cùng–chậu sau; SIJ còn chi phối bổ sung; LBB và phong bế trong khớp bổ sung nhau.","SIJ"],
  ["Tiêm nước muối trước RFA để làm gì?","Tăng kích thước tổn thương (giảm trở kháng, tăng dẫn nhiệt).","SIJ"],
  ["Kháng sinh và steroid trong RFA?","Không chỉ định kháng sinh; steroid không thường quy (trước RFA giảm tổn thương; sau RFA không giảm viêm thần kinh).","SIJ"],
  ["Trở kháng chuẩn?","300–700 ohm: xác nhận vị trí điện cực (không quá gần mạch máu hoặc xương) và hệ thống nguyên vẹn.","SIJ"],
  ["Kích thích thần kinh trước khi đốt?","Vận động 2 Hz, 1–3 V (không ảnh hưởng thần kinh vận động); cảm giác 50 Hz tùy thầy thuốc (tránh hạch rễ sau).","SIJ"],
  ["Miếng tiếp đất đặt thế nào?","Dán chắc, xa điện cực (vd bắp chân đối bên); cạnh dài hướng về kim; để dòng thoát qua diện tích rộng, tránh bỏng.","SIJ"],
  ["RFA thường quy?","Đơn cực, đến 90 °C, đến 120 giây; mô bị phá hủy từ 60 °C; phần lớn được thay thế.","SIJ"],
  ["RFA làm lạnh (c-RFA)?","Nước lạnh lưu thông, đầu kim ~60 °C vài phút; tổn thương lớn hơn gấp đôi; không làm giảm đau lâu hơn.","SIJ"],
  ["RFA lưỡng cực?","Hai kim kề nhau tạo tổn thương dải; bắt nhiều nhánh hơn đơn cực; ít phức tạp, ít tia X, rẻ hơn c-RFA.","SIJ"],
  ["Kỹ thuật palisade?","Lưỡng cực cải tiến, khoảng cách kim >1 cm: 50% giảm đau ở 12 tháng (đúng 1 cm: <25%) (RCT 2016).","SIJ"],
  ["Đầu dò Simplicity?","3 điện cực, tổn thương dải liên tục, một lần đưa kim; có thể dùng 2 điện cực.","SIJ"],
  ["RFA xung (pulsed)?","<45 °C, 500 kHz, 45–60 V, 2 xung/giây, 20 ms, 2 phút; không đốt, điều biến; bằng chứng hạn chế; Vallejo 72,7% giảm ≥50%.","SIJ"],
  ["Xếp hạng hiệu quả ở 6 tháng?","c-RFA > nhiệt thường quy > xung (phân tích gộp).","SIJ"],
  ["Yếu tố dự đoán thất bại RFA?","Tuổi >65 kèm đau lan dưới gối; đang dùng opioid thường xuyên.","SIJ"],
  ["Biến chứng RFA?","Chảy máu, bỏng, nhiễm trùng, tổn thương thần kinh, viêm thần kinh.","SIJ"],
  ["Bệnh nhân máy tạo nhịp/ICD?","Không chống chỉ định; hỏi bác sĩ tim mạch/điện sinh lý; đại diện hãng, nam châm, máy sốc ngoài.","SIJ"]
 ],

  ["Kháng sinh dự phòng trong RFA?",["Không chỉ định nếu vô trùng đúng","Bắt buộc","Chỉ cho người béo","Luôn dùng 7 ngày"],0,"Nguy cơ nhiễm trùng rất thấp.","SIJ"],

  ["Kích thích vận động trước khi đốt?",["2 Hz, 1–3 V","50 Hz, 10 V","200 Hz, 0,1 V","Không cần"],0,"Cảm giác 50 Hz tùy thầy thuốc.","SIJ"],
  ["Miếng tiếp đất nên đặt?",["Xa điện cực (vd bắp chân đối bên)","Sát điện cực","Trên ngực","Không cần"],0,"Khoảng cách tỷ lệ nghịch với nhiệt độ sinh ra.","SIJ"],
  ["RFA thường quy tạo tổn thương ở nhiệt độ?",["Đến 90 °C, đến 120 giây","Dưới 45 °C","30 °C","200 °C"],0,"Mô bị phá hủy từ 60 °C.","SIJ"],
  ["c-RFA có đặc điểm?",["Tổn thương lớn gấp đôi nhưng không giảm đau lâu hơn","Không đốt","Chỉ dùng nước muối","Nhiệt độ 200 °C"],0,"Đầu kim ~60 °C vài phút.","SIJ"],
  ["RFA lưỡng cực so với đơn cực?",["Bắt nhiều nhánh ngoài hơn","Bắt ít hơn","Luôn đắt hơn","Không có tổn thương"],0,"Cũng ít phức tạp, ít tia X, rẻ hơn c-RFA.","SIJ"],
  ["Palisade: khoảng cách kim >1 cm cho kết quả?",["50% giảm đau ở 12 tháng","<25% ở 12 tháng","Không khác","Không dùng được"],0,"Đúng 1 cm: <25%.","SIJ"],
  ["Đầu dò Simplicity có mấy điện cực?",["3","1","6","10"],0,"Tổn thương dải liên tục, một lần đưa kim.","SIJ"],
  ["RFA xung có đặc điểm?",["Dưới 45 °C, không đốt, điều biến","Đốt 90 °C","Cần nước lạnh","Là kỹ thuật cổ điển nhất"],0,"500 kHz, 45–60 V, 2 xung/giây, 20 ms, 2 phút.","SIJ"],
  ["Xếp hạng hiệu quả ở 6 tháng?",["c-RFA > thường quy > xung","Xung > thường quy > c-RFA","Thường quy > xung > c-RFA","Tất cả bằng nhau"],0,"Phân tích gộp.","SIJ"],
  ["Yếu tố dự đoán thất bại RFA?",["Tuổi >65 kèm đau dưới gối; dùng opioid thường xuyên","Tuổi trẻ","Nữ giới","Cân nặng thấp"],0,"Ngoài ra RFA không vĩnh viễn.","SIJ"],
  ["Bệnh nhân có máy tạo nhịp khi RFA?",["Không chống chỉ định nhưng cần hỏi bác sĩ tim mạch","Chống chỉ định tuyệt đối","Không cần thận trọng","Chỉ khi nam"],0,"Nam châm, đại diện hãng, máy sốc ngoài.","SIJ"]
 ]}
);


/* ----- Giao diện mục Đau khớp cùng chậu ----- */
(function(){
  const st=document.createElement("style");
  st.textContent=".sijtabs{display:flex;gap:6px;margin:10px 0}.sijtabs button{flex:1;min-height:var(--tap);border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:10px;font-weight:700;cursor:pointer}.sijtabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}a.btn.block{display:block;text-align:center;text-decoration:none}.sijpts{margin:0;padding-left:20px}.sijpts li{margin:8px 0;line-height:1.55}";
  document.head.appendChild(st);
})();

let sijCh=0, sijMode="sum", sijKnown=LS.get("pp-sij-known",{}), sijScores=LS.get("pp-sij-scores",{});
let sijCi=0, sijFlip=false, sijOnlyNew=false;
let sijQ={order:[],pos:0,right:0,ord:null,picked:null,wrong:[],redo:false};

function sijShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sijStart(idxs,redo){sijQ={order:sijShuffle(idxs),pos:0,right:0,ord:null,picked:null,wrong:[],redo:!!redo};}
function sijReset(){sijCi=0;sijFlip=false;const n=SIJ[sijCh].quiz.length;sijStart(Array.from({length:n},(_,i)=>i),false);}
sijReset();

function sijChips(){return SIJ.map((c,i)=>`<button data-sijch="${i}" class="${sijCh===i?"on":""}">Chương ${c.id}</button>`).join("");}

function sijVideo(c){
  const L=Array.isArray(c.yt)?c.yt:(c.yt?[c.yt]:[]);
  if(!L.length) return `<div class="note"><b>Link video sẽ được thêm sau.</b> Bài giảng dài khoảng ${c.min} phút.</div>`;
  return L.map((u,i)=>`<a class="btn pri block" style="margin-bottom:8px" href="${esc(u)}" target="_blank" rel="noopener">▶ ${L.length>1?"Video "+(i+1)+"/"+L.length:"Xem video bài giảng"} trên YouTube</a>`).join("");
}

function sijView(){
  const c=SIJ[sijCh];
  const head=`<div class="card"><h2>${esc(c.t)}</h2><div class="body">${sijVideo(c)}
    <div class="sijtabs">${[["sum","Tóm tắt"],["card","Thẻ ôn"],["quiz","Kiểm tra"]].map(([k,l])=>`<button data-sijmode="${k}" aria-pressed="${sijMode===k}">${l}</button>`).join("")}</div></div></div>`;
  if(sijMode==="sum") return head+`<div class="card"><h2>Ý chính cần nhớ · ${c.pts.length} ý</h2><div class="body"><ol class="sijpts">${c.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></div><div class="note">Tóm tắt soạn từ sách ${chips(["SIJ"])}. Với số liệu quan trọng, đối chiếu lại sách gốc.</div></div>`;
  if(sijMode==="card") return head+sijCardView(c);
  return head+sijQuizView(c);
}

function sijCardView(c){
  const all=c.cards;
  const list=all.map((x,i)=>({x,i})).filter(o=>!sijOnlyNew||!sijKnown[`${c.id}-${o.i}`]);
  const nk=all.filter((_,i)=>sijKnown[`${c.id}-${i}`]).length;
  const top=`<div class="card"><h2>Thẻ ôn · Chương ${c.id}</h2><div class="row"><span class="nm">Đã nhớ</span><span class="sub"><span class="bar" style="display:block;margin-top:4px"><i style="width:${nk/all.length*100}%"></i></span></span><span class="val">${nk}<small>/ ${all.length}</small></span></div><div class="note"><label class="flexr"><input type="checkbox" id="sijonlynew" ${sijOnlyNew?"checked":""}> Chỉ hiện thẻ chưa nhớ</label></div></div>`;
  if(!list.length) return top+`<div class="card"><div class="empty"><b>Đã nhớ hết ${all.length} thẻ</b><br><button class="btn" style="margin-top:10px" data-sijact="allcards">Ôn lại toàn bộ</button></div></div>`;
  if(sijCi>=list.length) sijCi=0; const {x,i}=list[sijCi];
  return top+`<div class="flip ${sijFlip?"on":""}" data-sijact="flip" role="button" tabindex="0" aria-label="Lật thẻ"><div class="in">
  <div class="face"><span class="lbl">Thẻ ${sijCi+1}/${list.length} · Câu hỏi</span><div class="q">${esc(x[0])}</div><span class="s">Chạm để xem đáp án</span></div>
  <div class="face back"><span class="lbl">Đáp án</span><div>${esc(x[1])}</div><span class="s">Nguồn: ${x[2]}</span></div></div></div>
  <div class="cardnav"><button class="btn bad" data-sijknow="0" data-i="${i}">Chưa nhớ</button><button class="btn good" data-sijknow="1" data-i="${i}">Đã nhớ</button></div>`;
}

function sijQuizView(c){
  const Q=c.quiz, S=sijQ, best=sijScores[c.id];
  const bestTxt=best?` · Tốt nhất ${best.r}/${best.n}`:"";
  if(S.pos>=S.order.length){
    const tot=S.order.length;
    return `<div class="card"><h2>Kết quả · Chương ${c.id}${S.redo?" (làm lại câu sai)":""}</h2><div class="empty"><div class="big">${S.right}/${tot}</div>
    <p class="muted small">${S.right/tot>=.8?"Đạt mục tiêu (≥80%).":"Dưới 80%: nên xem lại tóm tắt và thẻ ôn rồi làm lại."}</p>
    ${S.wrong.length?`<button class="btn pri" data-sijact="redowrong">Làm lại ${S.wrong.length} câu sai</button> `:""}
    <button class="btn" data-sijact="restart">Làm lại toàn bộ (xáo thứ tự)</button></div></div>`;
  }
  const qi=S.order[S.pos], q=Q[qi];
  if(!S.ord) S.ord=sijShuffle(q[1].map((_,j)=>j));
  const ord=S.ord;
  return `<div class="card"><h2>Câu ${S.pos+1}/${S.order.length} · Đúng ${S.right}${bestTxt}</h2><div class="body">
  <div class="bar"><i style="width:${S.pos/S.order.length*100}%"></i></div>
  <div class="title" style="font-size:16px">${esc(q[0])}</div>
  ${ord.map((j,k)=>`<button class="opt ${S.picked==null?"":j===q[2]?"right":j===S.picked?"wrong":""}" data-sijpick="${j}" ${S.picked!=null?"disabled":""}>${String.fromCharCode(65+k)}. ${esc(q[1][j])}</button>`).join("")}</div>
  ${S.picked!=null?`<div class="note"><b>${S.picked===q[2]?"Đúng.":"Chưa đúng."}</b> ${esc(q[3])} ${chips([q[4]])}</div><div class="body"><button class="btn pri block" data-sijact="next">${S.pos+1<S.order.length?"Câu tiếp":"Xem kết quả"}</button></div>`:""}</div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-sijch],[data-sijmode],[data-sijact],[data-sijknow],[data-sijpick]"); if(!b) return;
  const c=SIJ[sijCh];
  if(b.dataset.sijch!==undefined){sijCh=Number(b.dataset.sijch);sijReset();return render();}
  if(b.dataset.sijmode){sijMode=b.dataset.sijmode;return render();}
  if(b.dataset.sijknow!==undefined){const k=`${c.id}-${b.dataset.i}`; if(b.dataset.sijknow==="1") sijKnown[k]=1; else delete sijKnown[k]; LS.set("pp-sij-known",sijKnown); sijFlip=false; if(!(sijOnlyNew&&b.dataset.sijknow==="1")) sijCi++; return render();}
  if(b.dataset.sijpick!==undefined){
    if(sijQ.picked!=null) return;
    sijQ.picked=Number(b.dataset.sijpick); const qi=sijQ.order[sijQ.pos];
    if(sijQ.picked===c.quiz[qi][2]) sijQ.right++; else sijQ.wrong.push(qi);
    return render();
  }
  const a=b.dataset.sijact;
  if(a==="flip"){sijFlip=!sijFlip;b.classList.toggle("on",sijFlip);return;}
  if(a==="allcards"){sijOnlyNew=false;sijCi=0;return render();}
  if(a==="next"){
    sijQ.pos++;sijQ.picked=null;sijQ.ord=null;
    if(sijQ.pos>=sijQ.order.length&&!sijQ.redo){const prev=sijScores[c.id];if(!prev||sijQ.right>prev.r){sijScores[c.id]={r:sijQ.right,n:sijQ.order.length};LS.set("pp-sij-scores",sijScores);}}
    return render();
  }
  if(a==="restart"){sijReset();return render();}
  if(a==="redowrong"){const w=sijQ.wrong.slice();sijStart(w,true);return render();}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.sijact==="flip"){e.preventDefault();e.target.click();}});
document.addEventListener("change",e=>{if(e.target.id==="sijonlynew"){sijOnlyNew=e.target.checked;sijCi=0;sijFlip=false;render();}});

window.addEventListener("hashchange",()=>{tab=tabFromHash();render();});
tab=tabFromHash(); render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}
</script>
